        - text: (字段级，配字典唯一名称字段)=本表兜底成员，外键引用本表留空时由引擎按它【反查字典→找不到就建→拿 id 关联】；
        - code [ref=e3012]: 检索.级别
        - text: =本表内哪些字段参与检索、谁优先。互不相干。
