      - { key: total_amount, title: 金额, dataIndex: total_amount, renderMode: text, minWidth: 90, align: center, order: 40, cellSpec: { display: text, editEntry: none } }
      - { key: status, title: 状态, dataIndex: status, minWidth: 80, align: center, order: 50, cellSpec: { display: enum-tag, editEntry: none } }
