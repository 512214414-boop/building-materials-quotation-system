# 统计口径（区间汇总，与 summaryService/rangeSummary 一致）
indicators:
  - { id: salesAmount, label: 销售额, aggregate: SUM(document_lines.amount) }
  - { id: paymentAmount, label: 回款, aggregate: SUM(payment_records.amount), filter: reconcile_status=reconciled }
  - { id: costAmount, label: 成本, aggregate: SUM(cost_lines.cost_amount) }
  - { id: refundAmount, label: 退货扣减, aggregate: SUM(refund_lines.refund_amount), filter: refund_type=refund }
  - { id: netProfit, label: 净利润, formula: salesAmount - costAmount - refundAmount }
