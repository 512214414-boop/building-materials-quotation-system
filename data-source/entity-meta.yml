# ─────────────────────────────────────────────
# 动作守卫（操作守卫）：判定能描述为「字段/行数/状态」的才声明，读 actionMeta 解读。
#   requires    表单字段必填（组内缺任一 → 该组 reason）
#   minSelected 有效行数下限
#   numbers     表单数值校验（form 字段转 number 比较）
#   rowNumerics 每行数值校验（reason 支持 {占位} 从该行取值）
#   states      状态机（allow/forbid）
# 依赖多请求时序、多表联合对账的守卫 → 例外，代码写 + 登记在案，不进 yml。
# ─────────────────────────────────────────────
# ─────────────────────────────────────────────
# 资源接口（resources）：实体 → 后端通用接口的声明
#   驱动后端资源引擎（backend/src/controllers/resourceController.ts）：
#   列表 / 详情 / 新建 / 改 / 删 / 快建 / 引用计数，全部由配置产出，零手写 handler。
#   permission 权限叶子 · writable 可写字段白名单（越界字段直接拒绝）
#   include 关联预载 · softDelete 软删除字段 · audit 审计动作 · search 检索配置
# ─────────────────────────────────────────────
# ---------- 字段定义登记表（L5·字段级行为唯一真相源） ----------
# 一个字段定义了是什么、从哪来，它全站的确认层行为（能力 + 路径）就定了。
# 调用方只声明 field 名，框架从本表推导：identity（有无 ID）→ 能力；dict → 值来源；
# scene → 填法（档案分列 dict / 开单混写 mixed）。差异降为参数，禁止调用方手写第二套路径。
# layer 不在此重复声明——生成器从 dict 指向的 entities[].layer 继承（category/brand/unit/price_type=globalDict，supplier=subject）。
fieldDefs:
  category:  { identity: byId, dict: category,   scene: { archive: { entry: dict },  workbench: { entry: mixed } } }
  brand:     { identity: byId, dict: brand,      scene: { archive: { entry: dict },  workbench: { entry: mixed } } }
  unit:      { identity: byId, dict: unit,       scene: { archive: { entry: dict },  workbench: { entry: dict } } }
  priceType: { identity: byId, dict: price_type, scene: { archive: { entry: dict },  workbench: { entry: dict } } }
  supplier:  { identity: byId, dict: supplier,   scene: { archive: { entry: dict },  workbench: { entry: mixed } } }
  remark:    { identity: byText }
# ─────────────────────────────────────────────
resources:
  supplier:
    label: 供应商档案
    table: supplier
    # model：Prisma 模型名（entity-meta 的 model 名与 @@map 的表名可能不同，如 customer→customers）
    model: supplier
    primaryKey: id
    permission: supplier_manage
    softDelete: { field: status, off: 0 }
    writable: [name, remark, status]
    # include：Prisma 关联名（必须与 schema.prisma 的 relation 名一致）
    #   注：前端「经营范围」是 businessCategories + businessBrands 两个关联的合并视图，
    #      不是单个 Prisma 关联，故此处按真实关联登记
    include: [contacts, addresses, businessCategories, businessBrands]
    audit: [supplier_create, supplier_update, supplier_delete, supplier_quick_add, supplier_status]
    search:
      fields: [name]
      mode: normalized
      dictUnique: global
    # refTargets：删除前的引用计数目标（前端展示"删除会影响哪些单据"）
    refTargets:
      - { label: 进价记录, table: purchase_price, field: supplierId }
      - { label: 应付行, table: supplier_payable_lines, field: supplier_id }
      - { label: 采购入库单, table: purchase_inbounds, field: supplier_id }
  category:
    label: 分类档案
    table: category
    model: category
    primaryKey: id
    primaryKeyType: int
    permission: category_manage
    softDelete: { field: status, off: 0 }
    writable: [name, sortOrder, status]
    audit: [category_create, category_update, category_delete, category_quick_add]
    search:
      fields: [name]
      mode: normalized
      dictUnique: global
    refTargets:
      - { label: 产品, table: product, field: categoryId }
      - { label: 供应商经营范围, table: business_categories, field: categoryId }
  brand:
    label: 品牌档案
    table: brand
    model: brand
    primaryKey: id
    permission: brand_manage
    softDelete: { field: status, off: 0 }
    writable: [name, status]
    audit: [brand_create, brand_update, brand_delete, brand_quick_add]
    search:
      fields: [name]
      mode: normalized
      dictUnique: global
    refTargets:
      - { label: 产品, table: product, field: brandId }
      - { label: 供应商经营范围, table: business_brands, field: brandId }
  unit:
    label: 单位档案
    table: unit
    model: unit
    primaryKey: id
    permission: unit_manage
    softDelete: { field: status, off: 0 }
    writable: [unitName, status]
    audit: [unit_create, unit_update, unit_delete, unit_quick_add]
    search:
      fields: [unitName]
      mode: normalized
      dictUnique: global
    refTargets:
      - { label: 规格单位, table: spec_unit, field: unitId }
  price_type:
    label: 价格类型档案
    table: price_type
    model: price_type
    primaryKey: id
    permission: price_type_manage
    softDelete: { field: status, off: 0 }
    writable: [name, sortOrder, status]
    audit: [price_type_create, price_type_update, price_type_delete, price_type_quick_add]
    search:
      fields: [name]
      mode: normalized
      dictUnique: global
    refTargets:
      - { label: 规格价格类型, table: spec_price_unit, field: priceTypeId }
  # ── 档案类主体（subject）：全走零代码 CRUD（与 globalDict 同机制）──
  product:
    label: 产品档案
    table: product
    model: product
    primaryKey: id
    permission: product_manage
    softDelete: { field: status, off: 0 }
    writable: [name, categoryId, remark, status]
    audit: [product_create, product_update, product_delete]
    search:
      fields: [name]
      mode: normalized
      dictUnique: parent
    refTargets:
      - { label: 单据行, table: document_lines, field: productId }
      - { label: 库存, table: inventory, field: productId }
  customer:
    label: 客户档案
    table: customers
    model: customer
    primaryKey: id
    permission: customer_manage
    writable: [name, phone, wechat, company, note, customer_type, status]
    audit: [customer_update, customer_delete, customer_status_change]
    search:
      fields: [name, phone]
      mode: normalized
    refTargets:
      - { label: 单据, table: documents, field: customerId }
      - { label: 客户地址, table: customer_addresses, field: customerId }
  # ── 单据类（row/document/snapshot）：只登记读与列表，写操作走实体专属 service ──
  inventory:
    label: 库存
    table: inventory
    model: inventory
    primaryKey: id
    permission: inventory
    readOnly: true
  inventory_ledger:
    label: 库存流水
    table: inventory_ledger
    model: inventory_ledger
    primaryKey: id
    permission: inventory
    readOnly: true
  inbound_task:
    label: 待入库单
    table: inbound_tasks
    model: inbound_task
    primaryKey: id
    permission: inventory
    readOnly: true
    search:
      fields: [inbound_no]
      mode: normalized
  inbound_line:
    label: 待入库明细
    table: inbound_lines
    model: inbound_line
    primaryKey: id
    permission: inventory
    readOnly: true
  backorder:
    label: 欠库
    table: backorders
    model: backorder
    primaryKey: id
    permission: inventory
    readOnly: true
  purchase_inbound:
    label: 采购入库单
    table: purchase_inbounds
    model: purchase_inbound
    primaryKey: id
    permission: inventory
    readOnly: true
    search:
      fields: [purchaseNo]
      mode: normalized
  staff_document:
    label: 员工端单据
    table: documents
    model: document
    primaryKey: id
    permission: purchase_quote
    readOnly: true
    search:
      fields: [documentNo]
      mode: normalized
  document_line:
    label: 单据行（快照）
    table: document_lines
    model: document_line
    primaryKey: id
    permission: purchase_quote
    readOnly: true
  audit_log:
    label: 审计日志
    table: audit_logs
    model: audit_log
    primaryKey: id
    permission: audit_log_manage
    readOnly: true
  auth_code:
    label: 授权码
    table: authorization_codes
    model: authorization_code
    primaryKey: id
    permission: auth_code_manage
    readOnly: true
    search:
      fields: [code]
      mode: normalized
  access_request:
    label: 访问申请
    table: access_requests
    model: access_request
    primaryKey: id
    permission: access_request_manage
    readOnly: true
    search:
      fields: [phone]
      mode: normalized
  admin_user:
    label: 员工账号
    table: users
    model: user
    primaryKey: id
    permission: user_manage
    readOnly: true
    search:
      fields: [username]
      mode: normalized

# ─────────────────────────────────────────────
# 页面装配（pages）：实体 → 前端页面的声明
#   驱动前端页面装配器（frontend/src/shared/config/pageAssembler.ts）：
#   列表组件 + 槽位编排 + 单元格编辑器，页面本身只做「读配置 + 注入专属 Editor」。
#   slots 的数组顺序 = 列表列顺序（与登记表「列顺序是配置值不是推导」同口径）
#   fixedSlots 固定槽位（操作 / 序号 / 状态）
# ─────────────────────────────────────────────
pages:
  supplier:
    label: 供应商管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [op, seq, status]
    slots:
      - { key: name, title: 供应商名称, slot: name, editor: NameLinkCell }
      - { key: contacts, title: 联系信息, slot: matrix, editor: ArchiveContactMatrixEditor }
      - { key: addresses, title: 地址, slot: matrix, editor: ArchiveSupplierAddressMatrixEditor }
      - { key: businessScope, title: 经营范围, slot: custom, editor: SupplierBusinessScopePicker }
      - { key: remark, title: 备注, slot: scalar, editor: ArchiveFieldCell }
  category:
    label: 分类管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [seq, status]
    slots:
      - { key: name, title: 分类名称, slot: scalar, editor: ArchiveFieldCell }
      - { key: sortOrder, title: 排序号, slot: scalar, editor: ArchiveFieldCell }
  brand:
    label: 品牌管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [seq, status]
    slots:
      - { key: name, title: 品牌名称, slot: scalar, editor: ArchiveFieldCell }
  unit:
    label: 单位管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [seq, status]
    slots:
      - { key: unitName, title: 单位名称, slot: scalar, editor: ArchiveFieldCell }
  price_type:
    label: 价格类型管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [seq, status]
    slots:
      - { key: name, title: 类型名称, slot: scalar, editor: ArchiveFieldCell }
      - { key: sortOrder, title: 排序, slot: scalar, editor: ArchiveFieldCell }
  # ── 档案类主体（subject）：customer 与 supplier 同壳 ArchiveSlotHost，
  #    列顺序经 assembleSlots('customer') 读本段，与 supplier 同构 ──
  customer:
    label: 客户管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [op, status]
    slots:
      - { key: name, title: 姓名, slot: name, editor: NameCell }
      - { key: customerType, title: 类型, slot: scalar, editor: ArchiveFieldCell }
      - { key: contacts, title: 联系信息, slot: matrix, editor: ArchiveContactMatrixEditor }
      - { key: invoices, title: 开票信息, slot: matrix, editor: ArchiveCustomerInvoiceMatrixEditor }
      - { key: addresses, title: 收货地址, slot: matrix, editor: ArchiveCustomerAddressMatrixEditor }
      - { key: note, title: 备注, slot: scalar, editor: ArchiveFieldCell }

actions:
  purchase_inbound_confirm:
    label: 确认采购入库
    guard:
      requires:
        - { fields: [supplierId], reason: 请选择供应商 }
        - { fields: [warehouseId], reason: 请选择入库仓库 }
      minSelected: { n: 1, reason: 请先选品，再确认入库 }
      rowNumerics:
        - { field: qty, op: gt, ref: 0, reason: '「{productRef}」数量必须大于 0' }
        - { field: unitCost, op: ge, ref: 0, reason: '「{productRef}」进价不能为负' }
  purchase_price_batch_adjust:
    label: 批量调整进价
    guard:
      requires:
        - { fields: [supplierId, brandInput, categoryInput], reason: 请先选择供应商、品牌、分类 }
      numbers:
        - { field: oldPoint, op: gt, ref: 0, reason: 请填写旧点位 }
        - { field: newPoint, op: gt, ref: 0, reason: 请填写新点位 }
  inventory_adjust:
    label: 盘点调整
    guard:
      numbers:
        - { field: targetQty, op: ge, ref: 0, reason: 盘点后数量必须 ≥ 0 }
        - { field: unitCost, op: ge, ref: 0, reason: 期初/盘点成本必须 ≥ 0 }
  inventory_opening:
    label: 期初入库
    guard:
      requires:
        - { fields: [warehouseId], reason: 请选择仓库 }
        - { fields: [sku, unit], reason: 请先选品 }
      numbers:
        - { field: qty, op: gt, ref: 0, reason: 期初数量必须大于 0 }
        - { field: unitCost, op: ge, ref: 0, reason: 期初成本不能为负 }
  staff_login:
    label: 员工登录
    guard:
      requires:
        - { fields: [username], reason: 请输入用户名 }
        - { fields: [password], reason: 请输入密码 }
  customer_verify:
    label: 授权码准入
    guard:
      requires:
        - { fields: [authCode], reason: 请输入授权码 }
      formats:
        - { field: phone, pattern: '^[A-Za-z0-9_+.-]{1,200}$', reason: 请输入登录账号（电话或微信） }
  customer_access_request:
    label: 申请准入
    guard:
      formats:
        - { field: phone, pattern: '^[A-Za-z0-9_+.-]{1,200}$', reason: 请输入登录账号（电话或微信） }
  refund_add_lines:
    label: 添退换记录
    guard:
      minSelected: { n: 1, reason: 请先对上已卖行 }
      rowNumerics:
        - { field: qty, op: gt, ref: 0, reason: '{productRef} 退换数量必须大于 0' }
        - { field: qty, op: le, refField: remaining, reason: '{productRef} 不能超过剩余可退量 {remaining}' }
  refund_add_single:
    label: 单个添退换
    guard:
      requires:
        - { fields: [selectedSold], reason: 请先对上已卖行 }
  refund_edit_line:
    label: 改退换数量
    guard:
      numbers:
        - { field: refundQty, op: gt, ref: 0, reason: 退换数量必须大于 0 }
  quote_recognize:
    label: 识别开单文本
    guard:
      requires:
        - { fields: [recognizeText], reason: 请粘贴订单文本 }
  payment_quick_add:
    label: 快捷记收款
    guard:
      numbers:
        - { field: amount, op: gt, ref: 0, reason: 金额必须为正数 }
  detail_add_to_doc:
    label: 加入订单
    guard:
      numbers:
        - { field: qty, op: gt, ref: 0, reason: 请输入有效数量 }
  inbound_set_target:
    label: 设置目标仓库
    guard:
      requires:
        - { fields: [target], reason: 请选择目标仓库 }
  price_edit_add:
    label: 新增价格
    guard:
      requires:
        - { fields: [specBrandId, unitId], reason: 请先选择产品与单位 }
      numbers:
        - { field: inputValue, op: gt, ref: 0, reason: 请先输入有效价格 }
  price_archive_confirm:
    label: 价格写入档案
    guard:
      requires:
        - { fields: [selectedPriceTypeId], reason: 请选择价格类型 }
  unit_quick_add:
    label: 单位快建
    guard:
      requires:
        - { fields: [name], reason: 请先输入单位名 }
  archive_sales:
    label: 定档销售
    guard:
      states: { allow: [true], reason: 请先完成 V9 店长汇总确认 }
  archive_logistics:
    label: 定档物流
    guard:
      states: { allow: [true], reason: 请先完成 V9 店长汇总确认 }
  archive_costs:
    label: 定档成本
    guard:
      states: { allow: [true], reason: 请先完成 V9 店长汇总确认 }
  purchase_recognize:
    label: 识别订单文字
    guard:
      requires:
        - { fields: [recognizeText], reason: 请粘贴订单文字 }
  purchase_commit_qty:
    label: 提交数量
    guard:
      numbers:
        - { field: newQty, op: gt, ref: 0, reason: 数量必须大于 0 }
  purchase_submit_demand:
    label: 提交需求
    guard:
      minSelected: { n: 1, reason: 请先添加物料 }
  product_save:
    label: 保存产品
    guard:
      requires:
        - { fields: [productName], reason: 请输入产品名称 }
  document_recognize:
    label: 识别订单文本
    guard:
      requires:
        - { fields: [recognizeText], reason: 请粘贴订单文本 }
  allocation_source_quick_add:
    label: 配货来源快建
    guard:
      requires:
        - { fields: [kw], reason: 先打名称再新建 }
  quick_create_confirm:
    label: 快速建档确认
    guard:
      requires:
        - { fields: [productName], reason: 请输入产品名称 }
  supplier_quick_add:
    label: 供应商快建
    guard:
      requires:
        - { fields: [keyword], reason: 先输入供应商名称 }
  reimbursement_save:
    label: 保存报销单
    guard:
      minSelected: { n: 1, reason: 至少保留一行有效商品 }
  customer_quick_add:
    label: 客户快建
    guard:
      requiresAny:
        - { fields: [phone, name], reason: 姓名与联系方式至少填一个 }
  sale_price_apply:
    label: 价格类型应用
    guard:
      rowUnique:
        - { in: unitSalePrices, keys: [ { field: priceTypeId, against: nextId } ], reason: '价格类型「{name}」已存在，可在上方行直接编辑' }
  purchase_price_edit_supplier:
    label: 改供应商进价
    guard:
      rowUnique:
        - { in: purchasePrices, keys: [ { field: supplierId, against: newId }, { field: unitIdx, against: unitIdx } ], except: { field: rowKey, against: rowKey }, reason: '供应商「{newName}」已存在，不可重复' }
  purchase_price_add_derived:
    label: 派生供应商进价
    guard:
      rowUnique:
        - { in: purchasePrices, keys: [ { field: supplierId, against: supplierId }, { field: unitIdx, against: unitIdx } ], reason: '供应商「{sname}」已存在，可直接编辑' }
  spec_rename:
    label: 改规格
    guard:
      rowUnique:
        - { in: specs, keys: [ { field: specModel, against: newName } ], except: { field: id, against: specId }, reason: '规格「{newName}」已存在' }
  dict_item_add:
    label: 字典项新增
    guard:
      rowUnique:
        - { in: items, keys: [ { field: name, against: trimmed } ], reason: '{entityName}「{trimmed}」已存在' }
  dict_item_rename:
    label: 字典项改名
    guard:
      rowUnique:
        - { in: items, keys: [ { field: name, against: trimmed } ], reason: '{entityName}「{trimmed}」已存在' }

