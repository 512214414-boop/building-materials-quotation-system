# entity-meta.yml — 实体 × 字段 × 行为维度的唯一真相源（v3）
# 用法：node tools/gen-entity-meta.mjs
# 生成：前端 entityMeta.generated.ts（数据维度）+ entityRelations.generated.ts（界面列）
#      后端 entityMeta.generated.ts（建档/快照/审计/统计）
# 元模型运行时阶段：A✅ B✅ C✅ D✅ E✅（后端字典已切 + 前端界面列迁移）
#
# 结构说明：
#   entities[].fields    —— 数据字段维度（B语义/C来源/F行为/G检索/H历史）
#   entities[].columns   —— 界面列（E 呈现：key/title/dataIndex/renderMode/minWidth/align/
#                           className/scenes/order/fieldClass/dictKind/suggestField/
#                           confirmStrategy/fixed/slot/pickerGroup），生成前端 entityRelations
#   entities[].relations —— 实体关系（field→to+type），生成前端 entityRelations.relations
#   auditActions / indicators —— 审计目录与统计口径
version: 3

entities:
  category:
    label: 分类
    table: category
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 分类ID, dataType: int }
      name: { label: 分类名称, dataType: string, required: true, unique: global, defaults: { sortOrder: 0, status: 1 }, confirmStrategy: dialog, searchLayer: name }
      sortOrder: { label: 排序号, dataType: int, defaults: 0 }
      status: { label: 状态, dataType: int, defaults: 1 }

  brand:
    label: 品牌
    table: brand
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 品牌ID, dataType: int }
      name: { label: 品牌名称, dataType: string, required: true, unique: global, defaults: { status: 1 }, confirmStrategy: dialog, searchLayer: name }
      status: { label: 状态, dataType: int, defaults: 1 }

  unit:
    label: 单位
    table: unit
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 单位ID, dataType: int }
      unitName: { label: 单位名称, dataType: string, required: true, unique: global, defaults: { status: 1 }, confirmStrategy: dialog, searchLayer: name }
      status: { label: 状态, dataType: int, defaults: 1 }

  price_type:
    label: 价格类型
    table: price_type
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 价格类型ID, dataType: int }
      name: { label: 类型名称, dataType: string, required: true, unique: global, defaults: { sortOrder: 0, status: 1 }, confirmStrategy: dialog, searchLayer: name }
      sortOrder: { label: 排序, dataType: int, defaults: 0 }
      status: { label: 状态, dataType: int, defaults: 1 }

  product:
    label: 产品
    table: product
    layer: subject
    primaryKey: id
    fields:
      name: { label: 产品名称, dataType: string, required: true }
      brand: { label: 品牌, dataType: string }
      specModel: { label: 规格型号, dataType: string, gate: { requires: brand, reason: 请先选择品牌 } }
      remark: { label: 规格备注, dataType: string, gate: { requires: specModel, reason: 请先选规格 } }
    columns:
      - { key: productRef, title: 产品名, dataIndex: productRef, renderMode: picker, minWidth: NAME_PRODUCT, align: left, className: ds-cascade-col, order: 10, scenes: [workbench], fieldClass: B, confirmStrategy: dialog, pickerGroup: sku }
      - { key: brandName, title: 品牌, dataIndex: brandName, renderMode: picker, minWidth: NAME_BRAND, align: left, className: ds-cascade-col, order: 20, scenes: [workbench], fieldClass: B, confirmStrategy: dialog, pickerGroup: sku }
      - { key: spec, title: 规格, dataIndex: spec, renderMode: picker, minWidth: NAME_SPEC, align: left, className: ds-cascade-col, order: 30, scenes: [workbench], fieldClass: B, confirmStrategy: dialog, pickerGroup: sku }
      - { key: unit, title: 单位, dataIndex: unit, renderMode: picker, minWidth: TAG_L, align: center, order: 40, scenes: [workbench], fieldClass: A, dictKind: unit, suggestField: unit, confirmStrategy: direct }
      - { key: qty, title: 数量, dataIndex: qty, renderMode: picker, minWidth: AMOUNT, align: center, order: 50, scenes: [workbench], confirmStrategy: direct }
      - { key: unitPrice, title: 单价, dataIndex: unitPrice, renderMode: picker, minWidth: AMOUNT, align: center, order: 60, scenes: [workbench], fieldClass: A, dictKind: priceType, suggestField: priceType, confirmStrategy: direct }
      - { key: amount, title: 金额, renderMode: static, minWidth: AMOUNT, align: center, order: 70, scenes: [workbench] }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: picker, minWidth: REMARK_S, align: center, order: 80, scenes: [workbench], fieldClass: A, suggestField: remark, confirmStrategy: direct }
      - { key: categoryName, title: 分类, dataIndex: categoryName, minWidth: TAG_L, align: center, order: 10, scenes: [archive], fieldClass: A, dictKind: category, suggestField: category, confirmStrategy: dialog, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: dict, dictField: category } } } }
      - { key: mainImageUrl, title: 图, dataIndex: sku, minWidth: ICON, align: center, order: 20, scenes: [archive], cellSpec: { display: image, editEntry: none } }
      - { key: productName, title: 产品名, dataIndex: productName, minWidth: NAME_QUOTE, align: left, className: ds-cascade-col, order: 30, scenes: [archive], fieldClass: B, confirmStrategy: dialog, cellSpec: { display: link, editEntry: link } }
      - { key: brandName, title: 品牌, dataIndex: brandName, minWidth: NAME_S, align: left, className: ds-cascade-col, order: 40, scenes: [archive], fieldClass: A, dictKind: brand, suggestField: brand, confirmStrategy: dialog, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: dict, dictField: brand } } } }
      - { key: specModel, title: 系列/规格, dataIndex: specModel, minWidth: NAME_S, align: left, className: ds-cascade-col, order: 50, scenes: [archive], fieldClass: B, confirmStrategy: dialog, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: dict, dictField: spec } } } }
      - { key: __skuPriceSlot__, title: '', order: 60, scenes: [archive], slot: skuPrice, cellSpec: { display: multi-record, editEntry: expand } }
      - { key: remark, title: 备注, dataIndex: remark, minWidth: REMARK_S, align: center, order: 70, scenes: [archive], fieldClass: A, suggestField: remark, confirmStrategy: direct, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: none }, disabledReason: 请先选规格 } } }
      - { key: status, title: 状态, dataIndex: sku, minWidth: TAG_S, align: center, order: 80, scenes: [archive], cellSpec: { display: enum-tag, editEntry: none } }
      - { key: updateTime, title: 更新时间, dataIndex: sku, minWidth: DATETIME, align: center, order: 90, scenes: [archive], cellSpec: { display: date, editEntry: none } }
    relations:
      - { field: brandId, to: brand, type: manyToOne }
      - { field: specId, to: spec, type: manyToOne }
      - { field: unitId, to: unit, type: manyToOne }
      - { field: categoryId, to: category, type: manyToOne }

    # recordSets —— 挂在本实体展示区间内的「多记录集合」（泛化：单位/售价/进价/联系人/地址同构）
    # 为什么挂 product 而不是 spec：列声明属于**视图实体**（产品列表要展示它们），
    #   集合真正挂在谁下面由 `of` 指出（spec）——与「展示区间」同一套思想：
    #   区间起点=视图实体，区间终点=集合所属父层。框架据此推导列与面板，业务零硬编码。
    # 推导规则（框架消费，业务不写）：
    #   role: siblingSet   + 同 group → 面板内平级 Tab（售价/进价）
    #   role: dimensionAxis           → 集合内切片维度 → 面板内下拉切换（单位）
    #   fallback                      → 单元格缺省回退链（选中→默认→推算→宽表兜底）
    #   value.semantic                → 单元格语义色（禁止业务硬编码色值）
    #   value.effective               → 有效值折算（面价 × 点位 = 实际售价）
    recordSets:
      - { key: units, label: 单位, of: spec, table: spec_unit, role: dimensionAxis, order: 10,
          scenes: [archive, workbench],
          unique: [unitId], defaultFlag: isDisplay, keyField: unitId,
          display: { mode: single },
          fallback: [ { kind: selected }, { kind: default }, { kind: column, column: defaultUnitName } ],
          emptyText: 未设单位 }

      - { key: salePrices, label: 售价, of: spec, table: sale_price, role: siblingSet, group: price, order: 20,
          scenes: [archive, workbench],
          axes: [units], unique: [priceTypeId, unitIdx], defaultFlag: isDefault, keyField: priceTypeId,
          value: { field: price, kind: money, semantic: sale, effective: { expr: 'base*factor', base: price, factor: point } },
          display: { mode: single },
          fallback: [
            { kind: selected },
            { kind: default },
            { kind: derive, base: price, factor: conversionRate, factorRef: units },
            { kind: column, column: retailPrice },
          ],
          emptyText: 未定价, panelTitle: 售价明细 }

      - { key: purchasePrices, label: 进价, of: spec, table: purchase_price, role: siblingSet, group: price, order: 30,
          scenes: [archive, workbench],
          axes: [units], unique: [supplierId, unitIdx], defaultFlag: isDefault, keyField: supplierId,
          value: { field: price, kind: money, semantic: purchase, effective: { expr: 'base*factor', base: price, factor: point } },
          display: { mode: single },
          fallback: [
            { kind: selected },
            { kind: default },
            { kind: derive, base: price, factor: conversionRate, factorRef: units },
            { kind: column, column: purchasePriceDefault },
          ],
          emptyText: 未设进价, panelTitle: 进价明细 }

  customer:
    label: 客户
    table: customers
    layer: subject
    primaryKey: id
    columns:
      - { key: name, title: 客户名称, dataIndex: name, renderMode: static, minWidth: NAME_M, align: left, order: 0 }
      - { key: contact, title: 联系人, dataIndex: contact, renderMode: text, minWidth: NAME_S, align: left, order: 10, confirmStrategy: direct }
      - { key: phone, title: 电话, dataIndex: phone, renderMode: text, minWidth: NAME_S, align: left, order: 20, confirmStrategy: direct }
      - { key: addressType, title: 地址类型, dataIndex: addressType, renderMode: picker, minWidth: TAG_L, align: center, order: 30, fieldClass: A, dictKind: addressType, suggestField: remark, confirmStrategy: dialog }
      - { key: address, title: 地址, dataIndex: address, renderMode: text, minWidth: NAME_L, align: left, order: 40, confirmStrategy: direct }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: text, minWidth: REMARK_S, align: left, order: 50, confirmStrategy: direct }
    relations:
