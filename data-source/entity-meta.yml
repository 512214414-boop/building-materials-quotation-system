      - { key: contact, title: 联系人, dataIndex: contact, renderMode: text, minWidth: NAME_S, align: left, order: 10, confirmStrategy: direct }
      - { key: phone, title: 电话, dataIndex: phone, renderMode: text, minWidth: NAME_S, align: left, order: 20, confirmStrategy: direct }
      - { key: businessScope, title: 经营范围, dataIndex: businessScope, renderMode: static, minWidth: NAME_L, align: left, order: 30, fieldClass: A, dictKind: category, suggestField: category, confirmStrategy: dialog }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: text, minWidth: REMARK_S, align: left, order: 40, confirmStrategy: direct }
    relations:
      - { field: categoryIds, to: category, type: oneToMany }

  inventory:
    label: 库存
    table: inventory
    layer: row
    primaryKey: id
    columns:
      - { key: op, title: 操作, dataIndex: op, renderMode: text, minWidth: 120, align: center, order: 0, scenes: [inventory] }
      - { key: product, title: 产品, dataIndex: productName, renderMode: text, minWidth: 240, align: center, order: 10, scenes: [inventory] }
      - { key: unit, title: 单位, dataIndex: unitName, minWidth: 60, align: center, order: 20, scenes: [inventory], cellSpec: { display: text, editEntry: none } }
      - { key: warehouse, title: 仓库, dataIndex: warehouse_id, renderMode: text, minWidth: 110, align: center, order: 30, scenes: [inventory] }
      - { key: qty, title: 库存数量, dataIndex: qty, minWidth: 100, align: center, order: 40, scenes: [inventory], cellSpec: { display: text, editEntry: none } }
      - { key: weighted_avg_cost, title: 加权平均进价, dataIndex: weighted_avg_cost, minWidth: 110, align: center, order: 50, scenes: [inventory], cellSpec: { display: text, editEntry: none } }
      - { key: last_in_at, title: 最近入库, dataIndex: last_in_at, minWidth: 150, align: center, order: 60, scenes: [inventory], cellSpec: { display: text, editEntry: none } }
    relations:
      - { field: productId, to: product, type: manyToOne }
      - { field: warehouseId, to: warehouse, type: manyToOne }

  inventory_ledger:
