# entity-meta.yml — 实体 × 字段 × 行为维度的唯一真相源（v3）
# 用法：node tools/gen-entity-meta.mjs
# 生成：前端 entityMeta.generated.ts（数据维度）+ entityRelations.generated.ts（界面列）
#      后端 entityMeta.generated.ts（建档/快照/审计/统计）
# 元模型运行时阶段：A✅ B✅ C✅ D✅ E✅（后端字典已切 + 前端界面列迁移）
#
# 结构说明：
#   entities[].fields    —— 数据字段维度（B语义/C来源/F行为/G检索/H历史）
#   entities[].columns   —— 界面列（E 呈现：key/title/dataIndex/renderMode/minWidth/align/
#                           className/scenes/order/fieldClass/dictKind/suggestField/
#                           confirmStrategy/fixed/slot/pickerGroup），生成前端 entityRelations
#   entities[].relations —— 实体关系（field→to+type），生成前端 entityRelations.relations
#   auditActions / indicators —— 审计目录与统计口径
version: 3

entities:
  category:
    label: 分类
    table: category
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 分类ID, dataType: int }
      name: { label: 分类名称, dataType: string, required: true, unique: global, defaults: { sortOrder: 0, status: 1 }, confirmStrategy: dialog, searchLayer: name }
      sortOrder: { label: 排序号, dataType: int, defaults: 0 }
      status: { label: 状态, dataType: int, defaults: 1 }

  brand:
    label: 品牌
    table: brand
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 品牌ID, dataType: int }
      name: { label: 品牌名称, dataType: string, required: true, unique: global, defaults: { status: 1 }, confirmStrategy: dialog, searchLayer: name }
      status: { label: 状态, dataType: int, defaults: 1 }

  unit:
    label: 单位
    table: unit
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 单位ID, dataType: int }
      unitName: { label: 单位名称, dataType: string, required: true, unique: global, defaults: { status: 1 }, confirmStrategy: dialog, searchLayer: name }
      status: { label: 状态, dataType: int, defaults: 1 }

  price_type:
    label: 价格类型
    table: price_type
    layer: globalDict
    primaryKey: id
    behavior:
      quickCreate: true
      deleteGuard: 被引用不能删，只能停用
    fields:
      id: { label: 价格类型ID, dataType: int }
      name: { label: 类型名称, dataType: string, required: true, unique: global, defaults: { sortOrder: 0, status: 1 }, confirmStrategy: dialog, searchLayer: name }
      sortOrder: { label: 排序, dataType: int, defaults: 0 }
      status: { label: 状态, dataType: int, defaults: 1 }

  product:
    label: 产品
    table: product
    layer: subject
    primaryKey: id
    fields:
      name: { label: 产品名称, dataType: string, required: true }
      brand: { label: 品牌, dataType: string }
      specModel: { label: 规格型号, dataType: string, gate: { requires: brand, reason: 请先选择品牌 } }
      remark: { label: 规格备注, dataType: string, gate: { requires: specModel, reason: 请先选规格 } }
    columns:
      - { key: productRef, title: 产品名, dataIndex: productRef, renderMode: custom, minWidth: NAME_PRODUCT, align: left, className: ds-cascade-col, order: 10, scenes: [workbench], fieldClass: B, confirmStrategy: dialog, pickerGroup: sku }
      - { key: brandName, title: 品牌, dataIndex: brandName, renderMode: custom, minWidth: NAME_BRAND, align: left, className: ds-cascade-col, order: 20, scenes: [workbench], fieldClass: B, confirmStrategy: dialog, pickerGroup: sku }
      - { key: spec, title: 规格, dataIndex: spec, renderMode: custom, minWidth: NAME_SPEC, align: left, className: ds-cascade-col, order: 30, scenes: [workbench], fieldClass: B, confirmStrategy: dialog, pickerGroup: sku }
      - { key: unit, title: 单位, dataIndex: unit, renderMode: custom, minWidth: TAG_L, align: center, order: 40, scenes: [workbench], fieldClass: A, dictKind: unit, suggestField: unit, confirmStrategy: direct }
      - { key: qty, title: 数量, dataIndex: qty, renderMode: custom, minWidth: AMOUNT, align: center, order: 50, scenes: [workbench], confirmStrategy: direct }
      - { key: unitPrice, title: 单价, dataIndex: unitPrice, renderMode: custom, minWidth: AMOUNT, align: center, order: 60, scenes: [workbench], fieldClass: A, dictKind: priceType, suggestField: priceType, confirmStrategy: direct }
      - { key: amount, title: 金额, renderMode: static, minWidth: AMOUNT, align: center, order: 70, scenes: [workbench] }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: custom, minWidth: REMARK_S, align: center, order: 80, scenes: [workbench], fieldClass: A, suggestField: remark, confirmStrategy: direct }
      - { key: categoryName, title: 分类, dataIndex: categoryName, renderMode: custom, minWidth: TAG_L, align: center, order: 10, scenes: [archive], fieldClass: A, dictKind: category, suggestField: category, confirmStrategy: dialog, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: dict, dictField: category } } } }
      - { key: mainImageUrl, title: 图, dataIndex: sku, renderMode: custom, minWidth: ICON, align: center, order: 20, scenes: [archive], cellSpec: { display: image, editEntry: none } }
      - { key: productName, title: 产品名, dataIndex: productName, renderMode: custom, minWidth: NAME_QUOTE, align: left, className: ds-cascade-col, order: 30, scenes: [archive], fieldClass: B, confirmStrategy: dialog, cellSpec: { display: link, editEntry: link } }
      - { key: brandName, title: 品牌, dataIndex: brandName, renderMode: custom, minWidth: NAME_S, align: left, className: ds-cascade-col, order: 40, scenes: [archive], fieldClass: A, dictKind: brand, suggestField: brand, confirmStrategy: dialog, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: dict, dictField: brand } } } }
      - { key: specModel, title: 系列/规格, dataIndex: specModel, renderMode: custom, minWidth: NAME_S, align: left, className: ds-cascade-col, order: 50, scenes: [archive], fieldClass: B, confirmStrategy: dialog, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: dict, dictField: spec } } } }
      - { key: __skuPriceSlot__, title: '', renderMode: custom, order: 60, scenes: [archive], slot: skuPrice, cellSpec: { display: multi-record, editEntry: expand } }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: custom, minWidth: REMARK_S, align: center, order: 70, scenes: [archive], fieldClass: A, suggestField: remark, confirmStrategy: direct, cellSpec: { display: text, editEntry: confirm, gate: { input: text, search: { kind: none }, disabledReason: 请先选规格 } } }
      - { key: status, title: 状态, dataIndex: sku, renderMode: custom, minWidth: TAG_S, align: center, order: 80, scenes: [archive], cellSpec: { display: enum-tag, editEntry: none } }
      - { key: updateTime, title: 更新时间, dataIndex: sku, renderMode: custom, minWidth: DATETIME, align: center, order: 90, scenes: [archive], cellSpec: { display: date, editEntry: none } }
    relations:
      - { field: brandId, to: brand, type: manyToOne }
      - { field: specId, to: spec, type: manyToOne }
      - { field: unitId, to: unit, type: manyToOne }
      - { field: categoryId, to: category, type: manyToOne }

  customer:
    label: 客户
    table: customers
    layer: subject
    primaryKey: id
    columns:
      - { key: name, title: 客户名称, dataIndex: name, renderMode: static, minWidth: NAME_M, align: left, order: 0 }
      - { key: contact, title: 联系人, dataIndex: contact, renderMode: text, minWidth: NAME_S, align: left, order: 10, confirmStrategy: direct }
      - { key: phone, title: 电话, dataIndex: phone, renderMode: text, minWidth: NAME_S, align: left, order: 20, confirmStrategy: direct }
      - { key: addressType, title: 地址类型, dataIndex: addressType, renderMode: picker, minWidth: TAG_L, align: center, order: 30, fieldClass: A, dictKind: addressType, suggestField: remark, confirmStrategy: dialog }
      - { key: address, title: 地址, dataIndex: address, renderMode: text, minWidth: NAME_L, align: left, order: 40, confirmStrategy: direct }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: text, minWidth: REMARK_S, align: left, order: 50, confirmStrategy: direct }
    relations:
      - { field: addressTypeId, to: addressType, type: manyToOne }

  supplier:
    label: 供应商
    table: supplier
    layer: subject
    primaryKey: id
    columns:
      - { key: name, title: 供应商名称, dataIndex: name, renderMode: static, minWidth: NAME_M, align: left, order: 0 }
      - { key: contact, title: 联系人, dataIndex: contact, renderMode: text, minWidth: NAME_S, align: left, order: 10, confirmStrategy: direct }
      - { key: phone, title: 电话, dataIndex: phone, renderMode: text, minWidth: NAME_S, align: left, order: 20, confirmStrategy: direct }
      - { key: businessScope, title: 经营范围, dataIndex: businessScope, renderMode: static, minWidth: NAME_L, align: left, order: 30, fieldClass: A, dictKind: category, suggestField: category, confirmStrategy: dialog }
      - { key: remark, title: 备注, dataIndex: remark, renderMode: text, minWidth: REMARK_S, align: left, order: 40, confirmStrategy: direct }
    relations:
      - { field: categoryIds, to: category, type: oneToMany }

  inventory:
    label: 库存
    table: inventory
    layer: row
    primaryKey: id
    columns:
      - { key: op, title: 操作, dataIndex: op, renderMode: custom, minWidth: 120, align: center, order: 0, scenes: [inventory] }
      - { key: product, title: 产品, dataIndex: productName, renderMode: custom, minWidth: 240, align: center, order: 10, scenes: [inventory] }
      - { key: unit, title: 单位, dataIndex: unitName, renderMode: custom, minWidth: 60, align: center, order: 20, scenes: [inventory] }
      - { key: warehouse, title: 仓库, dataIndex: warehouse_id, renderMode: custom, minWidth: 110, align: center, order: 30, scenes: [inventory] }
      - { key: qty, title: 库存数量, dataIndex: qty, renderMode: custom, minWidth: 100, align: center, order: 40, scenes: [inventory] }
      - { key: weighted_avg_cost, title: 加权平均进价, dataIndex: weighted_avg_cost, renderMode: custom, minWidth: 110, align: center, order: 50, scenes: [inventory] }
      - { key: last_in_at, title: 最近入库, dataIndex: last_in_at, renderMode: custom, minWidth: 150, align: center, order: 60, scenes: [inventory] }
    relations:
      - { field: productId, to: product, type: manyToOne }
      - { field: warehouseId, to: warehouse, type: manyToOne }

  document_line:
    label: 单据行（快照）
    table: document_lines
    layer: snapshot
    primaryKey: id
    fields:
      productName: { label: 产品名（快照）, snapshotFrom: product.name }
      brandName: { label: 品牌（快照）, snapshotFrom: brand.name }
      categoryName: { label: 分类（快照）, snapshotFrom: category.name, via: product.categoryId }
      specModel: { label: 规格（快照）, snapshotFrom: spec.specModel }
      unitName: { label: 单位（快照）, snapshotFrom: unit.unitName }

# ─────────────────────────────────────────────
# 动作守卫（操作守卫）：判定能描述为「字段/行数/状态」的才声明，读 actionMeta 解读。
#   requires    表单字段必填（组内缺任一 → 该组 reason）
#   minSelected 有效行数下限
#   numbers     表单数值校验（form 字段转 number 比较）
#   rowNumerics 每行数值校验（reason 支持 {占位} 从该行取值）
#   states      状态机（allow/forbid）
# 依赖多请求时序、多表联合对账的守卫 → 例外，代码写 + 登记在案，不进 yml。
# ─────────────────────────────────────────────
# ─────────────────────────────────────────────
# 资源接口（resources）：实体 → 后端通用接口的声明
#   驱动后端资源引擎（backend/src/controllers/resourceController.ts）：
#   列表 / 详情 / 新建 / 改 / 删 / 快建 / 引用计数，全部由配置产出，零手写 handler。
#   permission 权限叶子 · writable 可写字段白名单（越界字段直接拒绝）
#   include 关联预载 · softDelete 软删除字段 · audit 审计动作 · search 检索配置
# ─────────────────────────────────────────────
resources:
  supplier:
    label: 供应商档案
    table: supplier
    # model：Prisma 模型名（entity-meta 的 model 名与 @@map 的表名可能不同，如 customer→customers）
    model: supplier
    primaryKey: id
    permission: supplier_manage
    softDelete: { field: status, off: 0 }
    writable: [name, remark, status]
    # include：Prisma 关联名（必须与 schema.prisma 的 relation 名一致）
    #   注：前端「经营范围」是 businessCategories + businessBrands 两个关联的合并视图，
    #      不是单个 Prisma 关联，故此处按真实关联登记
    include: [contacts, addresses, businessCategories, businessBrands]
    audit: [supplier_create, supplier_update, supplier_delete, supplier_quick_add, supplier_status]
    search:
      fields: [name]
      mode: normalized
      dictUnique: global
    # refTargets：删除前的引用计数目标（前端展示"删除会影响哪些单据"）
    refTargets:
      - { label: 进价记录, table: purchase_price, field: supplierId }
      - { label: 应付行, table: supplier_payable_lines, field: supplier_id }
      - { label: 采购入库单, table: purchase_inbounds, field: supplier_id }

# ─────────────────────────────────────────────
# 页面装配（pages）：实体 → 前端页面的声明
#   驱动前端页面装配器（frontend/src/shared/config/pageAssembler.ts）：
#   列表组件 + 槽位编排 + 单元格编辑器，页面本身只做「读配置 + 注入专属 Editor」。
#   slots 的数组顺序 = 列表列顺序（与登记表「列顺序是配置值不是推导」同口径）
#   fixedSlots 固定槽位（操作 / 序号 / 状态）
# ─────────────────────────────────────────────
pages:
  supplier:
    label: 供应商管理
    list: ArchiveListPage
    rowKey: id
    fixedSlots: [op, seq, status]
    slots:
      - { key: name, title: 供应商名称, slot: name, editor: NameLinkCell }
      - { key: contacts, title: 联系信息, slot: matrix, editor: ArchiveContactMatrixEditor }
      - { key: addresses, title: 地址, slot: matrix, editor: ArchiveSupplierAddressMatrixEditor }
      - { key: businessScope, title: 经营范围, slot: custom, editor: SupplierBusinessScopePicker }
      - { key: remark, title: 备注, slot: scalar, editor: ArchiveFieldCell }

actions:
  purchase_inbound_confirm:
    label: 确认采购入库
    guard:
      requires:
        - { fields: [supplierId], reason: 请选择供应商 }
        - { fields: [warehouseId], reason: 请选择入库仓库 }
      minSelected: { n: 1, reason: 请先选品，再确认入库 }
      rowNumerics:
        - { field: qty, op: gt, ref: 0, reason: '「{productRef}」数量必须大于 0' }
        - { field: unitCost, op: ge, ref: 0, reason: '「{productRef}」进价不能为负' }
  purchase_price_batch_adjust:
    label: 批量调整进价
    guard:
      requires:
        - { fields: [supplierId, brandInput, categoryInput], reason: 请先选择供应商、品牌、分类 }
      numbers:
        - { field: oldPoint, op: gt, ref: 0, reason: 请填写旧点位 }
        - { field: newPoint, op: gt, ref: 0, reason: 请填写新点位 }
  inventory_adjust:
    label: 盘点调整
    guard:
      numbers:
        - { field: targetQty, op: ge, ref: 0, reason: 盘点后数量必须 ≥ 0 }
        - { field: unitCost, op: ge, ref: 0, reason: 期初/盘点成本必须 ≥ 0 }
  inventory_opening:
    label: 期初入库
    guard:
      requires:
        - { fields: [warehouseId], reason: 请选择仓库 }
        - { fields: [sku, unit], reason: 请先选品 }
      numbers:
        - { field: qty, op: gt, ref: 0, reason: 期初数量必须大于 0 }
        - { field: unitCost, op: ge, ref: 0, reason: 期初成本不能为负 }
  staff_login:
    label: 员工登录
    guard:
      requires:
        - { fields: [username], reason: 请输入用户名 }
        - { fields: [password], reason: 请输入密码 }
  customer_verify:
    label: 授权码准入
    guard:
      requires:
        - { fields: [authCode], reason: 请输入授权码 }
      formats:
        - { field: phone, pattern: '^[A-Za-z0-9_+.-]{1,200}$', reason: 请输入登录账号（电话或微信） }
  customer_access_request:
    label: 申请准入
    guard:
      formats:
        - { field: phone, pattern: '^[A-Za-z0-9_+.-]{1,200}$', reason: 请输入登录账号（电话或微信） }
  refund_add_lines:
    label: 添退换记录
    guard:
      minSelected: { n: 1, reason: 请先对上已卖行 }
      rowNumerics:
        - { field: qty, op: gt, ref: 0, reason: '{productRef} 退换数量必须大于 0' }
        - { field: qty, op: le, refField: remaining, reason: '{productRef} 不能超过剩余可退量 {remaining}' }
  refund_add_single:
    label: 单个添退换
    guard:
      requires:
        - { fields: [selectedSold], reason: 请先对上已卖行 }
  refund_edit_line:
    label: 改退换数量
    guard:
      numbers:
        - { field: refundQty, op: gt, ref: 0, reason: 退换数量必须大于 0 }
  quote_recognize:
    label: 识别开单文本
    guard:
      requires:
        - { fields: [recognizeText], reason: 请粘贴订单文本 }
  payment_quick_add:
    label: 快捷记收款
    guard:
      numbers:
        - { field: amount, op: gt, ref: 0, reason: 金额必须为正数 }
  detail_add_to_doc:
    label: 加入订单
    guard:
      numbers:
        - { field: qty, op: gt, ref: 0, reason: 请输入有效数量 }
  inbound_set_target:
    label: 设置目标仓库
    guard:
      requires:
        - { fields: [target], reason: 请选择目标仓库 }
  price_edit_add:
    label: 新增价格
    guard:
      requires:
        - { fields: [specBrandId, unitId], reason: 请先选择产品与单位 }
      numbers:
        - { field: inputValue, op: gt, ref: 0, reason: 请先输入有效价格 }
  price_archive_confirm:
    label: 价格写入档案
    guard:
      requires:
        - { fields: [selectedPriceTypeId], reason: 请选择价格类型 }
  unit_quick_add:
    label: 单位快建
    guard:
      requires:
        - { fields: [name], reason: 请先输入单位名 }
  archive_sales:
    label: 定档销售
    guard:
      states: { allow: [true], reason: 请先完成 V9 店长汇总确认 }
  archive_logistics:
    label: 定档物流
    guard:
      states: { allow: [true], reason: 请先完成 V9 店长汇总确认 }
  archive_costs:
    label: 定档成本
    guard:
      states: { allow: [true], reason: 请先完成 V9 店长汇总确认 }
  purchase_recognize:
    label: 识别订单文字
    guard:
      requires:
        - { fields: [recognizeText], reason: 请粘贴订单文字 }
  purchase_commit_qty:
    label: 提交数量
    guard:
      numbers:
        - { field: newQty, op: gt, ref: 0, reason: 数量必须大于 0 }
  purchase_submit_demand:
    label: 提交需求
    guard:
      minSelected: { n: 1, reason: 请先添加物料 }
  product_save:
    label: 保存产品
    guard:
      requires:
        - { fields: [productName], reason: 请输入产品名称 }
  document_recognize:
    label: 识别订单文本
    guard:
      requires:
        - { fields: [recognizeText], reason: 请粘贴订单文本 }
  allocation_source_quick_add:
    label: 配货来源快建
    guard:
      requires:
        - { fields: [kw], reason: 先打名称再新建 }
  quick_create_confirm:
    label: 快速建档确认
    guard:
      requires:
        - { fields: [productName], reason: 请输入产品名称 }
  supplier_quick_add:
    label: 供应商快建
    guard:
      requires:
        - { fields: [keyword], reason: 先输入供应商名称 }
  reimbursement_save:
    label: 保存报销单
    guard:
      minSelected: { n: 1, reason: 至少保留一行有效商品 }
  customer_quick_add:
    label: 客户快建
    guard:
      requiresAny:
        - { fields: [phone, name], reason: 姓名与联系方式至少填一个 }
  sale_price_apply:
    label: 价格类型应用
    guard:
      rowUnique:
        - { in: unitSalePrices, keys: [ { field: priceTypeId, against: nextId } ], reason: '价格类型「{name}」已存在，可在上方行直接编辑' }
  purchase_price_edit_supplier:
    label: 改供应商进价
    guard:
      rowUnique:
        - { in: purchasePrices, keys: [ { field: supplierId, against: newId }, { field: unitIdx, against: unitIdx } ], except: { field: rowKey, against: rowKey }, reason: '供应商「{newName}」已存在，不可重复' }
  purchase_price_add_derived:
    label: 派生供应商进价
    guard:
      rowUnique:
        - { in: purchasePrices, keys: [ { field: supplierId, against: supplierId }, { field: unitIdx, against: unitIdx } ], reason: '供应商「{sname}」已存在，可直接编辑' }
  spec_rename:
    label: 改规格
    guard:
      rowUnique:
        - { in: specs, keys: [ { field: specModel, against: newName } ], except: { field: id, against: specId }, reason: '规格「{newName}」已存在' }
  dict_item_add:
    label: 字典项新增
    guard:
      rowUnique:
        - { in: items, keys: [ { field: name, against: trimmed } ], reason: '{entityName}「{trimmed}」已存在' }
  dict_item_rename:
    label: 字典项改名
    guard:
      rowUnique:
        - { in: items, keys: [ { field: name, against: trimmed } ], reason: '{entityName}「{trimmed}」已存在' }

# 审计 action 目录（82 个，全量）
