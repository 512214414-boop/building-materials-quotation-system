  - id: why-habit
    layer: L1
    navId: why-habit
    kind: carry
    nav:
      title: 人习惯怎么干
      subtitle: 表格即主体 · 插在当前行下
    page:
      kind: carry
      kicker: 人习惯怎么干
      title: 人是对着一张表往下写的，系统就按这个习惯做
      lead: 这一页不是某一摊活推出来的。是这个现场的人怎么用工具。开发约束（Token、三种交互范式）仍在哲学；本页写现场习惯，用来解释为什么表格是主体、为什么插行不能甩到表尾。
      factsKicker: 现场怎么用工具
      factsTitle: 像写纸笔单据，不像填网页表单
      facts:
        - label: 表格即主体
          note: 格子只展示，点开确认层再写。表上没有保存按钮。
        - label: 顺着写
          note: 插在当前这条下面，不要甩到最后。
        - label: 画布上干活
          note: 浮层贴着格子开，不弹窗套弹窗。
        - label: 横竖快切不阻断
          note: 一行里逐格敲完，回车/Tab 顺势跳下一格，不要每格都点确认再关。
        - label: 改前改后能分清
          note: 确认层原值弱灰卡片、新值品牌绿卡片，中间 →。不用引号把一对值包成一句。
      tables:
        - kicker: 系统因此怎样
          title: 习惯写成效果，才能约束实现
          colA: 人怎么干
          colB: 系统要达到的效果
          rows:
            - - 对着一张表往下写，改完就是改完
              - 表格是干活的地方。格子点开确认层，确认才写、取消不写。表上不要保存按钮。不要失焦保存：格子密、误触会写；同步工作台多人同开一张单，离格就打接口会撞乐观锁。
            - - 插一行是插在正在写的这条下面
              - 新行插在当前行下面，不要甩到表尾。
            - - 纸笔单据可以翻页接着写
              - 翻到哪一页、写哪一行，就落在那一页那一行，不要串位。
            - - 辅助输入贴着格子
              - 浮层锚定格子。不要弹窗里再套弹窗。
            - - 开单混写，平时分列维护
              - 管理筛档案、开单格探货，是两套框。匹配规则同一套，填法不要合成一个框。
            - - 一格里敲完顺势跳下一格
              - 确认层支持邻格快切：底栏方向钮或键盘 Tab/Shift+Tab（横）、上下（纵）跳到相邻可编辑格，跳转即提交当前格并打开下一格确认层。Enter 仍为确认并关闭。按表格可选启用，未启用处确认层行为不变。
            - - 改之前和改之后要一眼能分
              - 确认层对比用两枚卡片：原值弱灰（--text-tertiary / overlay），新值品牌绿（--text-brand / brand-popup），中间 →，不要用「」把一对值包成一行字。没改过不显示这对卡片。范围说明另起一行弱字。硬到能否决「「旧」→「新」纯文本」。
    card: {}
  - id: know-method
    layer: L0
    navId: know-method
    kind: carry
    index:
      hear: "对话要沉淀成指导思想、切一类活"
    nav:
      title: 对话 → 指导思想
      subtitle: 触发：对话要沉淀成指导思想 · 项目文档的生成源头
    page:
      kind: carry
      kicker: 方法论 · 对话 → 指导思想
      title: 对话进来，指导思想出去：一类活起头，六条线写满，效果硬到能约束实现
      lead: 这是项目自身文档的生成源头：用户的对话——新现场、零散需求、口语反馈——都从这里进，定性、切活、补线、写硬，变成指导思想文档再指导开发。不是每轮对话都生成文档，但每轮对话讲的东西都要有地方落。产出的是「指导思想」：用来指导本项目开发、解释已经做出来（或准备做）的行为。只写一类活，做出来的指导思想解释不了系统——本项目已经用代码证伪过。所以方法强制：作业按一类活切，还要把对象、过程、角色、看数、工具习惯写进指导思想，效果写到能约束实现，最后对着行为实地检测。下一项目只复制这一页，不要复制本项目的开单/配货。
      factsKicker: 方法解决什么
      factsTitle: 指导思想是开发说明书的源头，不是读起来像现场的文章
      factsLead: 以前文档跟着代码过期。现在用这一页生成指导思想。指导思想不够硬，就是这一页还没写够。
      facts:
        - label: 产出是指导思想
          note: 指导开发、解释实现。不是功能说明书，也不写表名组件名。效果必须硬到能否决一种实现。
        - label: 一类活只是第一条线
          note: 作业按现场独立的事切。对象、过程、角色、看数、工具习惯不写进指导思想，实现就没有源头。
        - label: 验收是实地检测
          note: 对着行为问得出效果原句。问不出，先补方法要求的那条线，再补指导思想。过了才能拿去指导开发。
      tables:
        - kicker: 指导思想必须写满的线
          title: 一类活起头，六条线都写进指导思想，缺一条实现就没有源头
          lead: 下一项目按这个清单交提纲。名字由新现场出。不要把本项目的开单/配货当成通用目录。
          colA: 线
          colB: 写什么 · 写到什么精度
          rows:
            - - 作业（一类活）
              - 现场有哪几摊独立的事。每摊四块。效果硬到能否决一种实现。
            - - 对象
              - 货/人/地/渠道在世界上怎么分层。改一类会波及谁、例外跟不跟。
            - - 过程
              - 一张单怎么过阶段、何时只读、谁何时能看见什么。现场可交错则阶段必须能来回改。
            - - 角色
              - 谁在现场干、谁能自己进来、谁能进系统、能干哪一摊。
            - - 看数
              - 事后回头看什么。汇总、报表、定档写在这里，不要假装是一类柜台活，也不要没地方写。
            - - 工具习惯
              - 人怎么用这套东西干活。表格怎么写、插行落在哪、有没有保存按钮。
        - kicker: 什么是一类活
          title: 一摊独立的事，不是一个页面，也不是上一份文档的名字
          lead: 开单、配货、进货只是这家门店切出来的。工厂可能是投料、质检、出货。名字由现场出。
          colA: 像一类活
          colB: 不像一类活
          rows:
            - - 现场有一摊人、一段时间在干这件事，不提屏幕也能讲完
              - 某一个页面、按钮、报表、工作台视图
            - - 干砸了有独立后果（这摊活没做成，别的摊补不上）
              - 按部门、按岗位软件、按数据表切开的模块
            - - 切完还能讲清和别的活怎么交错（可以同时发生，目录不是时间表）
              - 同一张单的不同看法（报价、配货、汇总）——那是过程，不是又一类活
        - kicker: 每一类活写四块
          title: 讲清楚活，效果写到能约束实现
          lead: 痛点写在动作旁边。不写表、组件、接口、功能绰号。
          colA: 块
          colB: 写什么
          rows:
            - - 这类活是什么
              - 短、客观、只写本摊。各摊共用的行业现实放总定位。
            - - 线下怎么干
              - 完整作业。用现场讲过的事实。痛点嵌在动作旁。
            - - 要达成什么效果
              - 对照：哪个麻烦 → 要什么业务结果。见下一表的精度。
            - - 本摊用到的公共能力
              - 只点名。几摊活碰到同一类现实问题才抽。
        - kicker: 效果精度
          title: 两种写法都符合这句话，这句话还不够硬
          lead: 本源层仍然不写表名、组件名。但必须写清条件、不变的字、认全到哪一层。粗句只能当精神，约束不了开发。
          colA: 还不够
          colB: 硬到能约束实现
          rows:
            - - 当时抄死
              - 写清：后来改档案，已经落下的哪一些不准跟着变；改数量/单价还改不改名称；什么情况下才整份重抄。
            - - 没认成货不能回仓
              - 写清：要认成「那条货」，缺哪一层就不算认成。缺了只退钱、不加仓。
            - - 不够就欠着
              - 写清：谁记下欠、什么时候冲掉。只说「欠着」推不出系统当场记下、货到冲抵。
            - - 进价滞后
              - 写清：仓里出的按什么算；外面刚好够这笔的算不算进订单成本；外面多调的算不算、货去哪。
            - - 改这一条还是改一类
              - 写清：一类的圈有多大；已经单独改过的跟不跟。
            - - 吃碎片、混写
              - 写清：切看法改不改字；字在名称里或名称在字里算不算碰上；格式不规整能不能禁掉。
            - - 两个控件长得一样
              - 写清：同一处两个下拉/按钮，用户必须能辨出各自管什么字段。靠图标语义区分，不靠位置记忆。硬到能否决「两个长一样的下拉」。
            - - 变化前后分不清
              - 写清：原值弱、新值强、中间什么符号；禁止用引号把一对值包成一行字。硬到能否决「「旧」→「新」纯文本」。
            - - 重要入口易漏
              - 写清：常用但易被忽略的入口（选用检索展开/收起）靠图标凸显，不是藏在位置里。硬到能否决「列表常开无主动收起钮」。
        - kicker: 因果
          title: 从现场推到指导思想，再推到表和页面，不要反过来
          colA: 这一步
          colB: 推出什么
          rows:
            - - 现实有哪几类活 + 对象/过程/角色/看数/工具
              - 指导思想的目录。现场可以交错，目录只是阅读顺序。
            - - 每一类：是什么、线下怎么干
              - 场景。细节从这里掉下来。
            - - 麻烦 → 硬效果
              - 能约束实现的业务结果。还不是表和按钮。
            - - 几类活同一类现实问题
              - 公共能力必须是同一套习惯。
            - - 六条线都有硬效果了
              - 这份指导思想可以拿去指导开发。
            - - 效果对上了，再设计
              - 表、页面、组件、接口。落地词从这里才出现。
        - kicker: 切法自检
          title: 切完一类活，拿现场还在干的独立工作对一下
          lead: 太粗：不一样的两摊被写成一类，后面的页会推不出来。太细：又变回按页面写。
          colA: 问
          colB: 怎么处理
          rows:
            - - 还有没有一摊人在干另一件事，不提屏幕也能讲完？
              - 有，就补一类活。本项目教训：进货被塞进履约，推不出收货、点仓、看库存。
            - - 核算、归档、汇总是不是某摊活的终点？
              - 是终点就写在看数或那摊活的收口，不要随手再切一类活，也不要没地方写。
            - - 同一张单的不同看法是不是被当成一类活？
              - 是过程，不是一类活。
        - kicker: 实地检测
          title: 方法有没有做通，只看指导思想能不能解释行为
          lead: 有代码对着代码问。没代码对着准备做的行为问。这是方法的最后一步，不是附录。
          colA: 问
          colB: 过 / 不过
          rows:
            - - 源头在指导思想哪一条效果？
              - 说得出原句 = 过。只能说「大概是开单」= 不过。
            - - 这句话能否决另一种实现吗？
              - 能 = 过。两种写法都符合 = 效果还不够硬，回去补精度。
            - - 这条行为在对象/过程/角色/看数/工具里，指导思想有没有页？
              - 没有页 = 方法没要求写满六条线，方法失败。
        - kicker: 这种方法会漏什么
          title: 切法会丢掉绞在一起的现场，要自己补
          colA: 洞
          colB: 写的时候怎么补
          rows:
            - - 目录把同一场拆碎
              - 当时就会碰到的动作，要在那一摊里点到名。
            - - 一场作业被当成全部现场
              - 每摊标明写满还是骨架，并列没写的现场。
            - - 效果句无法证伪
              - 每条效果补：删掉它，现场哪一步会断；哪类现场这条不成立。
            - - 禁止写实现会变成空话
              - 效果必须指回一个现场动作，并硬到能否决一种实现。没有对应就删。
            - - 口语 UI 微反馈漏掉
              - 用户讲的是「这图标要不要凸显」「两个下拉分不清」这类跳跃口语，不是现场作业。补：归到工具习惯/界面基座线，先推意图再写硬效果，不要等它自己变成一类活。
        - kicker: 输入侧：口语反馈到硬条目
          title: 用户讲的是跳跃口语，不是现场作业，要先推演再写硬
          lead: 正向链假设输入是「谁、干什么、卡在哪」。迭代中常来的是「这图标要不要凸显」「两个下拉分不清」这种 UI 微反馈。不推演就落不进六条线，也写不硬。
          colA: 步骤
          colB: 做什么
          rows:
            - - 听原话
              - 原话保留口语、疑问、跳跃，不要替用户补成业务句。
            - - 归哪条线/哪环
              - UI 微反馈多数落工具习惯线（why-habit）或界面基座；改档案/选品的落对应环。
            - - 识别麻烦或习惯
              - 「分不清」=可区分性麻烦；「要不要凸显」=易漏入口习惯；「快切不阻断」=连续录入习惯。
            - - 推演意图
              - 问：他想达到什么效果、现在哪里断。推到能约束实现的一句话。
            - - 写硬效果句
              - 硬到能否否另一种实现。例：「两个长一样的下拉」→「必须靠图标语义区分，否决两个一样」。
            - - 对照已有规则
              - 先查 why-canon / nSlot / order-framework 有没有已写过的；有就接，没有再补。
        - kicker: 数据关系图参数化
          title: 讲清数据关系，扔进槽位，UI/检索/快建/确认全部自动正确
          lead: 带数据表的功能，先把数据关系讲成一份关系图参数（父子 + 字典引用 + 子集 + 上下文依赖 + 确认策略），槽位自动产出五个面。新增功能只填这一份，不再各视图手写一套列/一套快建/一套确认。
          colA: 面
          colB: 槽位自动产出什么 · 写到什么精度
          rows:
            - - 表格 UI
              - 主表+浮层表列结构从实体关系推导：列序跟数据模型走、列宽/对齐/单元格类型/能否点/布局都由字段元数据决定。硬到能否决「各视图手写第二套列」。
            - - 检索
              - 选用检索顶栏由关系树派生（宽松+精准）。硬到能否决「另写检索面板」。
            - - 字典快建/管理
              - 按名称确保幂等 → 直接建即选 + reused 提示；管理面板增删改 + 引用计数。硬到能否决「只能去档案页新建」。
            - - 确认策略
              - 槽位内置三档：单字段幂等=直接建即选；多字段+缺省值+去重=二次确认弹窗；改全局/删除=二次确认+列出影响范围。硬到能否决「各处自写确认」。
            - - 场景截断
              - 同一棵关系树，档案/工作台/库存取不同子集（哪些列、能否编辑、空行规则）。硬到能否决「同一关系抄三遍列」。
        - kicker: 两类字段由关系图区分
          title: 槽位按关系图自动选 A/B，不各处自写分支
          lead: 字段分两类，由数据关系图本身区分，不是各视图各写一套逻辑。
          colA: 类
          colB: 关系图特征 · 槽位怎么走
          rows:
            - - A 类·纯全局字典
              - 关系图=单层（name 全局唯一，无父依赖）→ 走 DictSlot：检索+快建+管理面板。分类/品牌/价格类型/联系方式/客户类型/地址类型/单位全局字典。
            - - B 类·挂上下文关联
              - 关系图=父实体→子表（必须带父 id 才能建）→ 专用选择器，管理在父实体编辑内。例：规格的标准单位、产品×品牌关联。
            - - 单位=A+B 混合
              - 非标行（无父 id）走 A（全局字典）；标准行（有父 id）走 B（父实体子表）。槽位按「关系图+当前有无父 id」自动选，不在选择器里揉两套。
      rulesKicker: 怎么切
      rulesTitle: 先问现场有哪几摊独立的事，不要套现成目录
      rulesLead: 切法拿不准，问现场的人。确认切法和六条线提纲之前，禁止画页面，禁止套用本项目的开单 / 配货 / 售后。
      rules:
        - - 先切后写
          - 一类活的名字来自这个现场，不来自上一份文档。
        - - 六条线一起交提纲
          - 不要先写完一类活再「另写」。对象/过程/角色/看数/工具是指导思想的正文，不是附录。
        - - 目录不是流水线
          - 阅读可以有顺序。现场可以交错。
        - - 公共能力后置
          - 各摊写完再抽。抽的判据是同一类现实问题。
        - - 总纲领最后
          - 开篇只放这个现场共用的现实。不要一上来口号。
      ruleBlocks:
        - kicker: 下一项目怎么用
          title: 把这一页给 AI，再口述你的现场
          lead: 通用的是框架。内容由新现场填。工厂、门店、别的场景都走同一套。
          rules:
            - - 只喂方法
              - 复制「对话 → 指导思想」这一页。不要复制系统业务设计指导思想。
            - - 再讲现场
              - 谁、在干什么、卡在哪、现在手工怎么处理。讲作业和对象怎么存在，不讲想要几个页面。
            - - AI 先交提纲
              - 拟切的一类活 + 对象/过程/角色/看数/工具各写几句。等你确认。未经确认不得套开单/配货/售后，也不得开始画页面。
            - - 确认后写指导思想全文
              - 每一类活四块；六条线都有硬效果；再抽公共能力；总纲领放最后。
            - - 实地检测
              - 列出准备做的行为，一条条问源头。问不出原句，先补指导思想。过了才能设计表和页面。
        - kicker: 带走
          title: 带走写法，不要带走本项目的活
          rules:
            - - 要带
              - 这一页。页顶复制 Markdown。
            - - 可带可不带
              - 下一页「对照本项目」——只是例子，看方法做通之后追源长什么样。
            - - 不要带
              - 系统业务设计指导思想。那是这家店填满的正文。别的项目没有这些活，带过去会让 AI 照套。
    card: {}
  - id: know-cause
    layer: L1
    navId: know-cause
    kind: carry
    index:
      hear: "想看方法做通的实样"
    nav:
      title: 对照本项目
      subtitle: 触发：要看方法做通的实样 · 只参照不复制
    page:
      kind: carry
      kicker: 方法论 · 对照本项目
      title: 对照本项目：方法做通之后，行为能追到源头
      lead: 这一页是例子。先看方法只写一类活时追不到什么；再看按完整方法补完指导思想之后，同一批行为能不能追到效果原句。下一项目不要把本页的名字当成自己的一类活。
      factsKicker: 这一页证明什么
      factsTitle: 方法不足 → 指导思想不足；方法补全 → 指导思想才能指导开发
      factsLead: 同一套代码，补方法、补指导思想之前追不到源头；按六条线写硬效果之后能追到。
      facts:
        - label: 只写一类活时
          note: 能解释柜台那截。成本三段、点位圈组、阶段可逆、客户价可见、进货点仓、插行位置，都没有源头。
        - label: 按完整方法补完后
          note: 作业、对象、过程、角色、看数、工具习惯都在指导思想里，效果写到能否决一种实现。下面按行为追源。
      tables:
        - kicker: 活 → 系统样子（本项目）
          title: 写下现场，能力和交互自己出现
          colA: 按活写下来的事实
          colB: 系统因此长成这样
          rows:
            - - 边问边写，品名牌子口径挤在一行
              - 开单一格收整段话；切看法不改这行字
            - - 店里经常没这款，下一动作是打电话
              - 用这行字列出可能供的渠道；写入的仍是货
            - - 档案没有这条，人还站着等
              - 对不上也先落成一行原文
            - - 店里有和没有是两种出法
              - 内部来源和外部渠道不是一份名单
            - - 货到了要点进仓，多调的进库存
              - 收货、待入、库存是进货这一摊，不是配货的附录
            - - 钱跟当时说定的那笔走
              - 已经收过、付过的数，档案再改价也不跟着改
            - - 当时没认成那条货
              - 钱可以退；规格、牌子、单位都认上了才能加库存
            - - 退货顺序是乱的，可能一次退几张单
              - 对着已经卖掉的行去对；对上了才落到那张或那些原单
            - - 卖价很活，退按当时卖给这个人的价
              - 不按名册现在的标准价
            - - 散客来不及建档
              - 问到名字或电话就写在单上；什么都没有也先开；一样能退
        - kicker: 补完后对着行为追源
          title: 问得出效果原句，才算方法做通
          lead: 仍是抽样，不是扫完全库。打分算法的具体分层是落地，指导思想只约束到匹配律和排序方向。
          colA: 系统里的行为
          colB: 源头（指导思想原句）
          rows:
            - - 没有档案关联也能先保存；没档案时只靠原文
              - 开单：对不上也先落成一行原文。没有档案关联也能先保存。
            - - 改数量/单价/备注不重抄名称；再认货才整份重抄；只换单位只换单位名
              - 开单 / 当时抄死：后来只改数量、单价、备注，名称仍是当时抄的。只有重新认货才整份换。
            - - 切档不改字；字在名称里或名称在字里都算碰上；更像完整说法的排前面
              - 开单 / 一段字去探：字在名称里算碰上，名称在字里也算碰上。更像完整说法的排前面，碎片也能中。
            - - 退货加库存：规格、牌子、单位都认上了才加
              - 售后：规格、牌子、单位都认上了才能加库存。缺一样只退钱。
            - - 对着卖掉的行打字去对；一次可落到多张原单；退价是当时卖掉的价
              - 售后：对着已经卖掉的行打字去对。对上了才落到那张或那些原单。退的价是当时卖给这个人的价。
            - - 没有客户档案也能先开单；问到名字或电话就写在单上
              - 开单：问到名字或电话就写在单上，不必为此建人档。什么都没有也先开。
            - - 仓出按当时均价；外面刚好够这笔的算进订单成本；外面多调的不算订单成本、货进库存
              - 履约三条效果。进货：多调的进库存。
            - - 确认改眼前这条＝只这条规格例外；改一类＝这个牌子加这类货，已有例外不跟
              - 货和人怎么存在 / 改这一条还是改一类。
            - - 阶段可以来回改；客户看见价格要等报价说定了
              - 单怎么过手：阶段可以来回改，不要锁死单向。客户不能看见价，要等店里报价说定了才可见。
            - - 内部出不够当场记下欠着；货进仓时冲掉欠
              - 履约：内部仓出不够，系统当场记下欠着；货进仓时冲掉欠。
            - - 新行插在当前行下面，不要甩到表尾
              - 人习惯怎么干 / 开单：插在当前这条下面。
            - - 收货点仓、待入、按仓看库存
              - 进货管货。
            - - 客户自己进来；价要等报价说定；谁能进系统要授权
              - 单怎么过手 · 角色。
            - - 一张单走完能回头看；一段时间的经营；定档只读
              - 单怎么过手 · 看数。
      rulesKicker: 对照怎么用
      rulesTitle: 用来学「方法做通长什么样」，不用来当下一项目的目录
      rules:
        - - 看这一页
          - 看补完后追源表。那是方法要求的精度。
        - - 写下一项目
          - 回到「对话 → 指导思想」，按新现场交六条线提纲，不要抄本页的开单/配货/进货。
        - - 本项目开发
          - 新功能先归到指导思想对应页。效果原句能否决你的实现，才动手。
    card: {}
  - id: know-brief
    layer: L0
    navId: know-brief
    kind: carry
    index:
      hear: "新项目下发文档"
    nav:
      title: 下发文档范本
      subtitle: 触发：新项目下发文档 · 范式+不变量+一个闭环
    page:
      kind: carry
      kicker: 方法论 · 下发范本
      title: 如果重来：一份发给 AI 就能精准落地的开发文档怎么写
      lead: 针对复杂表格、弹层、字典这类功能。你之前累，是因为一开始各是各的实现，做着做着才发现都一样——应该先立范式再开发。但只立范式不够：范式管「怎么写」，管不了「写什么对」。所以一份能落地的文档必须两层分开：范式层（怎么写，硬化到能否决一种实现）+ 不变量层（写什么对，带否决条件）。范式层内部还有第一刀：一组表先打包成业务复合体，分档案复合体还是单据复合体——同一套表可以做档案管理、也可以被单据引用，行为完全两套，单表类型分不出这个差异，必须先在这一层分叉。再加一条：一次只给一个闭环。这是别人极简文档能成、你层层拉扯的真正分水岭。
      factsKicker: 这份范本解决什么
      factsTitle: 别人极简文档能落地，不是文档短，是约束硬 + 复合体先分叉 + 一次一个闭环
      factsLead: 范式层统一 UI 和交互，不变量层管业务对错。范式层内部先分复合体，再分单表类型。两层缺一不可，混在一起就层层拉扯。
      facts:
        - label: 先立范式再开发
          note: 所有表格/弹层/字典先定一套统一规则再开功能。不是边做边补、边补边发现都一样。
        - label: 范式要硬不要软
          note: 「统一弹性列宽」是口号，AI 四种写法都符合。改成「内容撑开、最小80、超长省略号」才硬到能否决。
        - label: 复合体先分叉
          note: 一组表先打包成业务复合体，分档案复合体（可改档案、要影响预览）还是单据复合体（只快照引用、不改档案）。单表类型分不出这个差异。
        - label: 不变量范式管不到
          note: 「改数量不刷产品名」是业务对错，不是 UI 统一。范式文档里没有，AI 照样会刷，你照样返工。
      tables:
        - kicker: 两层分开 · 核心
          title: 范式管怎么写，不变量管写什么对，现状从代码提取
          lead: 混在一起是返工源头：改一处要回头改三处。分开后，UI 统一归范式，业务对错归不变量，现状不手写。
          colA: 层
          colB: 管什么 · 怎么写
          rows:
            - - 范式层（怎么写）
              - UI、交互、弹层、字典的统一规则。每条硬到「两种写法只有一种符合」。不写业务对错。
            - - 不变量层（写什么对）
              - 业务规则、否决条件。如「改数量不刷产品名」「选档案才换价格来源」「取消不保存」。不写 UI。
            - - 现状层（现在长啥样）
              - 从代码提取，不手写。代码一变就脱节，手写维护是返工源头。
        - kicker: 复合体层 · 范式层内部第一刀
          title: 一组表先打包成业务复合体，分档案/单据两大分支，再往下走单表类型
          lead: 同一套表（如产品规格表）可以做档案管理，也可以被单据引用，行为完全两套。单表类型分不出这个差异，所以要先在复合体这一层分叉。这是你点出的、之前范本缺的那一层。
          colA: 复合体类型
          colB: 行为分支
          rows:
            - - archive_composite 档案复合体
              - 完整 CRUD；全局修改触发影响范围预览；改档案会影响所有引用它的单据；表头级联筛选；边用边建
            - - document_composite 单据复合体
              - 只读引用档案 + 快照隔离；编辑只作用本行；禁止改原始档案；不触发全局影响预览；筛选只限本单
        - kicker: 完整分支顺序
          title: 复合体 → 单表类型 → 视图，由大到小逐层分叉；不变量横跨各层
          lead: 页面 UI 只是最后输出。真正行为分支从复合体这一层就定了。不变量层不归任何一层，单独写。
          colA: 层
          colB: 定什么
          rows:
            - - 业务复合体
              - 一组表打包，先分档案/单据两大分支。决定能不能改档案、要不要快照、要不要影响预览
            - - 复合体内单表
              - dict_flat / dict_tree / main_biz_entity / relation_join。在分支内再细分行为
            - - 视图 viewMeta
              - 绑 compositeId，描述哪些列、列宽、组件、筛选开关。只展示，不改行为
            - - 不变量层（横跨）
              - 业务对错 + 否决条件。复合体管不了，必须单写
        - kicker: 口号怎么硬化
          title: 两种写法都符合这句话，这句话还不够硬
          lead: 范式层的每一条都要过这一关。过不了，AI 会自由发挥，你还是要回头补。
          colA: 还不够（口号）
          colB: 硬到能约束实现
          rows:
            - - 所有表格统一弹性自适应列宽
              - 列宽由内容撑开，最小 80px，超长省略号截断，空值显示 —
            - - 所有弹层紧贴输入框
              - 弹层顶边对齐输入框底边，向上空间不足时翻到上方，不产生页面滚动
            - - 所有字典边用边建
              - 字典格输入未命中时回车即新建，新建只填名称，其余字段在管理页补
            - - 所有变更用色彩标记
              - 原值灰色删除线、新值蓝色，禁止用「旧→新」纯文本包一对值
            - - 所有删除要校验引用
              - 被任何在用单据引用时禁止删除，按钮置灰并提示引用处
        - kicker: 一次一个闭环
          title: 不要一次让 AI 动四摊互相耦合的功能
          lead: 任何一摊理解偏差都会连环返工。把耦合的拆成轮次，每轮自己能验收。
          colA: 这一轮给一摊
          colB: 拆到下一轮
          rows:
            - - 产品档案：产品+规格+品牌+单位四层录入
              - 价格策略、单位换算、停用历史
            - - 订单行：选档案抄入 + 手输非标
              - 价格来源切换、点位批量调
            - - 字典格：边用边建 + 管理页 CRUD
              - 引用保护、影响范围预览
        - kicker: 下发文档骨架
          title: 一份该写什么、不写什么
          lead: 这就是丢给 AI 的那份。范式层 + 不变量层 + 一个闭环 + 验收标准。不写表名组件接口。
          colA: 写
          colB: 不写
          rows:
            - - 这类活是什么（一句话，只写本环）
              - 字段名、表名、组件名、接口签名
            - - 复合体类型：档案复合体 / 单据复合体
              - 跳过复合体直接到单表类型
            - - 范式层：UI/交互/弹层/字典统一规则（硬化）
              - 精神口号（统一、自动、全局）
            - - 不变量层：业务规则 + 否决条件
              - 实现细节（用哪个组件、怎么调接口）
            - - 本次交付范围：只给一个闭环
              - 一次耦合四摊互相依赖的功能
            - - 验收标准：每条对照硬效果能否决
              - 「要好用」「要清晰」这类软词
      rulesKicker: 不管怎么实现
      rulesTitle: 一份下发文档最终要达到
      rules:
        - - 先交提纲再动手
          - 让 AI 先交拟切的一类活 + 复合体类型 + 范式提纲 + 不变量清单，确认前禁止画页面、建表。
        - - 复合体先分叉
          - 一组表先打包定复合体类型（档案/单据），行为分支从这里分。再往下才是单表类型。不要跳过这一层直接到单表。
        - - 范式层只写怎么写
          - UI/交互/弹层/字典的统一规则，硬化到能否决一种实现。不写业务对错。
        - - 不变量层只写写什么对
          - 业务规则带否决条件。不写 UI。范式和复合体都管不到的，全在这里。
        - - 现状从代码提取
          - 不手写维护现状描述。代码一变文档就脱节，脱节就返工。
        - - 一次一个闭环
          - 把耦合的多摊拆成轮次。一次让 AI 动四摊互相依赖的功能，任何一处理解偏差都连环返工。
    card: {}
  - id: know-loop
    layer: L0
    navId: know-loop
    kind: carry
    index:
      hear: "接到任意功能需求"
    nav:
      title: 接到需求先归类
      subtitle: 触发：接到功能需求 · 先打包归类共性差异再动手
    page:
      kind: carry
      kicker: 方法论 · 接到需求先归类
      title: 甩给任何 AI：接到任意表格功能，自动向上抽象、归类、分支、提炼共性差异
      lead: 这不是教用户怎么写文档，是教 AI 怎么工作。用户不管说多少轮、多少表、多少功能，AI 都跑同一个循环：先列出来 → 向上打包成复合体并归类 → 单表归类 → 跨功能提炼共性和差异 → 摆给用户看 → 共性走同一套槽位、差异走分支 → 落地前先查项目里有没有同类。这样用户不用自己抽象，AI 帮他理清；新功能自动复用已有分支，不会各改各的。这是「刚改好产品选品、发现供应商选品又不对」的根治法。
      factsKicker: 这套工作法解决什么
      factsTitle: AI 主动抽象，用户只管说，差异和共性 AI 摆出来给用户看
      factsLead: 用户零散说表、说功能；AI 自己打包、归类、命名，反过来摆给用户确认。抽象这件事不该让用户做。
      facts:
        - label: AI 主动抽象
          note: 用户零散说表、说功能，AI 自己向上打包成复合体、归类、命名。不等用户写好再发。
        - label: 提炼差异与共性
          note: 跨功能找同一类现实问题→抽公共槽位；找差异→分到分支。摆给用户看，用户一眼知道差异在哪。
        - label: 改前先查同类
          note: 改任何一类功能前先查项目有没有同类，有就改公共槽位，不要改单点。这是杜绝「刚改好A选品发现B选品又不对」的根。
      tables:
        - kicker: AI 工作循环
          title: 接到任意表格功能就跑这六步，不急着写代码
          lead: 每轮对话都跑。不管用户说了多少表、多少功能，AI 先抽象归类，摆给用户确认，再动手。
          colA: 步
          colB: 做什么
          rows:
            - - 1 收集
              - 把这轮说的所有表、功能、视图列出来，不急着写代码
            - - 2 向上打包
              - 相关表打包成业务复合体，命名 + 归类（按现场抽象，不限于固定名词）
            - - 3 单表归类
              - 复合体内每张表标类型（字典 / 主实体 / 关联 / …，按现场抽象）
            - - 4 提炼共性与差异
              - 跨复合体 / 跨功能找同一类现实问题→抽公共槽位；找差异→分到分支
            - - 5 反向给用户看
              - 把抽象结果摆给用户，让他一眼看到差异点和共性，确认后再动手
            - - 6 落地
              - 共性走同一套槽位 / 组件，差异走分支；新功能先查是不是已有某一类
        - kicker: 归类按现场，不套固定名词
          title: AI 看现场形态自己命名归一类，不要硬塞进已有词
          lead: 复合体类型和单表类型由现场长啥样定，不是固定两张表。现场出现新形态，AI 自己命名一类。
          colA: 现场长啥样
          colB: AI 怎么抽象
          rows:
            - - 一组表围绕一个档案维护
              - 打包成档案类复合体，命名由现场出，不限于「档案」二字
            - - 一组表围绕一张单的流转
              - 打包成单据类复合体，单据行只快照引用不改档案
            - - 表只存谁连谁
              - 归关联类，只改绑定不解绑本体
            - - 表是全店名单
              - 归字典类，边用边建、被引用不能删
            - - 现场出现上面没有的形态
              - AI 自己命名归一类，不要硬塞进已有名词
        - kicker: 升维提问（拿到问题先做）
          title: 先问「这属于哪一类问题」，再决定方案——不许就近找实现
          lead: 为什么用户（不专业）总能先发现更优解，AI 不能？因为问题一到，AI 就被压到具体层——找最近的实现、复用现成的，从来没人先升维。把升维做成强制第一步，更优解才会自己浮出来；这一页里所有「就近/将就/复用」的事故，根子都是没做这一步。
          colA: 步
          colB: 问什么 · 产出什么
          rows:
            - - 1 归类到类型
              - 这个问题属于哪一类（交互范式/导航形态/编辑单元格/多记录矩阵/长文导航）？说出类名，没类名就不动手。
            - - 2 问通用最优
              - 这一类问题的通用最优范式是什么？不只看本项目——问这一类在该类型的标准做法。
            - - 3 定位现状版本
              - 本项目里这一类已有的实现，是该范式的雏形/低配/误用，还是正确版本？列出差距。
            - - 4 方案 = 范式 − 差距
              - 从「通用范式」出发补差距，不从「最近的实现」出发将就。差异走配置，不另起一套。
            - - 5 交付前自检
              - 我问过「这属于哪一类问题、这类问题的通用最优是什么」吗？没问过=方案大概率是就近的实现，退回重问。
        - kicker: 杜绝重复实现的纪律
          title: 改前先查同类，不要各改各的
          lead: 「刚改好产品选品、发现供应商选品又不对」就是没先查同类、各改各的。改任何功能前先查项目有没有同类公共能力。
          colA: 痛点
          colB: AI 该怎么做
          rows:
            - - 刚改好产品选品，供应商选品又不对
              - 改前先查：选品是不是同一类公共能力？是就改公共槽位，一次全对
            - - 两个页面逻辑几乎一样
              - 先向上抽象成公共，再统一改，不要继续补这一处
            - - 新功能跟已有功能行为像
              - 先归到已有复合体类型走已有分支，不要新开一套
            - - 用户说了一轮新表
              - 跑同一个循环，先归类再动手，不要直接写代码
      rulesKicker: 不管实现什么
      rulesTitle: AI 接到任意功能，始终要做到
      rules:
        - - 先升维再动手
          - 没说出「这属于哪一类问题」就动手=没升维。归类到类型、查该类通用最优、定位现状版本，三步走完才决定方案。更优解靠升维，不靠用户提醒。
        - - AI 主动抽象不等用户写好
          - 用户零散说，AI 自己打包复合体、归类、命名，反过来摆给用户看。抽象这件事不该让用户做。
        - - 归类按现场不套固定名词
          - 复合体类型和单表类型由现场形态定，AI 自己命名。不限于档案 / 单据两种。
        - - 改前先查同类
          - 改任何功能前先查项目有没有同类公共能力，有就改公共槽位。这是杜绝各改各的根。
        - - 提炼差异与共性摆给用户
          - 抽象完把差异点和共性摆出来，让用户一眼看清，帮他理清需求。
        - - 新功能先归已有分支
          - 新功能像已有的某一类，走已有分支复用，不要新开一套。
        - - 每轮都跑同一个循环
          - 不管第几轮对话，AI 都先抽象归类再动手，保证项目演进里同类功能始终走同一套。
    card: {}
  - id: know-layout
    layer: L0
    navId: know-layout
    kind: carry
    index:
      hear: "建/改文档站点、往里加一章"
    nav:
      title: 文档项目怎么分层
      subtitle: 触发：建/改文档站点 · 一章一文件
    page:
      kind: carry
      kicker: 方法论 · 文档项目怎么分层
      title: 改一章只动一个文件：写文档的那个项目，自己也要能长期长
      lead: 写文档的这个项目，自己也是个项目，也会一直长。它以前是一整个文件塞四千多行：想改「销售开单」这一段，得把全文读一遍才知道边界在哪；换个工具来干，更是读都读不进去。所以分层这件事不能只在对话里说一次，要写进可视化自己这一页——谁接手、用什么工具，翻开这一页就知道文件怎么摆、改哪一段动哪个文件、加一章要登记哪两处。这一页和「对话 → 指导思想」一样，可以整个带到下一个项目去，把名字换成新现场的那套。
      factsKicker: 这一页解决什么
      factsTitle: 文档项目废掉的方式很固定：不是写错，是长到一个文件装不下，之后没人敢改
      factsLead: 内容、画法、样式挤在一个文件里，前期最快，后期最贵。分层不是讲究，是让文档还能继续改下去。
      facts:
        - label: 改一章要读全文
          note: 所有内容在一个文件里，改一章得把几千行都读进来才知道边界。工具装不下就截断，截断就改错；改错还看不出来，因为页面照样能开。
        - label: 换工具就失忆
          note: 分层方式只在上一轮对话里说过。换个工具来接手，不知道文件怎么摆，又按自己的习惯把新内容塞回那个大文件，前功尽弃。
        - label: 加一章不知道登记哪
          note: 内容、导航、加载清单三处分散。加一章只改一处，侧栏看不见、文件不生效，人以为写了其实没挂上。
        - label: 拆完不知道有没有少
          note: 手工拆大文件，标量字段、缩进不齐的成员最容易静默丢失。页面照常打开，内容已经少了一条，要等哪天有人逐条对才发现。
      tables:
        - kicker: 三层怎么分
          title: 写什么 / 怎么画 / 长什么样，三件事分三个地方
          lead: 分工按「改它的频率」定：内容天天改，画法偶尔改，样式最少改。改得最勤的那一层要切得最细。
          colA: 层
          colB: 放什么 · 什么时候动它
          rows:
            - - 内容层 js/data/**
              - 写什么。一章一个文件，目录跟着侧栏分组走。改得最勤，所以切得最细。
            - - 渲染层 js/app/**
              - 怎么画。按函数族切，跨文件共享全局作用域。加新画法、改某块的呈现时动。
            - - 样式层 css/**
              - 长什么样。按规则族切，加载顺序即层叠顺序。改观感时动。
            - - 装配清单 index.html
              - 唯一登记处。加载顺序就是依赖顺序，先加载的先挂上数据。加文件时动。
            - - 导航注册表 05-nav-groups.js
              - 侧栏有哪几章、章叫什么、归哪组。加章、改名、调序时动。
        - kicker: 文档内导航范式
          title: 多长的内容配什么导航：先数小节，再选范式，别拿现成的硬套
          lead: 顶部 tab 切换是为短篇（五段）设计的：内容少，切着看清爽。长文用它会把内容切碎，且顶部放不下完整小节名。范式跟体量走——选定前先数一数有几节。
          colA: 体量 / 场景
          colB: 导航范式 · 为什么
          rows:
            - - 3–6 节短篇（档案五段）
              - 顶部 tab 切换（#chapter-nav）：节少，切着看清爽，一节一屏内看完。
            - - 7 节以上长文（方法论各篇）
              - 侧边目录 + 滚动联动（#toc）：侧边放得下完整小节名；内容照常滚动不切碎；滚动自动高亮，随时知道自己在第几节。
            - - 20 节以上 / 层级深
              - 侧边目录 + 分组折叠 + 搜索：目录本身也要收敛，否则变成第二个长列表。
            - - 多级标题（章→节→点）
              - 树形多级目录：保留层级缩进，点到子节时父级保持展开。
        - kicker: 粒度与命名
          title: 一个文件读到什么程度算合适：一次对话能完整读完并改写
          lead: 粒度的标准不是「好看」，是「能不能被一次读完」。读不完就还会退化成瞎改。
          colA: 约束
          colB: 定多少 · 为什么
          rows:
            - - 单文件上限
              - ≤ 250 行。一个工具、一次对话能完整读完再改写，不必截断。
            - - 一章一文件
              - 指导思想每一章、订单每一个过程视图，各自独立成文。改一章不动别人的文件。
            - - 文件名
              - NN-语义.js。NN 是加载顺序，不是重要性；中间留号，方便插新文件。
            - - 文件头注释
              - 写清归属、来源、这一段的约定。换工具的人第一眼就能接上，不用猜。
            - - 大块再分组
              - 一个模型超过 200 行就按成员分组，但标量和数组必须跟着一起搬，不能只搬对象。
        - kicker: 改文档时动哪里
          title: 先认出这是哪一类改动，再决定动几个文件
          lead: 绝大多数改动只动一个文件。要动三处的只有「加一整章」这一件事。
          colA: 我要改什么
          colB: 动哪些文件
          rows:
            - - 改某一章的内容
              - js/data/04-why/ 下对应那一章的文件。只这一个。
            - - 改某个过程视图的内容
              - js/data/36-order-views/ 下对应那个视图的文件。只这一个。
            - - 改某个块怎么画
              - js/app/ 下对应那个函数族的文件。
            - - 改配色、间距、字号
              - css/ 下对应那一块。
            - - 加一整章
              - 建内容文件 → 05-nav-groups 登记 → index.html 加一行。三处，顺序不能反。
            - - 调章节顺序
              - 只改 index.html 的加载顺序，和 navGroups 里的 items 顺序。
        - kicker: 新增一章的步骤
          title: 五步走完，新章就挂上了；少一步就是「写了但看不见」
          lead: 加章是唯一必须动三处的操作。按这个顺序做，做完开页面验收。
          colA: 步
          colB: 做什么
          rows:
            - - 1 建内容文件
              - 在对应分组目录新建 NN-语义.js，文件头按同组文件的格式写归属和约定。
            - - 2 挂到数据对象
              - 文件里先 `DOC_VIZ.whyBiz = DOC_VIZ.whyBiz || {}` 再挂自己的 key。不要整块覆盖，会把别的章冲掉。
            - - 3 登记导航
              - 在 05-nav-groups.js 对应组的 items 里加一条：id / title / subtitle / enabled。
            - - 4 登记加载
              - 在 index.html 按序加一行 script，位置跟着分组走。
            - - 5 开页面验收
              - 侧栏看新章在不在、正文渲染对不对、「复制本章 Markdown」能不能用。
        - kicker: 拆大文件的保真做法
          title: 拆完必须验一遍：原文和拆分结果各加载一次，逐字段比对
          lead: 拆分的坑都很安静——页面照常打开，内容已经少了。只有机器比对能兜住。
          colA: 坑
          colB: 怎么避
          rows:
            - - 只搬对象、漏了标量
              - '按「块内成员」扫描：标量、数组、对象一律带走。不能只认 `key: {` 这一种形态。'
            - - 缩进不齐的成员被漏
              - 原文件存在缩进不齐（某个 lead 是四空格但与同级成员并列）。用括号深度判层级，不要靠数空格。
            - - 数组块被提前截断
              - 括号平衡要同时认 { [ ( 三种。只认一种，数组块会被拦腰截断。
            - - 函数参数括号被当成块
              - '`function (a) {` 里的 ( 会先闭合，导致只切到第一行。定界之后用解析器验一次语法完整性。'
            - - 拆完看不出少了
              - 把原文和拆分结果各加载一遍，逐字段深度比对，把差异打印出来。零差异才算收工。
      rulesKicker: 不管用什么工具来写
      rulesTitle: 这八条守住了，这个项目就能一直长下去
      rules:
        - - 导航范式按体量选
          - 先数小节再选范式：3–6 节顶部 tab 切换；7 节以上侧边目录+滚动联动；20 节以上加分组折叠与搜索。拿现成的硬套=把长文切碎。
        - - 导航是指示器不是控制器
          - 长文导航只指示「你在第几节」，内容始终完整可滚。禁止用切换隐藏把长文切碎——用户要的是定位，不是分页。
        - - 一章一文件，单文件不过 250 行
          - 粒度标准是一次对话能读完并改写。超了就按成员再分一组，不要硬塞。
        - - 约定写进项目，不写进对话
          - 分层规范必须落在可视化自己这一页。换谁来、换个什么工具，翻开就知道。
        - - index.html 是唯一装配清单
          - 所有内容、渲染、样式文件都在那里按序登记。加载顺序就是依赖顺序，别在别处偷偷引。
        - - 内容层不许写渲染逻辑
          - 内容层只负责挂数据。要画成什么样，是渲染层的事。混在一起就又变回那个大文件。
        - - 加章必须三处登记
          - 内容文件、navGroups、index.html。只改一处等于没加。
        - - 拆完必须做保真比对
          - 原文和拆分结果各加载一次逐字段比。零差异才算拆完，不能凭「页面能开」就收工。
    card: {}
  - id: know-recover
    layer: L0
    navId: know-recover
    kind: carry
    index:
      hear: "文档改动记账 / 出问题回滚"
    nav:
      title: 版本记录与恢复
      subtitle: 触发：文档改动前后 · 有账可查可回滚
    page:
      kind: carry
      kicker: 方法论 · 版本记录与恢复
      title: 改动都有迹可循：出了问题按记录回滚，恢复到哪里由人确认
      lead: 这个项目从第一天起就有版本管理：每一次改动都有一条记录，写清改了什么、为什么改。它的价值不在记录本身，而在出了问题时——你能翻出「最近改过什么」、能确认「我要回到哪个点」、能跟 AI 说清楚「帮我查记录 / 给我恢复方案」。这一页把四件事讲明白：记录存在哪、改动怎么记、问题来了怎么描述、恢复怎么走。你不必会 git 命令，但要会这三句话，AI 才能接得上；恢复是不可逆操作，AI 必须先给方案、你确认后才执行。
      factsKicker: 这一页解决什么
      factsTitle: 怕的不是出错，是出了错不知道改过什么、能不能退回
      factsLead: 版本管理不是仓库的事，是「人能不能看懂改动历史、能不能安全回到某个点」的事。
      facts:
        - label: 只改不记，改完就忘
          note: 改完代码不写记录，过几天连自己都说不清这一版动了什么，更没法让 AI 帮你查。记录是给别人（包括未来的自己）看的索引。
        - label: 出了问题不知道往哪回
          note: 有版本管理，但不知道 git log / reflog 能查、不知道「恢复」其实是回到某个提交。AI 说「已回滚」，你听不懂回滚到哪了，就没法验收。
        - label: 不知道还有恢复功能
          note: 除了正式记录，还有操作流水（连回退、删除都留痕）、暂存柜（做一半先收走）、隔离分支（实验不碰主线）。不知道这些功能存在，等于没有保险。
        - label: 回滚是全退还是单退
          note: 一种回滚是把后面的改动一起退掉，另一种是只退掉某一次改动、保留后续。分不清就会误伤：想退一次，结果把之后的好改动也退了。
      tables:
        - kicker: 记录存在哪
          title: 四本账：正式台账 / 操作流水 / 暂存柜 / 隔离通道，各记各的
          lead: 「调最近的记录」之前，先知道记录分几本。日常先翻第一本，退过头了翻第二本。
          colA: 账本
          colB: 记什么 · 什么时候用它
          rows:
            - - 正式台账 git log
              - 每一次改动的正式记录：改了什么（提交信息）、什么时候、在哪一版。日常「查最近改了什么」先翻它。
            - - 操作流水 git reflog
              - 本地所有操作的流水账：连 reset 回退、删分支、跳走都会留痕。不小心退过了头、找不到原来的位置，用它翻回来。
            - - 暂存柜 git stash
              - 做一半不想丢、又不想提交的改动，先收进柜子。做完了可以取回；不需要了可以清掉。
            - - 隔离通道 分支 branch
              - 互不干扰的改动线。想在主线之外试个方案，开条分支试，成了再决定要不要合进来，不成直接丢。
        - kicker: 改动怎么记
          title: 提交信息是给人看的索引：一条改动一条提交，说清改了什么
          lead: 记录写得越清楚，回滚时越好找。混在一起提交，等于回滚时只能整片退。
          colA: 约束
          colB: 怎么写 · 为什么
          rows:
            - - 按逻辑隔离提交
              - 一类事一个提交：feat 功能 / fix 修复 / chore 清理。混在一个提交里，回滚就没法只退其中一件。
            - - 信息写清「改了什么」
              - '`feat: 单位全局字典化改造` 一眼看懂。写「修改若干」等于没写，翻记录时猜不出是哪次改动。'
            - - 开工前工作区干净
              - 动手前 git status 应为 0 条未提交。带着旧改动开新活，两件事会搅进同一个提交，出错分不清是谁的。
            - - 推不推送由人定
              - 提交在本地随时可回；推上云端就是公开历史。推送前先看与云端的差异，别覆盖别人的提交。
        - kicker: 问题来了怎么描述
          title: 标准三句话，AI 就能帮你查记录、定位、给恢复方案
          lead: 自己不用背 git 命令，但要会说这几句话。话术对得上，AI 才知道你要哪本账、动哪一步。
          colA: 我要做什么
          colB: 就这么说
          rows:
            - - 查最近改了什么
              - 「把最近的提交记录调出来给我看看」——AI 跑 git log 列给你，你按提交信息对得上是哪次改动。
            - - 看某次改动明细
              - 「把最近这次提交（或某天）的改动明细调出来，改了哪些文件、每处改了什么」——AI 跑 git show / git diff 给你看。
            - - 要恢复到某个点
              - 「我要恢复到 XX 之前的样子，先别动手，把方案和影响列出来给我确认」——AI 先给方案，你确认后它才执行。
            - - 退过头了要找回来
              - 「我回退过头了，帮我从操作流水里找回原来的位置」——reflog 里能翻出回退前的点，重新指回去。
        - kicker: 恢复怎么走
          title: 恢复四步：翻记录 → 看差异 → 人工确认 → 执行验证
          lead: 恢复是不可逆操作。顺序不能跳：先看清要退到哪、会退回哪些改动，你点头，才动手。
          colA: 步
          colB: 做什么
          rows:
            - - 1 翻记录
              - git log 看最近的改动，git reflog 看操作流水。先找到「目标点」在哪一版。
            - - 2 看差异
              - git show <目标点> / git diff 看那次改动了哪些文件、每处怎么改的。确认这确实是要退的那次，而不是别的。
            - - 3 人工确认
              - AI 把「要恢复到哪、会退回哪些改动、有没有已推上云端」讲清楚，你确认后再执行。确认永远不亏。
            - - 4 执行并验证
              - 执行恢复后 git status 干净、页面正常。万一恢复错点也不用慌——操作流水里留了痕，还能再退一步。
      rulesKicker: 不管谁来操作
      rulesTitle: 五条守则，让每一次改动都可查、可回、可人工确认
      rules:
        - - 改前先确认工作区干净
          - 开工前 git status 应为空。带着旧改动开新活，出错时说不清是哪次改的，回滚就无从谈起。
        - - 一条改动一个提交，信息写清
          - feat / fix / chore 分开提交，信息说明改了什么。这是你回滚时的索引，写得越清越好找。
        - - 恢复前先给方案，人工确认后执行
          - 凡涉及回退、删提交、删分支，AI 必须先列方案和影响范围，你确认后才动手。不可逆操作不允许直接做。
        - - reflog 是最后保险
          - 任何操作都留痕。退过头、删错，都能从操作流水翻回来。出了事先查记录，别慌。
        - - 推送时机由人定
          - 提交留在本地随时可回；推上云端前先看差异，未获指示不推送。
    card: {}
  - id: know-route
    layer: L1
    navId: know-route
    kind: carry
    index:
      hear: "每轮任务对话开工前 / 判完类型判产物后"
    nav:
      title: 对话分流
      subtitle: 每轮对话第 0 步 · 判类型→判产物→查方法论→干活→报验收
    page:
      kind: carry
      kicker: 方法论 · 对话分流
      title: 每轮对话先到这里：判类型 → 判产物 → 查方法论 → 干活 → 报验收
      lead: 用户的对话是一切的入口。不管讲的是新需求、调整还是纠错，任务类对话都走五步：判类型、判产物（查台账）、查方法论、干活、报验收。判产物先查台账不靠记性；干完必须给出可操作的验收清单，不许只说「做完了」。不是每轮对话都要生成文档，但每轮对话都必须经过这一层——跳过分流直接动手，就会文档代码各走各的、同类问题各改各的。
      factsKicker: 这一层解决什么
      factsTitle: 对话不分流，文档和代码就各走各的；分流定了，每轮对话都进体系、干完有验收
      factsLead: 分流不是每轮都产文档，是每轮都定性：这段话动不动文档、动不动代码、动之前先读哪页、干完怎么验收。
      facts:
        - label: 对话是唯一入口
          note: 用户讲的一切先到分流层定性，不直接变成代码或文档。定性靠判类型+判产物两步，不靠感觉。
        - label: 判定查台账不靠记性
          note: 「文档已规定、代码没实现」这类判定，先查 docs-coverage.md 台账再下结论。AI 不读代码就断言，小白用户识不破——所以判定必须有账可查。
        - label: 动手前先查方法论
          note: 判了要干活，按技能索引查这类活有没有方法论：涉及表功能就先读「表功能」再动。没有对应方法论且发现重复信号，走「怎么沉淀」。
        - label: 干完必须报验收
          note: 用户不会看代码，行为验收是唯一质量闸门。AI 干完活主动给出验收清单（打开哪页、点什么、应看到什么），不许只说「做完了」。
      tables:
        - kicker: 第 0 步 · 快慢通道
          title: 先分轻重：轻对话只定性不表演，重对话走完五步
          lead: 分流的目标是「不漏定性」，不是「每轮表演流程」。仪式可以省，定性不能省。
          colA: 对话
          colB: 走法
          rows:
            - - 纯澄清、概念追问、和项目无关
              - 快速通道：直接回答，不输出分流仪式；答完顺手检查文档有没有露出缺口
            - - 要干活：需求整理 / 变更调整 / 纠错反馈
              - 完整五步：判类型 → 判产物 → 查方法论 → 干活 → 报验收
            - - 拿不准轻还是重
              - 按重走。宁可多走一步分流，不可漏一次定性。
        - kicker: 第一步 · 判对话类型
          title: 这段对话是什么，定性了后面才有规则可套
          lead: 类型由对话原话长什么样定，不猜意图。
          colA: 对话长什么样
          colB: 定性
          rows:
            - - 讲一个新现场、新项目，或一堆零散需求
              - 需求整理 → 大概率产生文档任务
            - - 要改某个已有行为、加字段、换逻辑
              - 变更调整 → 先查台账文档有没有规定，再定改文档还是改代码
            - - 指出哪里不对、哪个和哪个不一致
              - 纠错反馈 → 先定位：代码错、文档错，还是都没错只是理解偏（按裁决链裁）
            - - 追问某个概念为什么这么定
              - 澄清问答 → 快速通道，只答不改；答着答着发现文档缺页，转文档任务
            - - 和项目无关
              - 闲聊 → 不进体系
        - kicker: 第二步 · 判产物
          title: 文档任务、代码任务，还是都有——先查台账，再按规则定
          lead: 判定前先查 docs-coverage.md 台账，不靠 AI 记性。文档是唯一规范源：文档没规定的先补文档；文档已规定的直接排代码，不重复生成文档。
          colA: 情况
          colB: 产物
          rows:
            - - 文档没写这个行为，对话讲清了一个新要求
              - 文档任务：先按对应生成方法论补文档，再排代码
            - - 台账显示已规定未实现
              - 代码任务：不重复生成文档，直接按文档排代码。重复生成=分流失败
            - - 文档和代码都有，但相互矛盾
              - 双任务：先按裁决链改文档定对错，代码跟着文档走
            - - 文档有对应规则，只是实现细节要调
              - 代码任务：改前先读对应方法论，按它的步骤与否决项干
            - - 纯澄清
              - 无任务：回答完，顺手检查文档有没有因此露出缺口
        - kicker: 要补文档时 · 文档分层
          title: 先定调整落在哪层：不是每次都惊动指导思想
          lead: 文档跟项目是对应的，但分层定落点。多数日常调整只动规格层，指导思想不动。
          colA: 层
          colB: 什么调整落这里 · 用哪条方法论
          rows:
            - - 指导思想层
              - 业务规则变了：谁在谁下面、能不能串、效果重定义。走「对话 → 指导思想」。
            - - 规格层
              - 字段、交互、确认策略、场景截断变了。改登记表/对应设计篇，指导思想不动。多数日常调整在这层。
            - - 代码层
              - 纯实现：文档已写清，只是实现要调。不产生文档任务。
        - kicker: 第三步 · 查方法论
          title: 要干的活属于哪类，先读对应那页再动手
          lead: 技能索引按「标题即触发信号」命名：看名字就知道什么时候用。索引同时登记在 AI 执行卡（AGENTS.md），那是 AI 真正的入口。
          colA: 活属于哪类（触发条件）
          colB: 先读哪页 · 干什么
          rows:
            - - 对话要沉淀成新项目的指导思想、切一类活
              - 「对话 → 指导思想」· 先切活交提纲，六条线写满才准设计
            - - 想看方法做通之后长什么样（要实样）
              - 「对照本项目」· 只作参照，不把本项目的活复制过去
            - - 要把方法装进新项目的下发文档
              - 「下发文档范本」· 范式层+不变量层+一个闭环
            - - 接到任意功能需求，要先抽象归类
              - 「接到需求先归类」· 收集→打包→归类→共性差异→摆给用户→落地
            - - 识别到表功能：存数据/列清单/挂关系/留痕迹
              - 「表功能」· 画关系图→推集合体→分层→插槽→变更回图
            - - 要建/改文档站点，或往里加一章
              - 「文档项目怎么分层」· 一章一文件，登记侧栏+加载清单
            - - 文档要改动，或改完要记账/出问题要回滚
              - 「版本记录与恢复」· 先记再改，恢复点人工确认
            - - 同类问题第二次出现，或高代价教训
              - 「怎么沉淀方法论」· 按六步登记进真相源才算
        - kicker: 第四步 · 分派
          title: 按读到的方法论干活，不跳步
          colA: 做什么
          colB: 硬边界
          rows:
            - - 声明走哪条
              - 先说出「走哪条方法论、现在第几步」，用户可验收可纠正。闷头就做=没分流。
            - - 按步骤执行
              - 命中后按该方法论的流水线与否决项干。用户随时能问进度。
            - - 多命中串行走
              - 几条都命中按流水线顺序串（分流 → 接到需求先归类 → 表功能），不挑一条跳过其余。
        - kicker: 第五步 · 报验收
          title: 干完活必须给出验收清单，不许只说「做完了」
          lead: 用户不会看代码，行为验收是唯一质量闸门。AI 干完活主动给清单，用户照着点。
          colA: 产出
          colB: 要求
          rows:
            - - 行为验收清单
              - 打开哪页、点什么、应看到什么，一条条可操作。写不出清单=改动范围没说清。
            - - 对照文档
              - 验收条目从文档规则反推（哪条规则→哪个行为），不凭 AI 自说自话。
            - - 复杂改动
              - 能自动测的跑一遍（如 e2e 浏览器走查+截图），把结果摆给用户。
            - - 回写台账
              - 动了文档或代码，回写 docs-coverage.md 对应行状态。
        - kicker: 冲突裁决
          title: 文档、代码、现场打架时，按这条链定谁对
          lead: 用户是最终裁决者：AI 摆出各方说法、引用裁决链，用户做确认题。
          colA: 位次
          colB: 谁 · 说明
          rows:
            - - '1'
              - 用户原话意图 · 用户口头讲的需求最优先，文档是从它长出来的
            - - '2'
              - 现场事实 · 真实业务怎么运转，不以文档意志转移
            - - '3'
              - 文档可视化 · 唯一规范源，代码必须跟它
            - - '4'
              - 代码现状 · 只作参考，不是对错依据
      rulesKicker: 不管跟哪个 AI
      rulesTitle: 每轮对话都要达到
      rules:
        - - 任务对话必分流
          - 要干活的对话走完五步才轮到动手。轻对话只定性不表演，但定性不能省。
        - - 操作不中断
          - 该做的全部做完，禁止做完一段停下来问「要不要继续」。需要用户决策的先记下、继续干，最后用 IDE 选项提问面板一次性给出让用户点选，不占对话回合。能自己决定的按裁决链自行决定并在验收清单说明。
        - - 判定查台账
          - 「文档有没有规定」先查 docs-coverage.md，不读就断言=分流失败。
        - - 先文档后代码
          - 文档是唯一规范源。文档没规定的先补文档再排代码；代码任务按文档干。
        - - 文档已规定不重生成
          - 台账显示已规定未实现就按代码任务走，不重复生成文档。重复生成=分流失败。
        - - 动手前读方法论
          - 查到对应篇先读再干，按步骤与否决项执行；查不到且属重复信号，走沉淀。
        - - 干完报验收
          - 每次收尾必须给可操作的行为验收清单，并回写台账。只说「做完了」=没走完。
        - - 冲突按裁决链
          - 用户原话意图 > 现场事实 > 文档可视化 > 代码现状。摆出各方说法，用户确认。
        - - 每轮有去向
          - 分流完每段对话都有定性：进文档、进代码、只回答、或进沉淀。没有去向=没分流。
      ruleBlocks:
        - kicker: 执行卡 · 本页怎么被 AI 真正执行
          title: 一处登记：真相源加条目，生成器全站生效
          lead: 方法论不会自动被 AI 读到。挂载靠两层：真相源一处改（生成站点+执行卡），加项目级规则文件让 AI 每次会话必读执行卡。
          rules:
            - - 真相源一处改
              - 改方法论只改 data-source/methodology.yml，跑 node tools/gen-docs.mjs——站点篇章、侧栏、执行卡 GEN 节自动同步，不存在多处改漏。
            - - 规则文件是引信
              - .codebuddy/rules/methodology.md 是 AI 每次会话自动加载的入口，指向执行卡与真相源。改挂载方式时改它。
            - - 跨 AI 场景
              - 网页版 AI 读不到项目文件，把执行卡全文粘贴给它——它就是最低执行卡。
        - kicker: 和组内各篇的关系
          title: 分流是入口，沉淀是维护，其余是被调用的技能
          lead: 顺序即结构：对话先分流，缺方法论走沉淀，技能被命中后按步骤执行。
          rules:
            - - 先分流（本页）
              - AI 的统一入口。任务类对话五步走完才有资格收工。
            - - 缺就沉淀（下一页）
              - 什么时候新增/修改方法论、怎么命名（标题即触发信号）、怎么登记进真相源。
            - - 后技能（后面七页）
              - 对话 → 指导思想 / 对照本项目 / 下发文档范本 / 接到需求先归类 / 表功能 / 文档项目怎么分层 / 版本记录与恢复。标题即触发信号，命中后按步骤执行。
    card: {}
  - id: know-precipitate
    layer: L0
    navId: know-precipitate
    kind: carry
    index:
      hear: "同类问题第二次出现 / 高代价教训"
    nav:
      title: 怎么沉淀方法论
      subtitle: 重复才沉淀 · 三件套登记齐才算 · 标题即触发信号
    page:
      kind: carry
      kicker: 方法论 · 沉淀
      title: 什么时候沉淀什么：从重复里长出方法论，登记进真相源才算存在
      lead: 方法论不是一开始写全的，是项目里长出来的。触发沉淀的是重复，外加一个例外：高代价教训出现一次就立即沉淀。沉淀有固定流程，登记进真相源（加条目 → 跑生成器）才算生效——站点、侧栏、执行卡自动同步。只存在聊天记录里的方法论会蒸发，AI 下一轮照样想不起来，同一句话你得再讲一遍。
      factsKicker: 这一页解决什么
      factsTitle: 怕的不是没方法论，是有过却没留下来、留下了 AI 却调不到
      factsLead: 沉淀失败只有两种死法：没记下来（蒸发），记下了没登记（AI 看不见）。这一页把两条路都堵上。
      facts:
        - label: 重复才是信号
          note: 一次是案例，两次是模式。第二次出现同一种问题，才到该沉淀的时候。没有重复信号不开新篇。
        - label: 沉淀的是可复用规则
          note: 从案例里提出触发条件+步骤+否决项，剥掉本项目专名。别的项目也能用的才叫方法论。
        - label: 登记才算沉淀
          note: 写成篇章、加进侧栏、写进分流索引、同步 AI 执行卡，四样齐了才算。在对话里说过的，AI 下轮就忘。
      tables:
        - kicker: 什么时候沉淀
          title: 五个信号，出现就登记，不出现不硬造
          colA: 信号
          colB: 例
          rows:
            - - 同一教训第二次
              - 刚改好 A 选品，B 选品又出问题 → 沉淀「改前先查同类」
            - - 同一问题跨功能重复解决
              - 三个功能各写一套确认弹窗 → 沉淀确认策略三档
            - - 同一偏好讲第二遍以上
              - 用户两次纠正「先出图再写码」 → 并进对应方法论的步骤里
            - - 一条规则在多处被违反
              - 快照行被直接改了两回 → 把「快照不回改」写成硬规则
            - - AI 自己踩坑后找到稳的做法
              - 同类任务第一次错第二次对 → 对比两次，把差别抽成步骤
            - - 高代价教训（哪怕第一次）
              - 一次大坑够记一辈子的，不等第二次：立即沉淀为否决项，写进执行卡
            - - 规范存在但没被命中
              - 规则在代码/文档里有、执行卡没登记 → AI 照样违规（实例：确认层范式漏挂载，修规格表格时保留了常驻输入框）。挂载缺口按高代价教训立即补登记
            - - 有共用组件却没登记成清单
              - 要求对齐某范本，AI 却用了低一层的组件（实例：要求对齐供应商联系矩阵，实际参照邻近区块选了网格基座）。缺的不是规则是可查表——「查同类」只能就近猜。按高代价教训立即登记资产清单
            - - 问题被翻译窄了
              - 用户体感「长文档划很久找不到」→ 被翻译成「加个导航」→ 解空间只剩复用现成 tab，功能有了体验错了。教训：先复述体感再定问题，问题定义窄了，解就窄了
            - - 复用变成将就
              - 现有模式有适用前提（顶部 tab 为 3–6 节短篇设计），套到 10+ 节长文就成了将就。教训：沿用前先过适配度三问（为谁设计／差在哪／超阈值就换）
        - kicker: 怎么沉淀
          title: 留证据 → 提炼 → 去项目化 → 检验 → 登记 → 回写
          lead: 六步走完才算沉淀。走一半（只在对话里说）不算。
          colA: 步
          colB: 做什么
          rows:
            - - 1 留证据
              - 记下重复发生的原话/行为。案例是方法论的地基，抽掉案例规则立不住。
            - - 2 提炼
              - 从案例抽出三样：触发条件（什么时候用）+ 流水线/规则（怎么做）+ 否决项（防什么）。
            - - 3 去项目化
              - 剥掉本项目专名，换成现场通用语。带着「开单/配货」的方法论传到别的项目会被照套。
            - - 4 检验可证伪
              - 每条规则问：能否决一种实现？两种写法都符合=还不够硬，回去补精度。
            - - 5 登记进真相源
              - data-source/methodology.yml 加条目 → 跑 node tools/gen-docs.mjs，站点、侧栏、执行卡自动同步。没进真相源=没登记，AI 调不到。
            - - 6 回写旧篇
              - 和已有篇章交叠的，去旧篇接上引用。不要两处各说一套，也不要重复建篇。
        - kicker: 命名范式
          title: 标题即触发信号：看标题就知道处理什么、什么时候用
          lead: 方法论是给人看的，也是给 AI 命中的。标题本身就是触发信号，不要靠 subtitle 和分流表补。
          colA: 规则
          colB: 例
          rows:
            - - 标题=输入→产物
              - 「对话 → 指导思想」=对话进来、指导思想出去。「表功能」=识别到表功能就用。
            - - 输入物写进标题
              - 标题里要有处理什么（对话/需求/表功能/文档/版本），不要只有动作。「按一类活来写」就是反例：看不出什么时候用。
            - - subtitle 与分流表同源
              - 侧栏 subtitle 用「触发：…」格式，和「对话分流」技能索引的触发条件同源，一处改两处同步。
            - - 改名三处同步
              - 篇章 kicker、侧栏 title、分流页技能索引必须同批改，漏一处 AI 就对不上号。
        - kicker: 沉淀的颗粒度
          title: 沉淀方法与纪律，不沉淀一次性的事实
          colA: 归哪
          colB: 什么
          rows:
            - - 沉淀
              - 跨项目可复用的方法（写文档、开发表功能、AI 工作循环）；本项目稳定的纪律（快照不回改、改前查同类）。
            - - 不沉淀
              - 一次性事实（这家店叫什么、今天发生什么）；只出现过一次还没稳定的做法；对话过程本身。
            - - 先挂案例区
              - 出现一次但预感会重复的，先记在当前篇章的案例里，第二次出现再升格成方法论。
      rulesKicker: 不管沉淀什么
      rulesTitle: 最终都要达到
      rules:
        - - 重复才沉淀，重坑例外
          - 一次是案例，两次是模式；但高代价教训出现一次就立即沉淀。没有信号不开新方法论。
        - - 登记才算存在
          - 篇章+侧栏+执行卡由真相源一处生成；不登记进真相源，AI 用不到，等于没沉淀。
        - - 触发条件是门牌
          - 每条方法论必须有明确触发条件，写用户的话长什么样。写不出触发条件=还不是方法论。
        - - 去项目化
          - 方法论剥离本项目专名，换现场通用语。带专名的方法论传到别的项目会被照套。
        - - 可证伪
          - 每条规则硬到能否决一种实现。删掉它现场会断，才算规则；删掉不断的是废话。
        - - 抽象要落到可查表
          - 规则只写文字=AI 命中不了。抽象完必须落成可查的对照表（形态→组件/路径/参数）。写完问一句：AI 靠什么查到它？答不上=抽象只做了一半。
        - - 先保住体感再定问题
          - 用户的抱怨原句（划很久/找不到/分不清）是最高优先级信号。翻译成技术任务前先复述体感，禁止把体验问题窄化成「加个组件」。
        - - 复用前适配度三问
          - 沿用现有模式前先答：它当初为谁设计？我的场景差在哪？差异超阈值就换方案——复用不是将就。
        - - 看得见的东西先摆选项
          - 交互/导航/布局/视觉类改动，先给 2–3 个候选+适用条件+推荐，让用户选。只有纯技术实现才直接给最优解。
      ruleBlocks:
        - kicker: 和路由篇的关系
          title: 路由是索引，本篇是索引的维护规程
          lead: 路由表是门牌簿，本篇管怎么把新技能刻上门牌。
          rules:
            - - 登记即回写
              - 每沉淀一条，分流索引和执行卡就多一行触发条件。四处必须同步改，只改一处=登记没完成。
            - - 旧方法论也走本篇
              - 已有篇章要改（加规则、改触发条件），同样改真相源一处再重新生成，不能只改站点产物。
            - - 淘汰也走本篇
              - 方法论被证伪或被合并时，从篇章、侧栏、路由表三处同时下架，不留死链接。
    card: {}
