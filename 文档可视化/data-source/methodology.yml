    nav:
      title: 前后端职责
      subtitle: 触发：算力往前放 · 前端管体验后端管底线 · 笔记本性能封顶
    page:
      kicker: 项目规范 · 职责
      title: 算力往前放：前端做即时体验，后端只做存储、校验、广播
      lead: 性能预算按笔记本封顶、单店 50 人在线上限设计——禁止为多门店高并发做架构。能放前端的计算尽量放前端，后端不做前端能做的算。
      factsKicker: 两侧各干什么
      factsTitle: 前端=即时算价与乐观更新，后端=最终校验与事务
      factsLead: 分界判据：失败要不要回滚数据？要=后端；只是体验即时性=前端。
      facts:
        - label: 前端职责
          note: 即时算价、乐观更新、防抖、权限体验（三段式第一二段）、本地表单状态。
        - label: 后端职责
          note: 认证授权、最终校验（三段式第三段）、事务、广播；存储与账底。
      rules:
        - - 禁止服务端实时算价
          - 算价在前端即时完成，后端只存结果并做最终校验——每按键开事务＝违规。
        - - 禁止大范围重算
          - 改一处只重算受影响面，禁止全表/全单重算。
        - - 单店规模假设写死
          - 按「单店 50 人在线、笔记本跑得动」设计；为多门店高并发做的架构＝过度设计。
    card: {}
