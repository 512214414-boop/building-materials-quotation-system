items:
  - id: table-feature-pipeline
    layer: L0
    navId: know-table
    index:
      hear: "识别到表功能（存数据/列清单/挂关系/留痕迹）"
    nav:
      title: 表功能方法论
      subtitle: 触发：识别到表功能 · 画图→集合体→分层→插槽
    page:
      kicker: 方法论 · 表功能
      title: 识别到表功能，先画数据关系图：集合体是推出来的，层是图上定的，落点只有槽位
      lead: 带数据表的功能，从需求到落地走同一条流水线：认领 → 画关系图 → 推集合体 → 按图分层 → 对照槽位 → 变更回图。集合体类型、分层、槽位对照全部从关系图推出，不靠人记名词，也不靠 AI 临场发挥。没有这条流水线，每个表功能各自建表、各自写列、各自写确认，代码臃肿、逻辑交叉，改了这里那里又不对；有了它，表怎么变都改在图上，五个面自动跟。
      factsKicker: 这套方法解决什么
      factsTitle: 图是唯一入口，集合体和层是推论，落点只有槽位
      factsLead: 表从业务角度经常新增变动调整。入口不稳定，演进就是各改各的；把入口钉死在关系图上，变更才有同一条路。
      facts:
        - label: 关系图是唯一入口
          note: 实体+字段+关系+场景，一张图画完才有资格谈表。后面所有推导从图出，不从页面出，不从上一次的代码出。
        - label: 集合体是推出来的
          note: 相关表打包成集合体并归类，类型由关系图形态定，不由名词定。AI 看图归类，不靠问，也不硬套档案/单据两个词。
        - label: 分层定可变性
          note: 全局/挂载/行级/快照/标注/衍生，每层一条可变性与同步规则。改哪里波及谁，图上就定死，代码只是照图落地。
        - label: 共性走槽差异分支
          note: 分层结果对照已有槽位，共性插入自动产出五个面；确有差异才开 override 分支且登记在案。新功能先查是不是已有某一类。
      tables:
        - kicker: 表功能开发流水线
          navLabel: 流水线
          title: 识别到表功能就跑这六步，顺序不可跳、不可省
          lead: 哪一步产出什么写死在这里。跳过任何一步，都会回到「各立各的、各走各的」。
          colA: 步
          colB: 做什么 · 产出什么
          rows:
            - - 1 认领
              - 先判这是不是表功能：要存数据、要列清单、要挂关系、要留痕迹，中一条就是。是就声明走本方法，禁止直接画页面、直接建表。
            - - 2 画关系图
              - 实体（框）+ 字段（每框一份清单）+ 关系（连线：方向+基数+删除行为）+ 场景（谁在哪一步看/写）。图画不出来=需求没讲清，先回现场，不许猜着往下走。
            - - 3 推集合体
              - 相关表打包成集合体并归类，类型由关系图形态推出（见下一表）。产出：这个功能是哪一类集合体、里面每张表扮什么角色。
            - - 4 按图分层
              - 每个实体落到层上：全局/挂载/行级/快照/标注/衍生（见第三张表）。产出：每张表的可变性、同步规则、波及范围。
            - - 5 对照槽位
              - 拿分层结果查项目已有槽位：同构直接插槽五面产出；部分同构骨架走槽+override；确无同类先确认真没有，再按本方法建新槽并写回文档。
            - - 6 变更回图
              - 日后新增、变动、调整，入口都在图/登记表上：改图 → 集合体和分层重推 → 五面自动跟。禁止绕过图直接改某处代码。
        - kicker: 第一步 · 画关系图
          navLabel: ①画关系图
          title: 四个要素画全，少一个，后面的推导就是猜
          lead: 关系图不是装饰图，是唯一真相源。精度不够，槽位推不出来，确认策略选不准。
          colA: 要素
          colB: 画什么 · 精度
          rows:
            - - 实体
              - 业务里独立计数的东西，一框一个。框分两种：名单框（改名全局生效）和事件框（发生一次记一次），从画图起就分开。
            - - 字段
              - 每框一份字段清单：key/标题/类型/必填/唯一。一个字段只能归属一个框；两个框都想要，说明框拆错了或该做关系。
            - - 关系
              - 连线标三样：方向和基数（父→子 1:N，引用 N:1）、性质（父子挂载/字典引用/快照抄写）、删除行为（删父子跟不跟、被引用能不能删）。
            - - 关系画两条边
              - 同一张表可以同时有两条边：结构边（谁包含谁、粒度到哪层、删除跟谁走）和使用边（谁用它、入口嵌在哪）。入口位置≠结构位置——跨层引用画进结构树必然错位，所以图分两张：结构图（树，画归属）+ 使用图（边，画调用与入口）。两条边各自成立，互不改写。
            - - 形态
              - 每张表标注形态：档案（先有数据再增删改查）/ 明细（挂单据主表、录入流转）/ 视图（同一主表的投影，不是新表）/ 参数（圈组全局配置，不挂具体行）。形态是标签不是层级——加一个视图既不产生表也不产生层，所以视图在结构树里没有节点。判据：加了它会不会多一张表？不会=视图，会=明细或档案。
            - - 场景
              - 谁在哪一步看/写：档案页维护、开单时选用、履约中追溯、事后看数。同一实体多场景就多标一行——这行将来就是槽位的场景截断参数。
        - kicker: 关系的三种投影
          navLabel: ①b三种投影
          title: 一份图数据，三种看法——按需切换，不要只画一张
          lead: 真实结构是「图」：三种边（结构 / 使用 / 字典）共生，三种投影（结构树 / 全关系图 / 形态矩阵）各取一种视角。加一张表只改图数据，三个视图自动跟——视图不存自己的数据。
          colA: 投影
          colB: 取什么边 · 看什么
          rows:
            - - 结构树
              - 只取 struct 边。层级一眼可见，适合查「谁包含谁、粒度到哪层」。共享字典在树里必然重复或丢失，所以这里不画字典边、不画使用边。
            - - 全关系图（分层 DAG）
              - 三类边同图：结构实线（深色）/ 使用虚线（绿色）/ 字典点线（灰色）。看全局：跨层使用边、共享字典的多入边在这里才能看清。布局按 struct 边分层，无 struct 入边的（字典 / 参数）落末层。
            - - 形态矩阵（层 × 形态）
              - 不画边，画分布：每张表落在「层 × 形态」哪一格。一眼看出哪一类还没有、哪一类挤在一起。空格标"—这一格还没有"，也是判据：需要加哪一种就先在图数据里加节点。
        - kicker: 第二步 · 推集合体
          navLabel: ②推集合体
          title: 集合体类型由关系图形态定，AI 看图归类，不靠问人
          lead: 这是「自动抽象」的核心：形态→类型的对照写死，现场出现新形态就命名新类型写回本页。
          colA: 关系图长这样
          colB: 推出什么集合体 · 硬规则
          rows:
            - - 一组表围着一个名单框转，名单下挂子表
              - 档案集合体：名单全局唯一改名全局生效；挂载只存 ID；行级数挂叶子。否决「每个引用处存一份名称」。
            - - 一组表围着一张事件主表流转，行上抄了名单的字
              - 单据集合体：主表+行快照，行存 ID+当时值；后续各阶段（配货/收付/成本/售后）各成标注层，不改快照行。
            - - 单层名单框，无父依赖
              - 字典：边用边建、幂等直接建即选；被引用不能删；进槽自动带检索+快建+管理三面。
            - - 两框之间一张只存双方 ID 的表
              - 绑定表：只改绑定不解绑本体；管理挂父实体编辑，不算独立档案。
            - - 表的内容能从别的表推出来
              - 衍生宽表：不手填，源保存后同步；只服务检索与看数，不是事实源。
            - - 以上形态都不是
              - AI 自己命名归一类，把形态→类型的对照写回本页，下次复用。不许硬塞进已有名词。
        - kicker: 第三步 · 按图分层
          navLabel: ③分层
          title: 层定可变性和波及，图上定了，代码就定了
          lead: 每层一条规则，硬到能否决一种实现。分错层，后面每个功能都会为此打补丁。
          colA: 层
          colB: 可变性与同步规则 · 否决什么
          rows:
            - - 全局层（字典/名单）
              - 改名全局生效；被引用只能停用不能删；引用处一律存 ID。否决「改了档案还要挨个改旧单」。
            - - 挂载层（关系表）
              - 只存谁连谁（双方 ID），不存名称副本；管理挂在父实体里。否决「绑定表里再存一份名字」。
            - - 行级层（这行自己的数）
              - 数量/备注/单条改的价，挂叶子或行上，可单条改、整批调有确认档。否决「把行级数塞进名称里解析」。
            - - 快照层（单据行）
              - 落单抄 ID+当时值；事后档案改名不回改；改价走重抄流程。否决「快照行跟着档案变」。
            - - 标注层（对已发生行的补充）
              - 各阶段补充独立成表，可来回改；结清/定档冻结。否决「直接改快照行表示进展」。
            - - 衍生层（宽表）
              - 不手填，源保存后同步；统计基于 ID 不基于名称。否决「报表数据手工补一条」。
        - kicker: 落地形态 · 第一层：共性（必经）
          navLabel: ④形态·共性
          title: 关系图层级 + 表类型 → 大类形态，任何功能都先走这一层
          lead: 一个树形关系图集合体=一个管理功能：名称列点开，就能编辑整棵树上所有表。这一层是所有功能必经的共性层，只定「用哪一类形态」；差异不在这里处理，交给第二层。
          colA: 关系图中的位置 · 表类型
          colB: 大类形态
          rows:
            - - 关系层级模型（一个集合体=一个管理功能）
              - 名称列点开即编辑整棵树上的表：逐层切换（名单层→挂载层→行级层），每层的切换方式由它在图上的位置决定。UI 层级必须与数据模型一致——图上挂谁下，界面就嵌谁下。关系层级图先画对画准，形态推导才有依据
            - - 挂载树的画法（粒度定层级）
              - 树的每一层=一次挂载：粒度到哪一层就挂到哪一层，禁止把不同粒度的表画成同级（常见误用：把粒度更细的子表平铺成父节点的同级）。视觉必须逐层嵌套缩进，父子关系一眼可见。画完自检：每一层的粒度是否一致？粒度更细的表是否挂到了它所属的下一层？
            - - 级联切换行（中间层统一形态）
              - 每个中间层一行：行首=层级名，选项横排（唯一性字段值或字段拼接），选中高亮，末尾=新增空位（确认层）。多行级联（品牌行→规格行→单位行）整体呈现挂载层级关系，一眼看清
            - - 单字段层 vs 多字段层
              - 单字段层级（品牌）不需要表头行：选项即数据，点选中的选项名进确认层；多字段层级（规格/单位）选中后下方出单行编辑表格（表头行+一行：各字段+默认/删除操作列）。记录数变多字段化时自动升级，同一套切换行组件
            - - 增删改全部进确认层/编辑行
              - 删除不独立出现在切换行上：有编辑行的（规格/单位）删除在编辑行操作列；单字段层（品牌）删除在确认层内。确认层承载全部增删改，基础切换行只显示数据
            - - 第一层（主实体信息）
              - 信息行（分类/名称/俗称等单值格），不是矩阵
            - - 中间层（下挂多个子记录且非叶子）
              - 切换 + 下挂数据展示：记录少用横向切换条、记录多用纵向矩阵行。凡中间层必须让人第一次用就看清「谁挂在谁下面」——标签承载结构化数据（名称走确认层格），不是纯按钮。新增走末尾空位（确认层），不是独立弹窗
            - - 切换与格内编辑的点击分离（两段式）
              - 未选中的标签整体=纯切换（名称纯文本，点任意处切换）；选中后名称格才走确认层（点值改名）。样式布局与单元格样式不因交互变化。两种交互都符合习惯但点击目标冲突时按重要程度取舍：值确认优先（全站统一范式），切换改用独立通道（点标签/两段式）。确认层的 allowNoChange 能力可承载「确认即切换」变体，按场景选用
            - - 子集区块必须显示父级路径（面包屑）
              - 下层矩阵（单位/价格等）是「当前选中父级」的子集——区块标题必须显示父级路径（品牌 X → 规格 Y → 单位与价格），切换父级时路径跟着变。禁止平级独立区块不标注归属——挂载关系一眼可见才叫「看清谁挂在谁下面」
            - - 父实体切换（多对一引用，切上下文）
              - 横向切换条，不是表格行（产品编辑弹窗的品牌标签）
            - - 挂载子表（一对多，行=一条记录）
              - 多记录矩阵：表格行 + 确认层单元格 + 空行晋升（供应商联系/地址、产品规格同款）
            - - 子表的行级数（挂叶子行上的值）
              - 行内确认层格（换算率等），点值确认，不弹新矩阵
            - - 跨记录数（一条数=多键组合）
              - 展开/弹层面板，不占主行格子（售价/进价明细浮层）
            - - 全局字典（A 类名单）
              - 字典检索+快建+管理面板，不做矩阵行
        - kicker: 落地形态 · 第二层：特征分支
          navLabel: ⑤形态·分支
          title: 决定形态的不止层级和表类型——特征维度定差异，差异是配置不是新组件
          lead: 只按层级+表类型定形态会限死：同样的挂载子表，单位有默认语义、规格有依赖顺序、售价是多键组合、联系信息空行直接追加。这些差异全部在同一组件里用参数注入，禁止为差异另写一个组件。
          colA: 特征维度
          colB: 分支 · 怎么注入
          rows:
            - - 记录基数（1 条 vs N 条）
              - 单值格 vs 多记录矩阵——同一组件，记录数不同，不是两个组件
            - - 主记录语义（要有「默认」且互斥）
              - 默认列开关——有默认语义才开，没有就关
            - - 依赖顺序（前置键）
              - 门禁提示：视觉不变，点击提示「请先 X」，不默默不可点
            - - 来源类型（字典引用 vs 直接值）
              - 带检索与快建 vs 纯输入——按来源类型配，不按功能新写
            - - 常用值频度
              - 快捷选项条——高频值做预置，不每次从头输
            - - 维度数（单键 vs 多键组合）
              - 行内格 vs 展开面板——一条数是几个键的组合决定放不放得进行里
            - - 只读 / 可变
              - 只读呈现 vs 确认层——看数与定档冻结，跟可编辑区分
            - - 空行交互（按钮新增 vs 直接输入追加）
              - 按「新增要不要确认成本」选——高频录入直接追加，低频确认后新增
        - kicker: 第四步 · 对照槽位
          navLabel: ⑧插槽
          title: 先查同类再动手：共性插槽，差异登记，新槽写回
          lead: 这一步是杜绝「刚改好 A 选品、发现 B 选品又不对」的落点。查了才能动，没查就动手=各改各的。
          colA: 对照结果
          colB: 怎么落 · 禁止什么
          rows:
            - - 与已有槽位同构
              - 只填一份关系图参数进槽，五面自动产出（表格UI/检索/字典快建/确认策略/场景截断）。禁止视图手写第二套列、第二套确认。
            - - 部分同构
              - 骨架走槽，差异以 override 合并（渲染/编辑器/slot 占位），差异必须登记在案。禁止为一点差异整页重写。
            - - 确认策略选档
              - 按图的写入口自动选：幂等单字段=直接建即选；多字段带缺省=二次确认；改全局/删除=确认+列出影响范围。禁止各处自写确认弹窗。
            - - 查无同类
              - 先跟现场确认真无同类；确认后按本方法建新槽，并把新槽登记写回文档——下个功能才有得查。
        - kicker: 第五步 · 变更回图
          navLabel: ⑨变更回图
          title: 表会一直变；变也走同一条流水线，只是入口换到图上
          lead: 项目演进不出格的保证：变更不改代码入口，只改图和登记表，推导自动重跑。
          colA: 变更类型
          colB: 走法 · 硬边界
          rows:
            - - 加字段
              - 先定挂哪个框哪一层 → 改登记表 → 五面自动跟。快照层新字段只对新落单生效，旧单不回改。
            - - 加实体/加关系
              - 先画进关系图 → 重推集合体和分层 → 查槽位；真无同类才建新槽并写回文档。
            - - 分层的变更
              - 如名单升级成带子表的档案：先列波及清单（引用计数）再动，存量数据迁移单独写进变更说明。
            - - 删/停用
              - 先查引用计数：被引用只能停用；删除走确认第三档，列出影响范围。
            - - 统计口径变
              - 统计基于 ID；口径变更不改历史快照，另起衍生层承载新口径。
      rulesKicker: 不管怎么实现
      rulesTitle: 带表的功能最终都要达到
      rules:
        - - 先升维再动手
          - 没说出「这属于哪一类问题」就动手=没升维。归类到类型、查该类通用最优、定位现状版本（雏形/低配/误用/正确），三步走完才决定方案。更优解靠升维，不靠用户提醒——这是这一系列事故的共同根因。
        - - 图先行
          - 带表的功能先有关系图后有表、有代码。图没有，动手写出来的就是各立各的。
        - - 集合体和层是推论
          - 归类和分层从关系图形态推出，不由实现顺手定。两个功能图同构，集合体、分层、槽位必须同构。
        - - 一处真相源
          - 字段/关系/列序/确认只在登记表声明一次，五个面自动产出。出现第二套手写列、第二套确认即违规。
        - - 交互范式同源
          - 可编辑单元格一律确认层（点值→确认→应用），禁止常驻输入框；空行新增走确认层空行槽。改表格先逐格对照同场景成熟实现——骨架和单元格交互都要比对，只对骨架=没查同类。
        - - 空行必反馈
          - 空行确认=无条件晋升为记录行并自动补新空行。禁止确认层能开、确认后被前置守卫静默丢弃——点了没反应即违规。
        - - 门禁用提示不用静默
          - 前置未满足的格子保持正常视觉（hover/分割线/行高与可编辑格一致），点击提示「请先填写 X」。禁止默默不可点或置灰——视觉不一致=又一处各写各的。
        - - 形态推导两层
          - 共性层（关系图层级+表类型）定大类形态，是必经；特征层（记录基数/主记录/依赖顺序/来源类型/维度数/只读/空行交互）定差异配置。差异是参数注入，不是新组件。
        - - 依赖顺序也是抽象
          - 同表字段（备注依赖规格名）与跨表（售价依赖单位）的依赖顺序，统一抽成「前置键→门禁原因」，行为交付统一，不靠各处分情况写。
        - - 相似功能自动对齐
          - 改任何带表功能前先查同类槽位，改公共不改单点。刚改好 A 发现 B 又不对=没走本方法。
        - - 快照与标注分离
          - 单据行只快照，进展和补充走标注层。两者混在一张表即违规。
        - - 演进不改历史
          - 新字段、新口径只对新数据生效；统计基于 ID；存量迁移单独写。历史快照永远不回改。
      ruleBlocks:
        - kicker: AI 接到表功能怎么用这一页
          title: 第 0 步先认领，先交图，确认后才落地
          lead: 用户不用自己抽象，也不用把每条细节讲清。AI 按流水线反着摆给用户确认。
          rules:
            - - 第 0 步先认领
              - 识别到表功能（存数据/列清单/挂关系/留痕迹），先声明走本流水线，再开始。没声明就画页面=跳步。
            - - 先交图再交码
              - 把关系图（实体+字段+关系+场景）摆给用户确认。图没确认，不建表、不写组件。
            - - 图确认后自动推
              - 按图推集合体、分层、槽位对照，把推导结果和差异点一起摆给用户看，用户只做确认题。
            - - 落地只准插槽
              - 共性走槽五面产出，差异 override 并登记。落完自检：有没有第二套手写列？有没有绕过登记表的改动？
            - - 变更回图
              - 日后任何表变更先改图/登记表，让推导和五面自动跟。直接改某处代码=绕过方法，退回重走。
        - kicker: 和另外三页的关系
          title: 方法论链条：写法 → 循环 → 流水线 → 本项目落地
          lead: 四页各管一段，不要混用，也不要互相替代。
          rules:
            - - 对话 → 指导思想（上游）
              - 表功能还没识别时走它：对话先进去，切活、写指导思想。本页的前提（要支持到哪）从那里来。
            - - 接到需求先归类（循环）
              - 接到任意功能需求先跑它的六步循环：收集→打包→归类→共性差异→摆给用户→落地。本页把其中「归类到落地」展开成流水线。
            - - 本页（流水线）
              - 把已识别的表功能从关系图推到槽位：画图→集合体→分层→插槽→变更回图。
            - - 实体关系槽位模型（落地）
              - 本项目的槽位技术形态：登记表 + 推导引擎，一进五出。方法论在这里变成代码。（具体组件见执行卡资产清单）
    card:
      trigger: 识别到表功能（要存数据/列清单/挂关系/留痕迹）
      do:
        - 先升维再动手：归类到类型 → 查该类通用最优 → 定位现状版本（雏形/低配/误用/正确）
        - 画关系图（实体+字段+关系+场景），图没确认不建表不写组件
        - 按图推集合体与分层；集合体、分层是推论，不由实现顺手定
        - 共性插槽自动产出五面，差异 override 登记；禁止视图手写第二套列
        - 变更回图：任何表变更先改图/登记表，快照层新字段只对新落单生效
      selfCheck: 有没有关系图？集合体和分层是不是从图推出的？有没有第二套手写列/第二套确认？
  - id: why-scope
    layer: L1
    navId: why-scope
    kind: scope
    nav:
      title: 本章定位
      subtitle: 这家店的行业根基
    page:
      kind: scope
      kicker: 本章定位
      title: 先看门店怎么干活，再设计系统
      lead: 本章是这家店的指导思想：指导开发、解释已经做出来的行为。作业按一类活切；对象、过程、角色、看数、工具习惯也写在本章。写法在侧栏「方法论库 · 对话 → 指导思想」，那一页可带到任何项目。不要把本章的开单/配货目录带到没有这些活的现场去。
      factsKicker: 各环共用的行业根基
      factsTitle: 为什么很多门店还在用手写开单
      factsLead: 行业里不是没有软件。很多店不用，是因为现成系统跟不上嘴。纸笔快、活、残缺也能先记下。本系统达不到手写那么快，但必须贴近这个节奏：系统适配人，不让人适配表。
      facts:
        - label: 货极多、SKU 极多
          note: 品类广、牌子多、规格变体多，新品一直来。不可能提前把全部货建齐；大量是调货，店里并不常备。
        - label: 散客、时间极短
          note: 到店询价选型。答慢、步骤繁，显得不专业，人就走了。当时不知道还会不会回头，常常来不及记人档。
        - label: 店里经常残缺
          note: 档案不全、进价滞后、这款没卖过、店里没货、店员自己也不一定懂。这是常态。
        - label: 双方信息经常糊
          note: 客户说不清参数；店里没现货、店员也不熟。先记下听到的，再打电话问可能供的人。
        - label: 手写仍然更快
          note: 知道多少写多少，不凑齐字段也能开单。禁止比纸笔多一次打断。
        - label: 买过会退
          note: 水电这类常买多用剩。散客和建档的人都会拿剩货来退。退的是本店当时卖出的那一笔，不是名册上的标准价。
      rulesKicker: 怎么用本章
      rulesTitle: 业务驱动系统，不要用实现反推业务
      rules:
        - - 阅读顺序
          - 定位 → 五类活 → 货和人怎么存在 → 单怎么过手、谁在用、事后看什么 → 人习惯怎么干 → 公共能力 → 总纲领。写法见「方法论库 · 对话 → 指导思想」。
        - - 本项目的一类活
          - 销售开单、配货履约、进货管货、收付款往来、售后。这是这家门店切出来的，不是通用目录。
        - - 作业之外必须写
          - 货和人怎么存在、单怎么过手、谁在用、事后看什么、人习惯怎么干。缺一条，实现就没有源头。
        - - 每环怎么写
          - 四块写法和效果精度见「方法论库 · 对话 → 指导思想」。本章只填这家店的现场和效果，写到能约束实现。
        - - 公共能力从业务来
          - 几类活碰到同一类现实问题才抽成一套。不是为了少写代码。
        - - 本章解释到哪
          - 解释系统为什么这样实现。表名、组件名仍不写。效果句必须硬到：两种写法只有一种符合。
        - - 两个文档体系
          - 人看本章对齐开发。用户项目开发文档是旧基线，给 AI 读，同一轮跟上，不能落后。先改可视化，再改用户文档。可视化还没写到的才去那里。两边打架以本章为准。
    card: {}
  - id: why-sales
    layer: L1
    navId: why-sales
    kind: link
    nav:
      title: 销售开单
      subtitle: 柜台边问边写 · 没货打电话
    page:
      kind: link
      kicker: 销售开单
      title: 柜台前那几十秒：说到哪写到哪，用这行字去探、去打电话
      lead: 客户站着等一句报价。店员一边听一边写。系统达不到纸笔那么活，但必须跟得上嘴：一格收整段话；用这行字去认货、比牌子、对标准、找人问；对不上货档也能先开单。问到名字或电话就写在单上，不必为此建人档；什么都没有也先开。
      what:
        kicker: 这一类活在门店是什么
        title: 边问边写、当场报价、没货就打电话
        lead: 行业共性见本章定位。本环只写柜台这一段。
        facts:
          - label: 信息是问出来的
            note: 客户不懂，店员也不一定懂。不是开单前字段就已经齐。
          - label: 一行字跟着对话往下补
            note: 品名、牌子、口径、国标、口头别名挤在同一行，是正常经营。
          - label: 店里经常没这款
            note: 下一件事是打电话问谁可能有，不是先建货档再开单。
          - label: 这个人可以不建档
            note: 当时不知道还会不会回头；时间紧来不及记人档。问到名字或电话就写在单上。建档是给以后还要找这个人、以及按这个人看数。
      dialogue:
        kicker: 线下怎么干
        title: 客户什么都不懂 · 店里没货 · 店员自己也不熟
        lead: 精装水电，业主自己来买。客服/师傅给的信息也是糊的。
        turns:
          - who: 业主
            text: 师傅让我来买水管，说是热的，装热水器用的。
          - who: 店员
            text: PPR 的是吧？粗细知道吗？
          - who: 业主
            text: 不知道，他说买 25 的，绿的那种。
            line: 热水管 25 绿
          - who: 业主
            text: 还说要国标的，别买杂牌。
            line: 热水管 25 绿 国标
          - who: 业主
            text: 伟星行不行？工地隔壁用的好像是伟星。
            line: 热水管 25 绿 国标 伟星
          - who: 店员
            text: 店里这款没有，我自己也不熟。下一件事是打电话问谁可能有。
            line: 热水管 25 绿 国标 伟星
        after: 客户还站着等报价。店员不会先把对话翻译成四个格子。他想的是：把听到的记下；用这些糊信息去碰这是什么货、有哪些牌子、国标对哪条；店里没有就打电话问谁可能有、什么价、多久能到；问到了再报价；客户点头，这单要先开出去——哪怕还没有这条档案。痛点就在这里：拆成多框会跟不上嘴；找不到档案若不能开单，人就走了；进价记不全时，要能圈出该给谁打电话。
      effectsLead: 每一项都是这场对话掉下来的。不是先做检索再找理由。
      effects:
        - - 说到哪写到哪，信息残缺也要先记下
          - 开单只有一格收整段话。切看法不改、不裁这行字。知道多少写多少。
        - - 客户糊、店员也不熟，只能靠嘴里几个字去撞
          - 用这一行去认货、比牌子、对型号、对标准。字在名称里算碰上，名称在字里也算碰上。吃碎片、俗称、混写、顺序乱。更像完整说法的排前面，碎片也能中。不要求一次说全、不要求格式规整，不要按词把有效结果禁掉。
        - - 店里没货、自己不熟，下一动作是打电话
          - 从这一行字列出谁可能供：做过价的，以及宣称做这类货/这个牌子的。留得住电话。没进价不等于不供。认货写入的是货，不是把渠道名当成商品。仓还是渠道出货是履约的活。
        - - 档案没有这条，客户还在等
          - 对不上也先落成一行原文。没有档案关联也能先保存。事后再认、再补档。找不到档案不是错误，阻断开单才是错误。
        - - 货太多，平时要把层拆开存
          - 俗称跟产品走，规格挂在牌子下，标准跟这一条规格走。录入不拆、存储要拆，是为了让这一行糊字能打到各层。开单现场绝不先把档案填齐再卖。层怎么存在，见「货和人怎么存在」。
        - - 对上了、客户要了
          - 把当时的名称、牌子、规格、价抄到单上。后来只改数量、单价、备注，名称仍是当时抄的，不要去档案里刷成现名。只有重新认货，才整份换成当时档案上的字。只换单位，只换单位名。
        - - 整句口语拿去建档会叠垃圾
          - 线索可以混在一行里；落档必须分开认。不能把整句直接当产品名。
        - - 插在哪一行下面
          - 新行插在当前这条下面，不要甩到表尾。人是顺着单据往下写的。
        - - 这个人是谁，常常来不及建档
          - 问到名字或电话就写在单上，不必为此建人档。什么都没有也先开。禁止没有客户档案就不让开单。
        - - 什么时候才建人档
          - 以后还要找这个人：回头、赊账、多个地址、按这个人看他买了多少。散客群进不了按人统计，但不挡开单、不挡以后退货。
      looksHead:
        kicker: 对话焦点变了，还是同一行字
        title: 五种看法不是五个输入框
        lead: 一级级点开是对的，但慢。换看法只换「现在现场在问哪一层」，字还在格子里。
      looks:
        - label: 认货
          why: 先把货认出来。牌子收在一起，避免一上来摊开所有规格。
        - label: 比牌子
          why: 客户要比牌子、比性价比。
        - label: 对型号
          why: 已经知道型号，或话里带着规格字。
        - label: 对标准
          why: 国标 / 企标 / 标准号跟这一条规格走。
        - label: 找人问
          why: 列出谁可能供。做过的价常滞后；宣称做这类的也要出现，好打电话。
      sharedUses:
        - - 一段字去探
          - 开单、客户格、履约里找来源，都是残缺口语去撞已经分层的档案。
        - - 当时抄死
          - 认过的名称、价抄在单上，档案再改也不改历史。
        - - 边做边补档
          - SKU 太多，不可能预先建齐。用的过程中补；整句口语不能当产品名。
        - - 改这一条还是改一类
          - 补档、改价时要分清只动眼前这条，还是动一整类；动一类先看会波及谁。
      rulesKicker: 本环取舍
      rulesTitle: 贴近手写，不取代手写
      rulesLead: 达不到纸笔那么快。禁止比纸笔多一次打断。
      rules:
        - - 禁止
          - 开单拆成多个输入框、切看法清字、要求格式规整、对不上就不让保存、把整串口语当产品名建档、按词把有效结果禁掉、把渠道名单当成商品名来搜、没有客户档案就不让开单、造一份假的临时客户去凑名单。
        - - 开单和管理不是同一套填法
          - 开单混写；档案平时分列维护。匹配规则要同一套，填法不要合成一个框。管理页筛档案、开单格探货，是两套框。
        - - 找人问是看法，逛名册是只读
          - 开单切到找人问：用这一行字列出谁可能供，插入仍是货。另有一处只读逛「谁还可能供」，不占开单这一格、不改插入。
    card: {}
  - id: why-fulfill
    layer: L1
    navId: why-fulfill
    kind: link
    nav:
      title: 配货履约
      subtitle: 找货 · 三种成本 · 欠库
    page:
      kind: link
      kicker: 配货履约
      title: 货怎么到客户手里：店里有从哪出，没有走刚问到的渠道
      lead: 开完单下一类活是找货、调货、送出。店里有和店里没有，不是同一份名单。进价滞后、这笔赚没赚，痛点写在这一环。货进店、点进仓是另一摊活，见「进货管货」。
      what:
        kicker: 这一类活在门店是什么
        title: 找货、调货、送到记下的地址
        facts:
          - label: 店里有
            note: 从哪一仓、哪一区位出。
          - label: 店里没有
            note: 走开单时打电话问到的那家渠道，或者再问别家。
          - label: 不够就欠着
            note: 先把能出的出了，缺口回来再补。
          - label: 送到哪
            note: 用开单时抄下的地址，不靠事后去档案里猜。
      dialogue:
        kicker: 线下怎么干
        title: 有货出仓，没货调货，按当时地址送
        lead: 承接开单那场对话：伟星 25 热水管国标，店里没有。
        turns:
          - who: 店员
            text: 仓里这款有没有？
          - who: 仓
            text: 没有。
          - who: 店员
            text: 华南管业刚说有，今天下午能到。从他们走，送到开单时记下的工地。
          - who: 仓
            text: 若下午只到一半，先送能送的，剩下欠着，货到再补。
        after: 痛点：把内部仓和外部渠道写成一份名单，出货会乱；开单时的地址若当时不抄，送货就对不上；调来的价是问来的，过两天档案上的进价可能已经变了，核算不能拿现在的价去改当时那笔；仓里不够若不当场记下欠着，回来就对不上；外面多调的若算进这笔订单成本，毛利会假。
      effectsLead: 履约是开单的下一棒，不是另一套选品。
      effects:
        - - 店里有还是没有，是两种出法
          - 内部仓和外部渠道分开。有货从仓出，没货从渠道走。
        - - 送到哪是开单时问清楚的
          - 地址当时抄在单上。档案里后来改的地址，不自动改已经在走的单。
        - - 货不够
          - 能出的先出。内部仓出不够，系统当场记下欠着；货进仓时冲掉欠。不能假装已经出齐。
        - - 仓里出的这笔成本
          - 按仓里当时的均价算，不拿今天档案进价去改。
        - - 外面调刚好够这笔单的
          - 当时问到的进价算进这笔订单成本。
        - - 外面多调的
          - 不算这笔订单成本。货进库存，归进货那一摊去点进仓。
      sharedUses:
        - - 一段字去探
          - 履约里找仓、找渠道，和开单一样是对着已经分层的名单去认，不是另做一套搜索习惯。
        - - 当时抄死
          - 出货来源、地址、进价按当时抄的走。
        - - 边做边补档
          - 调货问清楚了，可以补进价、补渠道，不挡先出货。
    card: {}
  - id: why-money
    layer: L1
    navId: why-money
    kind: link
    nav:
      title: 收付款往来
      subtitle: 跟客户收 · 跟供应商付
    page:
      kind: link
      kicker: 收付款往来
      title: 对着当时那张单：跟客户收，跟供应商付
      lead: 钱是跟「当时说定的那笔」走的。档案后来改价，不能改已经收过、付过、对过的数。定金可能开单时就收，目录不要求先履约再收款。
      what:
        kicker: 这一类活在门店是什么
        title: 客户往来和供应商往来
        facts:
          - label: 跟客户收
            note: 按当时报价收定金、收尾款、对账。
          - label: 跟供应商付
            note: 调货、进货按当时谈的价付，不是按今天档案上的价。
          - label: 对的是那张单
            note: 单上的名称、数量、价是当时抄的，对账不能漂。
      dialogue:
        kicker: 线下怎么干
        title: 按当时说定的数收和付
        turns:
          - who: 店员
            text: 这单按刚才报的价收。定金可以先收。
          - who: 客户
            text: 货到了再结尾款。
          - who: 店员
            text: 华南那笔按电话里问到的进价付，不要过两天又去翻现在的牌价。
        after: 痛点：若收款、付款跟着档案现价跑，对账会对不上当时跟客户、跟供应商说的话。往来必须钉在当时那张单上。
      effects:
        - - 收的是当时报给客户的价
          - 往来对着单上当时抄下的金额。档案改价不改已收、已对的数。
        - - 付给供应商的是当时问到的价
          - 应付钉在当时进的那笔货、当时谈的价上，不拿后来的档案进价去改。
        - - 定金和尾款会拆开收
          - 允许开单当时就收一笔，货到再收。不强迫先配完货才能记收款。
      sharedUses:
        - - 当时抄死
          - 往来的唯一依据是单上当时的数。
        - - 改这一条还是改一类
          - 改点位、改牌价是档案的活；已经收过付过的单不跟着整批改价走。
    card: {}
  - id: why-after
    layer: L1
    navId: why-after
    kind: link
    nav:
      title: 售后
      subtitle: 对着卖掉的行退 · 认全了才能回仓
    page:
      kind: link
      kicker: 售后
      title: 对着柜台上的货去对已经卖掉的行；认全了才能回仓
      lead: 售后是对已经开出去的那些单负责。货退回来顺序是乱的，点到什么对什么。用手边的字去撞已经卖掉的行，对上了才落到那张或那些原单。退的数量不能超过本店当时卖过的；退的价是当时卖给这个人的价，不是名册上的标准价。当时认过是哪条货，才能按货退回仓库。散客和建档的人都会退。
      what:
        kicker: 这一类活在门店是什么
        title: 退、换、把货退回能退的地方
        facts:
          - label: 货堆在柜台上
            note: 点到什么就是什么顺序。不是顺着原单行号一个个翻。
          - label: 可能来自几张单
            note: 同一人一次把好几张单的剩货一起退。也可能一张单。
          - label: 可能在几家买过
            note: 只能退本店当时确实卖掉的数量。
          - label: 卖价很活
            note: 低于标准价、高于标准价都是常事。这个人一个价，那个人另一个价。退按当时卖掉的价。
          - label: 认过货的
            note: 可以按当时那条货回仓或跟渠道退。
          - label: 只记下口述的
            note: 单还在，钱可以退，但不能假装仓库里多出一条标准货。
      dialogue:
        kicker: 线下怎么干
        title: 剩货退回来，顺序是乱的
        turns:
          - who: 客户
            text: 上次买的水管剩了，要退。可能不止一张单。
          - who: 店员
            text: 先看手里这根是什么。对着已经卖掉的去对，对上了才落到原单。
          - who: 店员
            text: 他可能别处也买过，只能退咱们店当时卖过的数量。价按当时卖给他的，不翻现在的牌价。
          - who: 店员
            text: 当时对上档案的，退回仓库。当时只写了「热水管 25 绿」没对上的，钱可以退，货不能当库存收。
        after: 痛点：若必须先翻出原单再顺着行号找，柜台上的货一乱就找不动；若一次只能退一张单，几张单的剩货要拆好几趟；若按名册现价退，当时谈的活价就假了；若不问本店卖过没有，别人家买的也会被退进来。还要分开：钱和单可以退，库存只能退认过的货。散客没建档，一样会退，不能挡。
      effectsLead: 每一项都是退货现场掉下来的。不是先打开一张已知的单再设计。
      effects:
        - - 柜台上的货顺序是乱的
          - 单据检索和已卖行检索是两个独立格子，不要塞进同一个框。先对单据（宽松打头上所有字，或切精准）。点格进确认层；空词按当前日窗口翻清单（默认当天，上一天下一天、上月下月，也可以点日期跳），一次不要灌很多。退货周期可能隔半年、一年，必须能翻到当时那张单，禁止只列出当天。打字检索不锁日期。行上能预览确认是不是这张。勾上的单当数据源。再对着这些单里已经卖掉的行打名称。对上了才落到那张或那些原单。顺序跟柜台上的货走，不跟原单行号走。禁止必须先打开一张已知的单再顺着行号找。
        - - 一次可能退好几张单
          - 这一趟可以对上多张当时的单。每一件仍钉在它当时那一行。禁止逼人先做完第一张再打开第二张。
        - - 他可能在几家买过
          - 只能退本店当时确实卖掉的数量。没对上已经卖掉的行，不能按嘴里说的数量退。
        - - 卖价很活，这个人一个价
          - 退的价是当时卖给这个人、写在那一行上的价。不是名册现在的标准价。档案改价不改已卖掉的那行。
        - - 散客也会退
          - 水电常买多用剩。没建档的和建档的都能退。开单时没记人档，不挡这一趟售后。
        - - 退的是当时那一行
          - 名称按当时抄的。档案改名不改已卖出的那行。
        - - 认过货才能回仓
          - 规格、牌子、单位都认上了才能加库存。缺一样：钱可以退，不能当标准库存收。
        - - 钱可以退，货不一定能入仓
          - 只写下口述、没认成货的行，不阻断退款，只阻断按货回库。
      sharedUses:
        - - 当时抄死
          - 售后只认单上当时的内容：当时的名称、当时卖掉的数量、当时卖给这个人的价。
        - - 一段字去探
          - 对着已经卖掉的行去认，和开单同一套探法。撞的是当时抄在单上的字，不是现在的货名册。
      rulesKicker: 本环取舍
      rulesTitle: 对原数据退，不是对名册退
      rulesLead: 数量锁本店卖过的；价锁当时卖给这个人的。
      rules:
        - - 禁止
          - 必须先打开一张已知的单再顺着行号找；一次只许退一张单；按名册现在的价退；没对上本店卖掉的行就按嘴里说的数量退；散客不许退；造一份假的临时客户才准退。
    card: {}
  - id: why-shared
    layer: L1
    navId: why-shared
    kind: shared
    nav:
      title: 公共能力
      subtitle: 几类活碰到同一类问题才抽
    page:
      kind: shared
      kicker: 公共能力
      title: 几类活碰到同一类现实问题，才抽成一套
      lead: 不是为了少写代码。开单、履约、往来、售后里，只要现场动作是同一类，能力就必须是同一套。细则在这一页收束；各环正文只点名。
      caps:
        - title: 一段字去探
          usedIn: 开单 · 客户是谁 · 履约找来源 · 售后对已经卖掉的行
          why: 现场都是残缺口语去撞已经落下的字。开单撞货档，售后撞已经卖掉的行。所以是同一个探法：一格跟着嘴走，换看法不改这行字。字在名称里算碰上，名称在字里也算碰上。更像完整说法的排前面，碎片也能中。售后撞的是当时抄在单上的字，不是现在的货名册。开单混写、档案分列维护，是同一能力的两端，不要做成两套互不相认的搜索。
          rules:
            - - 同源
              - 不是四个长得像的框，是同一类活。
            - - 禁止
              - 开单一格、档案又做成四个必填框；履约来源另发明一套搜索习惯；售后必须先打开一张已知的单再顺着行号找；按词把有效结果禁掉。
        - title: 当时抄死
          usedIn: 开单 · 履约 · 往来 · 售后 · 结清
          why: 单是跟客户、跟供应商说过的话。档案改名改价，已经开出去、收过、付过、送过、退过的不能跟着变。改数量、单价、备注，单上的名称仍是当时抄的，不要去档案里刷成现名。只有重新认货，才整份换成当时档案上的字。只换单位，只换单位名。卖价很活：这个人一个价、那个人另一个价，低于或高于名册标准价都是常事。退货按当时卖给这个人、写在那一行上的价，不按名册现在的价。
          rules:
            - - 结清以后
              - 这笔只读。定档不是一类柜台活，是这条能力的终点。
            - - 禁止
              - 改数量时把名称刷成档案现在的名字。退货按名册现在的价算。
        - title: 边做边补档
          usedIn: 开单 · 履约 · 人档
          why: SKU 太多，不可能预先建齐。人当时也不知道还会不会回头，来不及就先开单。用的过程中补名称、价、渠道、人档。线索可以混；落档必须分开认，整句口语不能当产品名。
          rules:
            - - 找不到也先做业务
              - 补档是后一步，不挡开单、不挡出货、不挡退货。没有人档也可以退。
        - title: 改这一条还是改一类
          usedIn: 补档 · 改价 · 改点位
          why: 眼前这条和整类货不是一回事。确认改眼前这条：只这条规格例外。改一类：这个牌子加这类货一起改，已经单独改过的不跟着糊过去。已经开出去的单仍走「当时抄死」。
          rules:
            - - 禁止
              - 改一个牌子的点位，把水管和电线一起改掉。
            - - 禁止
              - 改一类时把已经单独谈过的例外一并盖掉。
    card: {}
  - id: why-canon
    layer: L1
    navId: why-canon
    kind: canon
    nav:
      title: 总纲领
      subtitle: 方案两难时对照这里
    page:
      kind: canon
      kicker: 总纲领
      title: 方案两难时对照这里，不要对照按钮长什么样
      lead: 从五类活、对象、过程、角色、看数、工具习惯和公共能力收束。技术手段可以换，业务要达成的效果不能偏。新功能先问属于哪一条线、那一环线下怎么处理。
      rules:
        - - 系统适配人
          - 贴近手写：残缺也能先记下，跟得上嘴。不让人先填齐表再干活。
        - - 一段字是线索
          - 混在一行里是正常经营。换看法不改这行字。字在名称里或名称在字里都算碰上。找不到档案不能停业务。
        - - 没货就找人问
          - 列出可能供的渠道，留得住电话。进价滞后不等于不供。出货时仓和渠道不是一份名单。
        - - 当时抄死
          - 名称、价、地址、往来按当时单上的走。改数量不刷名称。档案变更不改历史。结清只读。退货按当时卖给这个人的价，不按名册现价。
        - - 三种出法三种成本
          - 仓出按当时均价；外面刚好够这笔的算进订单成本；外面多调的不算订单成本、货进库存。
        - - 开单不必建人档
          - 问到名字或电话就写在单上。什么都没有也先开。建档是给以后还要找这个人、以及按人看数。散客一样能退。
        - - 售后对着卖掉的行
          - 柜台上的货顺序是乱的。对着已经卖掉的行去对，对上了才落到那张或那些原单。只能退本店当时卖过的数量。
        - - 几类活同一类问题，能力必须同一套
          - 抽公共能力是因为逻辑本该一致。
        - - 取舍顺序
          - 历史不能错 > 柜台不能卡 > 影响不扩散。新功能先归到一类活，或归到对象/过程/角色/看数/工具习惯，再设计。
    card: {}
  - id: why-inbound
    layer: L1
    navId: why-inbound
    kind: link
    nav:
      title: 进货管货
      subtitle: 点进仓 · 待入 · 看库存
    page:
      kind: link
      kicker: 进货管货
      title: 货进店：点进哪一仓，仓里还有多少，多调的先进库存
      lead: 配货是给客户那张单凑货。进货是店里自己收货、点仓、看库存。两摊活。外面多调回来的货进库存，不拿去充这笔客户单的成本。
      what:
        kicker: 这一类活在门店是什么
        title: 收货、点进仓、看还剩多少
        facts:
          - label: 货到了
            note: 要点进某一仓，库存跟着变。
          - label: 还没到
            note: 已经答应进、还没点进仓的，要能看见、能确认进仓。
          - label: 仓里还有多少
            note: 按仓、按货能问现在有多少，不是单上写了多少。
          - label: 多调的
            note: 进库存。不算客户那笔订单成本。成本口径在履约。
      dialogue:
        kicker: 线下怎么干
        title: 货到了点数，放哪仓，多调的进库存
        lead: 承接履约：外面多调了几箱。
        turns:
          - who: 店员
            text: 华南那车到了，点进南仓。
          - who: 仓
            text: 客户那单只要一半，多的几箱进库存。
          - who: 店员
            text: 还没到的记着待入，到了再点。仓里现在有多少，下一单要能问到。
        after: 痛点：若进货和配货写成一摊，多调的会被算进客户那笔成本；若货到了没有「点进哪一仓」，库存是假的；若还没到的不记，人会忘。
      effectsLead: 进货是店里收货这一摊，不是配货的附录。
      effects:
        - - 货到了要点进仓
          - 能收进某一仓，库存跟着变。
        - - 还没到的记着
          - 待入的货能看见、能确认进仓。
        - - 仓里还有多少
          - 按仓、按货能看见现在有多少。
        - - 多调的
          - 进库存。不算这笔客户单的成本。口径见履约。
      sharedUses:
        - - 当时抄死
          - 进货按当时点进仓的货和价走。
        - - 边做边补档
          - 货到了可以补进价、补渠道，不挡先收进仓。
