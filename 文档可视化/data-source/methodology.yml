  - id: sys-role
    layer: L1
    navId: sys-role
    index:
      hear: "角色权限、配谁能看谁能改、三档矩阵"
    nav:
      title: 角色权限
      subtitle: 触发：配谁能看谁能改 · 三档矩阵 · 系统角色不可删
    page:
      kicker: 系统管理 · 权限
      title: 权限挂在角色上不挂在人上：改权限改角色，不挨个人改
      lead: 表归属：**系统配置**（roles + user_roles）。注意它和别的页不同——user_roles 到 users 的删除行为是 cascade（配置子表跟随员工档案），不是业务记录那种 decouple 解耦留快照。判断依据就一句话：员工档案没了，他绑的角色关系本来就没意义，所以该跟着删；而审计日志不一样，员工删了日志还得读得出是谁干的。这一页是系统管理里唯一的 cascade 例子，别拿别的页的惯例往这套。
      factsKicker: 这一页定什么
      factsTitle: 三档矩阵、系统角色保护、两种无权限提示
      factsLead: 权限最容易出的乱子是「同一个人这里能改那里不能改」，根因是权限挂在了多处。这里只挂一处。
      facts:
        - label: 三档矩阵
          note: '角色存 view_permissions（JSON）：每个视图叶子三档 none / ro / rw。none 的语义按代码实证口径＝入口仍显示、点击给「无权限」提示并跳 no-permission、后端拒绝写——不是不可见（藏按钮让用户以为功能丢了、无法申请权限）。多角色并集取 rw>ro>none。人绑角色，继承矩阵。'
        - label: 系统角色保护
          note: 'is_system 为真的角色禁止删除——删了可能没人能进系统。展示名与说明可改，编码不可改（代码判断认编码不认名字）。'
        - label: 有绑定不许删
          note: '自定义角色若仍有人绑定，禁止删除。先改人再删角色，避免留下无权限的孤儿账号。'
        - label: 提示区分两种
          note: '有只读却点写 → 提示「只能查看」；完全没这个叶子 → 提示「暂不能使用」。不笼统报无权限，让人知道差在哪一档。'
      tables:
        - kicker: 权限怎么生效
          navLabel: 生效
          title: 从角色到接口，四层各做一件事
          lead: 每一层只做一件事，不跨层兜底——跨层兜底就是权限散落的开始。
          colA: 层
          colB: 做什么
          rows:
            - - 人 → 角色
              - 用户绑定角色，继承该角色的权限矩阵
            - - 角色 → 矩阵
              - 每个视图叶子一个三档值，落在 roles.view_permissions
            - - 接口 → 声明
              - 路由用 requireViewPermission(叶子, ro/rw) 声明自己要哪一档
            - - 拒绝 → 提示
              - 按缺的是读还是写，给两种不同提示
        - kicker: 本页的关系删除行为
          navLabel: 归属
          title: 先说归属，再说规则
          lead: 系统管理里 5 页的归属各不相同，标清楚才不会互相套错规则。
          colA: 表
          colB: 归属 · 删除行为
          rows:
            - - roles
              - 系统配置 · 系统角色禁删，自定义角色有绑定禁删
            - - user_roles
              - 配置子表 · **cascade 跟随 users**（父没了子无意义）
      rulesKicker: 不管哪一档
      rulesTitle: 权限的执行模式与边界
      rules:
        - - 可见性原则
          - 所有页面与功能按钮对所有账号开放显示（代码实证：StaffLayout 废除可见不可见控制）；无权限点击给统一提示。藏按钮＝用户以为功能丢了。
        - - 三段式执行
          - 前端入口展示（不置灰不禁用）→ 前端点击时按权限集校验提示 → 后端拒绝写（绕过前端直调 API 也必须拒）。前端管体验、后端管底线，缺任何一段＝违规。
        - - ro 可预览即时算价
          - 只读账号可改数预览即时算价（失焦/防抖不落库），主动写才提示「只能查看」。
        - - 权限码数以实测为准
          - 权限码清单以导航注册表/生成物实测为准（现 18 个），禁止在文档手写死数字。
    card: {}
  - id: sys-audit
    layer: L1
    navId: sys-audit
    index:
      hear: "审计日志、谁干了什么、留痕、操作记录"
    nav:
      title: 审计日志
      subtitle: 触发：查谁干了什么 · 留痕优于审批 · 档案删了仍读得出
    page:
      kicker: 系统管理 · 审计
      title: 审计的原则是「留痕优于审批」：不拦业务，但每笔都记，且档案删了还认得出人
      lead: 表归属：**业务记录**（audit_logs）。它对 users / customers 的删除行为是 decouple——不建物理外键，改存名称快照（userName / customerName）。所以员工离职删了档案，历史日志照样显示「张三」而不是一串失效的 ID。这里和角色权限页正好相反：那是 cascade（配置跟随），这是 decouple（记录留痕）。同一个项目里两种取值都有，判据是「档案删了这条记录还该不该读得出来」。
      factsKicker: 这一页定什么
      factsTitle: 记四要素、动作要先登记、按时间索引分页
      factsLead: 审计的价值在事后能查清，所以「记什么」和「怎么查」同样重要。
      facts:
        - label: 留痕四要素
          note: '谁（user_id + userName 快照）、何时（created_at）、对什么资源（resource_type + resource_id）、做了什么（action + detail）。'
        - label: 动作先登记
          note: 'action 必须先登记在 entity-meta.yml 的 auditActions 段；未登记只告警不阻断业务——宁可记了再说，也不因为没登记就丢失痕迹。'
        - label: 快照而非外键
          note: '不建物理外键，靠 userName / customerName 快照读档案。档案删除不影响日志展示，这是 decouple 的直接收益。'
        - label: 规模基线
          note: '按几千万行设计：列表默认按 created_at 倒序 + 索引分页，不做全表扫描。'
      tables:
        - kicker: 边界
          navLabel: 边界
          title: 审计只记录，不拦业务
          lead: 审计是事后凭证，不是事前闸门。要拦业务用操作守卫，不是审计。
          colA: 不做
          colB: 原因 · 该用什么
          rows:
            - - 不拦业务
              - 未登记的 action 只告警不阻断 · 要拦用操作守卫（actions 段）
            - - 不改日志
              - 日志只增不改不删 · 错了补一条，不擦掉旧的
            - - 不依赖档案当前状态
              - 全靠快照 · 档案改了删了都不影响历史
    card: {}
  - id: sys-auth-code
    layer: L1
    navId: sys-auth-code
    index:
      hear: "授权码、客户准入、发码、吊销"
    nav:
      title: 授权码
      subtitle: 触发：客户要进门 · 发码 → 激活 → 过期/吊销
    page:
      kicker: 系统管理 · 准入
      title: 授权码是客户的进门凭证：一次一码，激活即绑定，过期失效
      lead: 表归属：**业务记录**（authorization_codes）。它对 users 的删除行为是 decouple——创建者存 creatorName 快照，员工档案删了码照样显示谁发的。客户端注册要凭码进场，码的生命周期就是客户准入的生命周期：生成 → 发放 → 客户激活 → 到期或吊销。
      factsKicker: 这一页定什么
      factsTitle: 一次一码、激活即绑定、两条终态
      factsLead: 码是凭证不是账号——它只负责把人放进来，进来之后的事归账号管。
      facts:
        - label: 生命周期
          note: '生成（source=manual）→ 发放给客户 → 客户端注册时激活（记 activatedAt）→ 到期（expiresAt）或被吊销（revoke）。'
        - label: 创建者留快照
          note: 'createdBy + creatorName 快照（decouple）· 发码的人离职删档后，仍查得出这码是谁发的。'
        - label: 统计口径
          note: '按状态统计（未激活/已激活/已过期/已吊销），用于看准入转化与存量码健康度。'
      tables:
        - kicker: 与访问申请的关系
          navLabel: 关系
          title: 申请通过后才有码
          lead: 两个页面是前后道工序，不是两准入方式。
          colA: 环节
          colB: 做什么
          rows:
            - - 客户提交申请
              - 留手机号，状态 pending
            - - 审核通过
              - 发码，并定下这个码的有效期
            - - 客户激活
              - 客户端凭码注册，码记 activatedAt
            - - 终态
              - 到期自动失效，或管理员提前吊销
