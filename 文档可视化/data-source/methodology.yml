    nav:
      title: 用户管理
      subtitle: 触发：管员工账号 · 档案本体 · 被别人快照的那方
    page:
      kicker: 系统管理 · 账号
      title: 用户管理管的是员工档案本体：它是被快照引用的那方，不是引用别人的那方
      lead: 表归属：**业务档案本体**（users）。这一页和系统管理其他页的方向正好相反——别的页是「引用档案」（用 decouple 留快照），这一页是**被别人引用的档案**。所以员工档案删了，那些单据、日志、授权码靠名称快照照样读得出「张三」。这个方向感很重要：改动 users 的结构，影响面是外散的，不是内聚的。
      factsKicker: 这一页定什么
      factsTitle: 档案本体、状态机、配置子表跟随
      factsLead: 档案和记录的区别就一句：档案是主体，记录是关于它的事。
      facts:
        - label: 档案字段
          note: '员工编码 user_code、登录名 username、姓名 real_name、手机 phone、状态 status、最后登录时间 last_login_at。密码只存哈希，不存明文、不可读回。'
        - label: 状态机
          note: 'active / 停用。停用后不可登录，但历史记录全部保留——停用不是删除，档案还在，别人引用的快照就还对得上。'
        - label: 配置子表跟随
          note: 'user_roles 是配置子表，删除行为为 cascade（跟随员工档案）。员工删了，角色绑定跟着没——因为父没了子无意义。'
        - label: 被引用是外散的
          note: '单据、付款、成本、配货、审计日志、授权码、访问申请都引用它，且都是 decouple + 名称快照。改档案结构前先看这张引用网。'
      tables:
        - kicker: 方向对比
          navLabel: 方向
          title: 这一页和别的页，方向是反的
          lead: 弄清方向，才知道改动的影响往哪散。
          colA: 页
          colB: 谁引用谁 · 删除行为
          rows:
            - - 用户管理（本页）
              - 档案本体，被别人引用 · 自己不引用别人
            - - 审计日志 / 授权码 / 访问申请
              - 它们引用 users · decouple + 名称快照
            - - 角色权限
              - user_roles 引用 users · **cascade 跟随删**
  - id: ui-layer-model
    layer: L1
    navId: ui-layer-model
    kind: carry
    index:
      hear: "设计/评审一个表格页面、接到『这个页面由哪几行拼』『这格点下去发生什么』类问题"
    nav:
      title: 表格 UI 分层
      subtitle: 触发：设计表格页面 · 五层各管一段 · 上层只装配下层只参数
    page:
      kind: carry
      kicker: 规范 · 表格 UI
      title: 一张表格从上到下分五层，上层只做装配，下层只做参数
      lead: 全系统 20 个页面共用同一个表格组件，却没共用同一套形态参数——骨架是统一的，格子行为是各页面各写的。根子在列的声明方式：单维 `renderMode` 把「值形态」和「编辑入口」两个正交维度挤在一个字段里，遇到组合就表达不了，结果 135 处列逃进 `custom` 手写 JSX。拆成五层、每层只管一段，形态一致性才由结构保证，而不是靠人盯。
      factsKicker: 这一页解决什么
      factsTitle: 五层不是切分代码的产物，是从「使用」这条线上长出来的五段
      factsLead: 人用一张表是自上而下：先看见页面由哪几行拼，再看行里有什么，再看表格怎么翻，再看某一格是什么，最后才点开确认层改它。五层对应这条线，每层只回答一件事。
      facts:
        - label: 五层各管一段
          note: L1 骨架装配（页面由哪几种行、按什么顺序拼）→ L2 行槽位（每种行的参数与形态）→ L3 表格主体（引擎、空行、分页）→ L4 单元格（值形态 × 编辑入口 × 值状态）→ L5 确认层（输入控件与检索档）。上层只装配，下层只参数。
        - label: 分层纪律
          note: 上层不许替下层决定形态，下层不许越过上层改装配。所谓「页面模式」只是装配组合不同——采购清单是「工具行 + 明细主体（只读）」，售后多装一个「辅助行」，采购报价再多个「统计行」。**不定义三种模式，只定义行槽位序列**：以后任何页面加录入区 = 数组里插一项，不动骨架代码。
        - label: 判定标准（唯一硬指标）
          note: "页面不得在 `renderMode: 'custom'` 内手写单元格交互。任何一处可编辑格都必须能表达为「值形态 × 编辑入口 × 值状态」三个参数的组合。无法归类的例外必须登记在案，并说明为什么不能用参数表达。"
        - label: 交互层职责边界（2026-09-04 裁决）
          note: '常驻输入格（inline）的键盘导航归表格层（InteractionLayer）；确认层格（confirm）的键盘由浮层自管，表格层**不接管**。理由：confirm 格点开后是独立浮层，若表格层也接管焦点，会与浮层双重管理焦点。邻格快切由 CellSwitchProvider 承担（colOrder 显式声明方向钮顺序），与 InteractionLayer 是两套正交机制。**提案原第 2 条「验证 InteractionLayer 能接管确认层格子」的前提不成立，已按此修正**。'
        - label: 弹窗剖面（第六观察位）
          note: 五层管表格主体；编辑弹窗不看五层看剖面——截图上每个块 → 承载组件 → 数据特征 → 登记表出处，四层对照。弹窗内的表格主体仍走 L1-L5，剖面只补「弹窗骨架」这一段。实例见矩阵页「产品管理 · 编辑弹窗剖面」。
        - label: 现状（2026-09-04 实测）
          note: L4 层的代码已全部建成（`cellSpec.ts` 三维定义 + `CellSpecRenderer` 渲染 + `cellSpecAdapter` 适配 + `auditCellSpecs` 自检），采购报价已接入（样板跑通，7 处 custom 消灭）。其余 19 个页面 128 处列仍逃在 `custom` 里手写。L5 已是唯一统一实现。L1 / L2 / L3 未落地。
      tables:
        - kicker: 五层对照
          title: 每一层回答什么、参数是什么、现在是哪个组件
          colA: 层
          colB: 回答什么 · 参数 · 现状组件
          rows:
            - - L1 骨架装配层
              - '这个页面由哪几种行、按什么顺序拼 · 行槽位序列（不定义模式，模式只是组合不同） · 容器层（OrderWorkbench：视图导航条 + 单据标签行 + 主表行 `DocumentContextBar`，九视图共享）→ `ViewFrame`：现固定 actionBar + bizStrip + children（另有 preContent / postContent / dialogs 可选槽），待改为可变序列'
            - - L2 行槽位层
              - '每种行槽位的参数与 UI 形态 · 主表行 fields[] / 工具行 count·statusHint·actions[] / 统计行 fields[{label,value,tone,mono,onClick}] / 辅助行 title·fields[]·action·collapsible · `DocumentContextBar` / `StageActionBar` / `StageBizStrip` / **辅助行缺，需新建** · 主表行挂容器层（九视图共享），ViewFrame 内部从工具行开始'
            - - L3 表格主体层
              - '用什么引擎渲染、空行与分页什么策略 · engine(grid\|matrix) / emptyRow(none\|inline-append) / paging / selectable / rowExpand / virtual(>50 自动) · `UnifiedTable`：参数是裸的，未抽成一层'
            - - L4 单元格层
              - '这一格是什么值、点下去发生什么 · display × editEntry × valueState，另加 hidden（可见性）与 gate（确认层细化） · `cellSpec.ts` + `CellSpecRenderer` + `cellSpecAdapter`：**已建成，采购报价已接入**（2026-09-04 样板跑通，7 处 custom 消灭）'
            - - L5 确认层
              - '输入控件长什么样、检索出不出 · 纯值输入（无检索槽）/ 字典检索（检索档 + 完整字典档两档，行内改删）/ 选用检索（DsInputDropdown + ▾） · `PickerEditGate`：唯一统一实现'
        - kicker: L4 三维
          title: 一格由三个正交维度描述，加两个补充维度
          colA: 维度
          colB: 分支与含义
          rows:
            - - display 值形态
              - '这格显示什么：text 纯文字超出省略 / number 等宽右对齐 / date 灰底 chip / image 24×24 缩略图 / enum-tag 彩色状态标签 / link 下划线品牌色 / multi-record 值 + ▾ 角标'
            - - editEntry 编辑入口
              - '点下去发生什么：none 只读（视觉与可编辑格完全一致，不置灰不消失）/ confirm 确认层 / link 跳转 / expand 展开子记录面板。**inline 常驻输入已废除**（2026-09-04 裁决：与硬纪律「确认层范式·禁止常驻输入框」冲突，editEntry 收为四态；`cellSpec.ts` 里残留的 inline 分支代码随下轮迁移一并删除）'
            - - valueState 值状态
              - '这个值匹配上没有：standard 无附加 / non-standard 值右侧橙色 ⓘ 警示。**与「有字典/无字典」正交**——那是检索能力（决定确认层出不出检索），这是值状态（决定格子显不显示警示），交叉出四种情况，不是同一个轴的两头'
            - - 补充：hidden
              - 该行是否隐藏本格。现状靠 render 里写三元表达式，本质是列级参数而非渲染逻辑
            - - 补充：gate
              - 'editEntry=confirm 时必填：title / input(text\|number\|date) / search(三分支) / bullets / fromText / onApply / allowEmpty'
        - kicker: 装配序列
          title: 同是表格页面，差别只在装了哪几行（2026-09-04 按代码核实）
          colA: 页面
          colB: 装配序列（从上到下）
          rows:
            - - 采购清单（客户端）
              - 工具行 + 明细主体（只读）· 无主表行
            - - 产品管理
              - 工具行 + 明细主体（可编辑）· 无主表行（走 ArchiveListPage）
            - - 采购报价
              - 主表行 + 工具行 + 统计行 + 明细主体（空行录入）
            - - 售后
              - 主表行 + 工具行 + 统计行 + **辅助行** + 明细主体
        - kicker: 迁移进度
          title: 四阶段走到哪了（2026-09-04）
          colA: 阶段
          colB: 内容 · 状态
          rows:
            - - 阶段 0
              - '修「完整字典」档过滤语义：全量不过滤，输入字只做高亮 + 滚动定位 · ✅ 已落地（`PickerEditGate` + `SuggestList.highlightKeyword` / `countHint`）'
            - - 阶段 1
              - '采购报价样板验证：8 列全部改写为三维参数，7 处 custom 消灭 · ✅ 已落地（2026-09-04，e2e 13/13 全过：7 个 confirm 格逐个点开、金额只读、门禁提示、无 JS 错误）'
            - - 阶段 2
              - 抽 `AuxToolbarRow` 辅助行组件（售后「新建退换记录区」是唯一实例） · ❌ 未启动
            - - 阶段 3
              - 批量推：20 个页面 135 处 custom 接入 L4 唯一链路 · ❌ 未启动
            - - 阶段 4
              - 验证后并入本规范 · ✅ 已落地（本篇）
      rulesKicker: 不管做哪一层
      rulesTitle: 越层的改动先看这几条
      rules:
        - - 上层只装配、下层只参数
          - 上层不许替下层决定形态，下层不许越过上层改装配。新增一种行 = 行槽位数组里插一项，不动骨架代码；新增一种格子形态 = 在 L4 加一个分支，不动页面。
        - - 不得在 custom 内手写单元格交互
          - 任何可编辑格必须能表达为三维参数组合。无法归类的例外登记在案并说明为什么不能用参数表达——custom 的语义是「无法归类」，用它就是认输。
        - - 门禁格视觉必须一致
          - "前置未满足的格子保持与可编辑格完全一致的视觉（hover、分割线、行高），点击给提示「请先 X」。参数化之后门禁 = `editEntry: 'confirm' + disabledReason`，视觉由组件统一保证，页面无权决定。"
        - - 待补不静默留白
          - 某表某层暂无实测数据时，页面明写「待补 + 补法」，禁止空白。让人一眼看出是没填还是没有。
        - - L1 落地决策：改造 ViewFrame
          - '已裁决采用「改造 `ViewFrame` 支持行槽位数组」，而非在其上加一层装配器——理由是避免多一层抽象；代价是需对 9 个工作台视图全量回归。L2 的辅助行是本层唯一需新建的组件。'
        - - 对齐由值形态决定，不由页面手设
          - number 右对齐、text 左对齐、date/image/enum-tag 居中。排版（宽、对齐、固定列）归列级，行为归 CellSpec，两处都设会打架。
        - - L4 声明落点＝登记表，禁止第二套
          - L4 三维参数（display × editEntry × valueState）与列清单同源登记在 `entity-meta.yml` 的 pages 段，页面只装配不手写列声明。v31 页面装配器已由登记表驱动列顺序，页面再手写第二套列声明＝违规。
        - - 现状数字以脚本实测为准
          - 「20 页 / 135 处 custom」这类统计由 `auditCellSpecs`（cellSpec.ts）/ grep 实测产出并标日期，禁止手写估计——写死的数字必然漂移。
        - - 矩阵与网格是并列引擎
          - 已裁决：`MatrixTable` 与 `UnifiedTable` 在 L3 为并列引擎（engine: grid | matrix），矩阵不是网格的子模式。矩阵用于浮层内多记录编辑（C29），网格用于页面主体。
        - - 页面表与浮层表是仅有的两类
          - 页面表承载业务主列表、只许 UnifiedTable；浮层表承载贴格展开的关系子集、宽度随内容撑开。职责互不侵占——为单一字段再写一套列渲染＝违规，废弃的 DsTable 禁止再引入。
        - - 三范式判定顺序
          - 先判父+独立子列表 → 整页下钻；再判多对多交叉矩阵 → 编辑弹窗（禁止弹窗上再叠模态框、禁止抽屉做下钻）；否则行内。顺序不可跳。
        - - 勾选与操作列分工
          - 行上扩展按钮只操作当前行；表头同位置扩展按钮操作已勾选行（无勾选则该项不可用）或整表整理动作；空行不勾选、不出行菜单；有勾选就必须能从表头菜单做对应批量动作。
        - - 数据列完整显示
          - 列宽只走统一预设、禁止页面级裸数字最小宽度；数据列默认单行、列宽随当前页最长一行撑开——禁止省略号截断。
        - - 确认层定位先于子层
          - 确认层 FloatPanel 展开并定位稳定后，选用检索子层才从确认层输入框展开并锚定输入框——先展开子层导致跳动＝违规。
        - - 确认层图标语义固定
          - 选用检索=列表/放大镜、字典管理=齿轮——禁止两个长一样的下拉；新建候选做成关键词卡片（禁止「新建某某」纯文本）；单输入框清除用纯文本 ×、不换圆形图标不撑高，全站一套。
    card: {}
  - id: refactor-signals
    layer: L0
    navId: refactor-signals
    index:
      hear: "该不该重构、架构级调整、以前的做法限制了、历史包袱、推倒重来、架构升级、识别重构信号"
    nav:
      title: 架构重构信号
      subtitle: 触发：历史做法限制当下 · 识别信号 · 该变就变
    page:
      kicker: 方法论 · 架构演进
      title: 重构的信号写在人的对话里，不在代码扫描里：三次绕行即立案，沉没成本不投票
      lead: 架构该不该变，不是看代码够不够优雅，是看人被它绊了几次。新需求歪着塞进旧结构、每次都要解释"以前为什么这样"、没人敢动某个模块——这些信号出现时，继续凑合的代价已经开始按天计息。判断的标准是"将来这样对不对"，不是"过去投入了多少"；开发期是重构的窗口期，不是拖延期。但重构本身也要有门槛：说不清"不改会持续付什么代价"，就不许拿"重构"当借口逃避交付。
      factsKicker: 这套方法解决什么
      factsTitle: 信号来自对话，裁决看将来，执行连文档
      factsLead: 架构疲劳靠听人怎么说，不靠工具扫。评估顺序决定成败：先画目标态再看迁移路，反了就会拿现状当约束。
      facts:
        - label: 信号写在对话里
          note: 用户反复绕开某个设计、每次都要解释"以前为什么这样"、新需求要歪着塞进旧结构——这些是重构信号。代码坏味道靠扫描，架构疲劳靠听人怎么说。
        - label: 被历史束缚是信号本身
          note: 「以前做了很多工作」不是不改的理由，只是改的成本项。评估时算成本，不当否决票。裁决的是将来对不对，不是过去投入了多少。
        - label: 开发期债务贬值快
          note: 早期搭的架子服务的是当时的认知。业务定型后架子没跟上的，每个新功能都在付利息；利息超过一次性迁移成本就该重构。
        - label: 最优解按当下定
          note: 重构方案按当前业务形态找同类最优，不因为"从旧方案演化过来"就选折中。折中的演进路径往往比推倒重来更贵。
      tables:
        - kicker: 五类信号 · 见到就立案
          navLabel: 信号表
          title: 什么迹象出现，就必须停下来评估架构
          lead: 单次出现就值得记录，第二次出现要书面评估，第三次出现禁止继续绕行。
          colA: 信号
          colB: 长什么样 · 对应动作
          rows:
            - - 绕行信号
              - 新需求歪着塞进旧结构（加字段绕开表、改交互绕开组件）· 立案评估该层是否该重推
            - - 解释信号
              - 每次协作都要先解释"以前为什么这样设计" · 架构的沟通成本已超标，简化它
            - - 重复信号
              - 同一逻辑在两处各写一套、两处还在各自演化 · 收敛到唯一真相源，删掉另一套
            - - 冻结信号
              - 没人敢动某个文件或模块，改它靠祈祷 · 拆解它，冻结本身就是最大的技术债
            - - 漂移信号
              - 文档说的和代码做的不一致，且没人有能力改回一致 · 重定真相源，先定谁对
      rulesKicker: 执行纪律
      rulesTitle: 重构怎么提、怎么判、怎么落地
      rules:
        - - 三次绕行即立案
          - 同一类"别扭"在对话里出现第三次，必须立案评估重构，禁止继续绕。一次是需求，两次是巧合，三次是架构错了。
        - - 先画目标态，再看迁移路
          - 先按当前业务画理想架构（无视现状），再评估从现状过去的代价。顺序反了就会拿现状当约束，画出个放大版的旧架子。
        - - 禁止用"以前投入"否决重构
          - 沉没成本不参与架构决策。旧工作的价值体现在"哪些部分可保留"里，不体现在"要不要改"里。
        - - 开发期从宽，发布期从严
          - 没有外部用户依赖时，重构代价只有自己的回归成本；上线后每拖一天代价都在涨。"现在是开发阶段"是重构的窗口期信号，不是拖延期信号。
        - - 重构必须连文档一起动
          - 架构变了，方法论、登记表、台账不同步＝没有完成。改完代码回写台账是验收条件，不是可选项。
        - - 禁止拿重构逃避交付
          - 重构要有明确的收益陈述（以后哪类活变快/变省）和范围边界。"我觉得不优雅"不构成理由；能说清"不改会持续付什么代价"才构成。
    card: {}
  - id: meta-runtime
    layer: L1
    navId: meta-runtime
    index:
      hear: "元模型驱动全栈、登记表生成前后端、资源引擎、页面装配、操作守卫声明化、宽表与检索演进、范式多路召回"
    nav:
      title: 元模型运行时
      subtitle: 触发：一份 yml 驱动全栈 · 守卫声明化 · 派生表只许读时计算
    page:
      kicker: 项目规范 · 元模型
      title: 一份登记表驱动全栈：生成器产出两端，守卫声明化，派生表只许读时计算
      lead: 实体×字段×行为的唯一登记处是 entity-meta.yml，生成器产出前后端两份生成物；接口行为、页面列序、操作守卫全部声明化。检索走范式多路召回，派生宽表已物理删除——写时同步的陈旧与孤儿行是固有缺陷，回不去了。
      factsKicker: 这套机制解决什么
      factsTitle: 代码里出现「如果表是 X 就这样」＝该进登记表了
      factsLead: 分支判据是唯一的：能描述为字段/行数/状态/角色的判定，一律声明化；解读器分派，不散落在视图与服务里。
      facts:
        - label: 双端生成
          note: yml 一处 → 生成器产出 frontend/src/shared/config/entityMeta.generated.ts 与 backend/src/services/generated/entityMeta.generated.ts。任何一侧手写第二份登记＝违规。
        - label: 生成区隔离
          note: "generated.ts 生成物禁止手改；实体特有差异写旁边 override 文件（生成器不覆盖）。改配置只改 yml 再跑 node tools/gen-entity-meta.mjs。"
        - label: 行为维度扩展范式
          note: 新增行为维度 = 登记表加一列 + 解读器加一个行为分派，全站生效。禁止散落改各视图各服务——前后端各一套解读＝违规。
        - label: 对拍后切换
          note: 新登记表与旧手写版并存、跑同一批用例比对输出，一致才切。禁止直接替换。
      tables:
        - kicker: 操作守卫 DSL
          navLabel: 守卫
          title: gate 拦格子，guard 拦动作；八类判定先命中先拦
          lead: 同族语义＝前置不满足 → 拦截+给原因，禁止静默不可执行。判定结构与提示语全在 yml，页面只供值。
          colA: 判定
          colB: 语义 · 实例
          rows:
            - - requires / requiresAny
              - 组内必填 / 至少填一。保存动作最常见的第一道。
            - - minSelected
              - 有效行数下限（如至少一行明细）。
            - - numbers / rowNumerics
              - 表单数值比较（gt/ge/lt/le）/ 行内数值（refField 引用行内字段，reason 支持 {占位}）。
            - - formats / states
              - 正则格式 / 状态机 allow-forbid。
            - - rowUnique
              - 集合内组合唯一查重（如同品牌下规格不重复），except 登记例外。
            - - 接入范式
              - 按钮/提交开头一行 resolveGuard('action_key', ctx)，ctx={form,rows,state,collections}；返回 null 放行，否则弹提示返回。
            - - 声明化边界（否决项）
              - 依赖多请求时序、派生计算聚合、条件文案、交互约束 → 例外，登记 data-source/guard-exceptions.md。禁止静默新增散落守卫。
        - kicker: 检索演进 · v29 范式检索 / v30 删宽表
          navLabel: 检索
          title: 索引落在范式表各列，多路召回读时组装；宽表物理删除
          lead: 写时同步的固有缺陷：数据必陈旧、留孤儿行、改一次品牌名要遍历全部 spec 重建——不可行，反范式宽表禁止作为主数据副本存在。
          colA: 机制
          colB: 规则 · 证据
          rows:
            - - FULLTEXT 索引位置
              - 6 个 ngram 索引：product.name/remark、spec.specModel/remark、brand.name、category.name——落在范式表各列，不在任何派生表上。
            - - 多路召回
              - 六路并行（产品名/俗称/规格型号/执行标准/品牌/分类）→ 合并 specId 候选集 → 读时组装与宽表行同构的结果，复用既有打分。
            - - 降级路径
              - FULLTEXT 为主，0 召回回退参数化 LIKE；短词（ngram min_token_size=3 覆盖不到）直接 LIKE。禁止用「加宽表」解决短词召回。
            - - 删除前置（流程性否决项）
              - 派生表物理删除前必须：①范式全读路径就位 ②全部写路径停同步 ③对拍验证（本次重合度 96.2%）④数据缺陷先修。四条缺一不删。
            - - 影响面
              - 删宽表仅影响检索与列表展示；单据快照、金额、统计不依赖派生表——快照层禁止依赖任何检索派生表。
        - kicker: 资源引擎与页面装配 · v31
          navLabel: 资源引擎
          title: 一组路由服务所有已登记资源；页面只供编辑器
          lead: 登记是零代码新增的唯一入口，未登记的资源一律 404。
          colA: 机制
          colB: 规则 · 否决项
          rows:
            - - 资源引擎
              - /api/staff/r/:resource 服务清单/新建/快建/详情/改/删/引用计数；行为由 yml resources 段声明。禁止绕过登记表开接口。
            - - 引擎边界
              - 只做单表通用读写；多表事务、单据状态机、跨表对账走实体专属 service，禁止塞进引擎。
            - - 可写字段 Fail Fast
              - 新建出现白名单外字段直接拒绝（防误传静默落库）；修改只取白名单内字段。
            - - 页面装配
              - pages.slots 数组顺序=列顺序；页面只提供各槽位编辑器，assembleSlots 按声明排序；声明了未实现的槽位由 missingEditors 自检暴露。
            - - 零代码新增 SOP
              - Meta Studio 填 resources+pages → 写编辑器 → assembleSlots 接入 → 保存跑生成器 → 前端 vite build + 后端 tsc + verify-resource-engine(11/11) → e2e → 回写台账。
      rules:
        - - 一处声明五面产出
          - 改一个字段只动 entity-meta.yml 一处，前端列表、后端校验、文档三处自动跟；check-docs 与前后端构建零报错是验收线。
        - - 留痕优于审批
          - 审计动作未登记仍记录并告警，不丢事件；登记补齐是事后动作。
        - - 快照层独立于检索层
          - 单据快照、金额、统计禁止依赖任何检索派生表——派生表可以删，快照不能跟着陪葬。
    card: {}
  - id: visual-canvas
    layer: L1
    navId: visual-canvas
    index:
      hear: "画布、缩放、行盒子、设计令牌、视觉稳定性、移动端适配、浮层载体、信息密度"
    nav:
      title: 视觉与画布
      subtitle: 触发：尺寸缩放令牌 · 物理大小恒定 · 三载体派发
    page:
      kicker: 项目规范 · 视觉
      title: 布局锚死 1200px 画布：设备只决定能看见多少，绝不决定元素多大
      lead: 所有尺寸只相对画布计算，绝无相对视口的计算。移动端不是另一套界面，是画布物理大小+小可视范围——缩放、移动、横向滚动，格局不变。
      factsKicker: 这套规则解决什么
      factsTitle: 双端一套界面靠「物理大小恒定」保证，不靠响应式
      factsLead: 响应式断点会让同一功能在两台设备上长成两个样子，维护两套=各写各的。
      facts:
        - label: 物理大小恒定
          note: 禁止视口单位、禁止断点改变尺寸/字号/布局、禁止换行破坏结构。设备屏幕=可视范围，超出靠移动画布。
        - label: 缩放唯一作用点
          note: "缩放只打在 .ds-canvas-stage 一次（transform 写 scale(var(--shell-zoom))），浮层挂舞台叠加层一起缩。禁止浮层逃出舞台再补缩放、禁止打在 html/body。"
        - label: 行盒子统一
          note: 行高 24px / 字号 11px / 水平内边距 8px / 元素间距 4px / 行间距 0，全由令牌控制（--shell-*），任何一行不许自己调。
        - label: 令牌唯一参数源
          note: 所有布局与视觉参数走 tokens.css 令牌（--radius-*/--spacer-*/--body-*/--status-*/--shell-*/--overlay-*/--print-*），禁止页面硬编码裸值。
      tables:
        - kicker: 三载体派发
          navLabel: 三载体
          title: 浮层按意图三分，出现第四种浮层实现＝违规
          lead: 出现意图匹配不上三载体却新建一种浮层＝违规。
          colA: 意图
          colB: 载体 · 定位
          rows:
            - - 只提示
              - 消息通知（antd message）· 贴视口顶，不进画布叠加层
            - - 填表 / 确认
              - 模态框（DsDialog）· 相对 1200px 画布居中，宽度不随视口压缩（max-width:none，容不下由 wrap 横向滚动）
            - - 贴元素辅助
              - 悬浮定位框（FloatPanel）· 挂画布 float 叠加层；垂直下方优先、不足切上方（以画布为基准不以视口）；失焦不自动关（手机滑动常致失焦）
        - kicker: 稳定性与移动端
          navLabel: 稳定
          title: 状态转换不改大小；移动端不换格局
          lead: 防抖动是双端一套界面的前提。
          colA: 规则
          colB: 硬表述 · 否决项
          rows:
            - - 状态转换不改大小
              - 文本态↔编辑态、面板收展不得改变元素/列宽原本大小；辅助图标悬浮叠加不占流式宽度。
            - - 禁浏览器自动调整
              - 全局锁死 text-size-adjust:100%（html 与全部表单控件），任何元素不得依赖浏览器自动缩放。
            - - 移动端格局不变
              - 表格不转卡片、弹窗不转页面、浮层保持画布定位、列结构双端一致。禁止设备检测做视图形态切换（仅允许纯样式处理）。
            - - 点格出键盘
              - 开单名称/数量/单价/单位/备注常驻可编辑，未编辑不得 readOnly、禁止先画字再异步 focus；数字列 inputMode=decimal 禁原生 number；键盘弹出只给浮层垂直让位。
            - - 横向滚动全覆盖
              - 所有「一行行的容器」必须不换行+横向滚动容器（表格/信息条/工具栏/表单字段行/矩阵行）。
            - - 信息密度三重约束
              - 字号仅几档优先小档、间距仅几档禁大间距、行高仅两档（触摸目标除外）；禁止大面积留白、汉堡菜单+抽屉导航、客户端底部标签栏。
        - kicker: 壳子常驻
          navLabel: 常驻
          title: 换业务对象不拆骨架
          lead: 用户只是换业务对象/子视图时，导航/标签栏仍在同一棵树。
          colA: 规则
          colB: 硬表述
          rows:
            - - 常驻挂载
              - 员工端导航+底部操作栏、工作台单据标签栏、筛选条与表格外框一次会话内保持挂载只改状态；仅离开会话页清理。
            - - 加载与切换
              - 加载中只盖内容区（骨架占位）；切实体先订新目标再拉数——禁止先清空再整页转圈。
      rules:
        - - 浮层承载细则
          - 确认/取消钉 FloatPanel 底栏、面板内禁止横向滚动（内容超出走内部纵滚）、水平锚点在画布内平移；选完/输完自动关闭，没选中保留自由文字。
        - - 行盒两层嵌套不可回退
          - 外层固定可视窗口 overflow:hidden，内层 overflow-x:auto——单层结构下任意一行被撑宽会让整列变宽、单行滚动失效，禁止合并。
        - - 内容区水平内边距为 0
          - 行盒自带 padding，父子都加水平 padding 会让内容起点错位、各行宽度不一致（垂直 8px 保留）。
        - - UI 框架主题走令牌
          - 表格与输入框的行高/字号/内边距通过主题令牌统一配置，不做样式覆盖。
    card: {}
  - id: eng-discipline
    layer: L0
    navId: eng-discipline
    index:
      hear: "新建文件、类型迁移、同名 js、改了没生效、构建校验、模块引用后缀"
    nav:
      title: 工程纪律
      subtitle: 触发：src 只许 .ts/.tsx · 同名 .js 遮蔽 .ts · 构建校验全绿
    page:
      kicker: 方法论 · 工程
      title: 同名 .js 永远遮蔽 .ts：类型检查看 .ts，运行时跑 .js——所以 src 下不许有 .js
      lead: Vite+TS 解析契约：import 'xx.js' 且同目录存在真实 xx.js → 必然加载它；不存在才回退解析 xx.ts。这是解析器既定行为，不可配置规避，只能靠「不让 .js 存在」保证。「改了代码页面没变化」的根子就在这。
      factsKicker: 这组纪律管什么
      factsTitle: 唯一权威 → 变更纪律 → 构建校验，三道闸缺一即断
      factsLead: 双份并存不是风格问题，是正确性问题：两边各说各话。
      facts:
        - label: 客观前提
          note: 同名 .js 永远遮蔽 .ts（解析契约，不可规避）。类型与运行时各跑一份＝「改了没生效」的根因。
        - label: 铁律一 · 源码唯一权威
          note: src 下只允许 .ts/.tsx，禁止任何 .js（含同名副本/历史残留）；全站模块引用统一写 .js 后缀（目标为 .ts 时靠回退解析），禁止 .ts 后缀、禁止混写。
        - label: 铁律二 · 变更纪律
          note: 见到同名 .js 必须先删除再改 .ts——留着只改 .ts＝白改。文件类型迁移必须「重命名式」（旧文件消失新文件接管），严禁复制式并存。
        - label: 铁律三 · 构建校验
          note: 构建校验内置「src 下发现 .js 即失败」扫描；凡前端工程整改/提交，以构建校验全绿为验收底线。
      rules:
        - - 工程配置文件同名只留一种
          - 同名 .js/.ts 只留一种、以 .ts 为准。
        - - 四条反模式即断链判定
          - 复制式迁移（断唯一权威）、只改 .ts 不删 .js（断变更纪律）、裸构建不校验（断校验闸门）、变更记录先写代码后改文档（断同步）。命中任何一条＝返工。
        - - 后端同守唯一权威
          - 本组纪律为跨功能通用规则，后端 TypeScript 工程同样遵守。
    card: {}
  - id: app-navigation
    layer: L1
    navId: app-navigation
    index:
      hear: "导航、路由、菜单声明、位置记忆、视图保活、底部操作栏、返回前进"
    nav:
      title: 导航与位置记忆
      subtitle: 触发：目录即配置 · 导航=权限树 · 离开记账回访还原
    page:
      kicker: 项目规范 · 导航
      title: 目录即配置、扫描即发现：导航树就是权限树，位置离开记账、回访还原
      lead: 模块入口声明导航路径，注册表扫描汇总——每节点声明路径/显示名/入口路由/默认路由/图标/权限标识，格式「一级.二级.三级」。一级二级由布局渲染，三级及更深自动插在二级导航与内容区之间——禁止塞进内容区当工具条。
      factsKicker: 这套机制管什么
      factsTitle: 导航层只管「去哪」和「记住到过哪」，不管业务操作
      factsLead: 位置记忆、视图保活、底栏浏览栈是三件不同的事，混在一起就分不清谁该还原来的样子。
      facts:
        - label: 导航=权限树
          note: 一二级控制进入模块/页面，三级及更深叶子控制具体视图——权限挂载与导航层级同构（权限规则见角色权限篇）。
        - label: 位置记忆
          note: 离开即记账（路由变化把完整地址记到对应节点）→ 回访优先还原上次完整地址 → 无记忆才回落默认入口；工作台特例无单据 id 优先打开本会话当前标签；记忆地址仍走鉴权。
        - label: 视图保活
          note: 懒激活（首次访问才挂载）+ 显示/隐藏切换（已访问视图保持挂载非卸载、切回零延迟状态全保留）——工作台 8 视图是现行实例。
        - label: 底栏浏览栈
          note: 自建页面浏览栈：跳转压栈、后退/前进出栈跳转不再压栈、登出清空；与位置记忆的区别=会话操作序列 vs 回访还原。
      tables:
        - kicker: 底部操作栏
          navLabel: 底栏
          title: 顶栏管去哪，底栏管操作轨迹上的退与进
          lead: 挂员工端布局，登录页不出现。
          colA: 放什么
          colB: 硬规则 · 否决项
          rows:
            - - 放
              - 上一步 / 前进一步 / 撤销编辑（有编辑栈再亮）/ 轻量状态提示。
            - - 不放
              - 业务专用返回文案、单据字段、单视图主按钮——底栏是通用轨迹工具，不是业务操作区。
      rules:
        - - 导航层不做整页缓存
          - 保活靠视图级懒激活+显隐切换，禁止导航层整页缓存。
        - - 三级及 deeper 自动插入
          - 三级及更深导航自动插在二级导航与内容区之间，由布局渲染——塞进内容区当工具条＝违规。
        - - 多文档标签行不塞返回按钮
          - 标签行管文档切换，返回走底栏浏览栈——两套职责不混。
    card: {}
  - id: fe-be-duties
    layer: L1
    navId: fe-be-duties
    index:
