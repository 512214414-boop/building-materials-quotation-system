  - id: why-money
    layer: L1
    navId: why-money
    kind: link
    nav:
      title: 收付款往来
      subtitle: 跟客户收 · 跟供应商付
    page:
      kind: link
      kicker: 收付款往来
      title: 对着当时那张单：跟客户收，跟供应商付
      lead: 钱是跟「当时说定的那笔」走的。档案后来改价，不能改已经收过、付过、对过的数。定金可能开单时就收，目录不要求先履约再收款。
      what:
        kicker: 这一类活在门店是什么
        title: 客户往来和供应商往来
        facts:
          - label: 跟客户收
            note: 按当时报价收定金、收尾款、对账。
          - label: 跟供应商付
            note: 调货、进货按当时谈的价付，不是按今天档案上的价。
          - label: 对的是那张单
            note: 单上的名称、数量、价是当时抄的，对账不能漂。
      dialogue:
        kicker: 线下怎么干
        title: 按当时说定的数收和付
        turns:
          - who: 店员
            text: 这单按刚才报的价收。定金可以先收。
          - who: 客户
            text: 货到了再结尾款。
          - who: 店员
            text: 华南那笔按电话里问到的进价付，不要过两天又去翻现在的牌价。
        after: 痛点：若收款、付款跟着档案现价跑，对账会对不上当时跟客户、跟供应商说的话。往来必须钉在当时那张单上。
      effects:
        - - 收的是当时报给客户的价
          - 往来对着单上当时抄下的金额。档案改价不改已收、已对的数。
        - - 付给供应商的是当时问到的价
          - 应付钉在当时进的那笔货、当时谈的价上，不拿后来的档案进价去改。
        - - 定金和尾款会拆开收
          - 允许开单当时就收一笔，货到再收。不强迫先配完货才能记收款。
      sharedUses:
        - - 当时抄死
          - 往来的唯一依据是单上当时的数。
        - - 改这一条还是改一类
          - 改点位、改牌价是档案的活；已经收过付过的单不跟着整批改价走。
    card: {}
  - id: why-after
    layer: L1
    navId: why-after
    kind: link
    nav:
      title: 售后
      subtitle: 对着卖掉的行退 · 认全了才能回仓
    page:
      kind: link
      kicker: 售后
      title: 对着柜台上的货去对已经卖掉的行；认全了才能回仓
      lead: 售后是对已经开出去的那些单负责。货退回来顺序是乱的，点到什么对什么。用手边的字去撞已经卖掉的行，对上了才落到那张或那些原单。退的数量不能超过本店当时卖过的；退的价是当时卖给这个人的价，不是名册上的标准价。当时认过是哪条货，才能按货退回仓库。散客和建档的人都会退。
      what:
        kicker: 这一类活在门店是什么
        title: 退、换、把货退回能退的地方
        facts:
          - label: 货堆在柜台上
            note: 点到什么就是什么顺序。不是顺着原单行号一个个翻。
          - label: 可能来自几张单
            note: 同一人一次把好几张单的剩货一起退。也可能一张单。
          - label: 可能在几家买过
            note: 只能退本店当时确实卖掉的数量。
          - label: 卖价很活
            note: 低于标准价、高于标准价都是常事。这个人一个价，那个人另一个价。退按当时卖掉的价。
          - label: 认过货的
            note: 可以按当时那条货回仓或跟渠道退。
          - label: 只记下口述的
            note: 单还在，钱可以退，但不能假装仓库里多出一条标准货。
      dialogue:
        kicker: 线下怎么干
        title: 剩货退回来，顺序是乱的
        turns:
          - who: 客户
            text: 上次买的水管剩了，要退。可能不止一张单。
          - who: 店员
            text: 先看手里这根是什么。对着已经卖掉的去对，对上了才落到原单。
          - who: 店员
            text: 他可能别处也买过，只能退咱们店当时卖过的数量。价按当时卖给他的，不翻现在的牌价。
          - who: 店员
            text: 当时对上档案的，退回仓库。当时只写了「热水管 25 绿」没对上的，钱可以退，货不能当库存收。
        after: 痛点：若必须先翻出原单再顺着行号找，柜台上的货一乱就找不动；若一次只能退一张单，几张单的剩货要拆好几趟；若按名册现价退，当时谈的活价就假了；若不问本店卖过没有，别人家买的也会被退进来。还要分开：钱和单可以退，库存只能退认过的货。散客没建档，一样会退，不能挡。
      effectsLead: 每一项都是退货现场掉下来的。不是先打开一张已知的单再设计。
      effects:
        - - 柜台上的货顺序是乱的
          - 单据检索和已卖行检索是两个独立格子，不要塞进同一个框。先对单据（宽松打头上所有字，或切精准）。点格进确认层；空词按当前日窗口翻清单（默认当天，上一天下一天、上月下月，也可以点日期跳），一次不要灌很多。退货周期可能隔半年、一年，必须能翻到当时那张单，禁止只列出当天。打字检索不锁日期。行上能预览确认是不是这张。勾上的单当数据源。再对着这些单里已经卖掉的行打名称。对上了才落到那张或那些原单。顺序跟柜台上的货走，不跟原单行号走。禁止必须先打开一张已知的单再顺着行号找。
        - - 一次可能退好几张单
          - 这一趟可以对上多张当时的单。每一件仍钉在它当时那一行。禁止逼人先做完第一张再打开第二张。
        - - 他可能在几家买过
          - 只能退本店当时确实卖掉的数量。没对上已经卖掉的行，不能按嘴里说的数量退。
        - - 卖价很活，这个人一个价
          - 退的价是当时卖给这个人、写在那一行上的价。不是名册现在的标准价。档案改价不改已卖掉的那行。
        - - 散客也会退
          - 水电常买多用剩。没建档的和建档的都能退。开单时没记人档，不挡这一趟售后。
        - - 退的是当时那一行
          - 名称按当时抄的。档案改名不改已卖出的那行。
        - - 认过货才能回仓
          - 规格、牌子、单位都认上了才能加库存。缺一样：钱可以退，不能当标准库存收。
        - - 钱可以退，货不一定能入仓
          - 只写下口述、没认成货的行，不阻断退款，只阻断按货回库。
      sharedUses:
        - - 当时抄死
          - 售后只认单上当时的内容：当时的名称、当时卖掉的数量、当时卖给这个人的价。
        - - 一段字去探
          - 对着已经卖掉的行去认，和开单同一套探法。撞的是当时抄在单上的字，不是现在的货名册。
      rulesKicker: 本环取舍
      rulesTitle: 对原数据退，不是对名册退
      rulesLead: 数量锁本店卖过的；价锁当时卖给这个人的。
      rules:
        - - 禁止
          - 必须先打开一张已知的单再顺着行号找；一次只许退一张单；按名册现在的价退；没对上本店卖掉的行就按嘴里说的数量退；散客不许退；造一份假的临时客户才准退。
    card: {}
  - id: why-shared
    layer: L1
    navId: why-shared
    kind: shared
    nav:
      title: 公共能力
      subtitle: 几类活碰到同一类问题才抽
    page:
      kind: shared
      kicker: 公共能力
      title: 几类活碰到同一类现实问题，才抽成一套
      lead: 不是为了少写代码。开单、履约、往来、售后里，只要现场动作是同一类，能力就必须是同一套。细则在这一页收束；各环正文只点名。
      caps:
        - title: 一段字去探
          usedIn: 开单 · 客户是谁 · 履约找来源 · 售后对已经卖掉的行
          why: 现场都是残缺口语去撞已经落下的字。开单撞货档，售后撞已经卖掉的行。所以是同一个探法：一格跟着嘴走，换看法不改这行字。字在名称里算碰上，名称在字里也算碰上。更像完整说法的排前面，碎片也能中。售后撞的是当时抄在单上的字，不是现在的货名册。开单混写、档案分列维护，是同一能力的两端，不要做成两套互不相认的搜索。
          rules:
            - - 同源
              - 不是四个长得像的框，是同一类活。
            - - 禁止
              - 开单一格、档案又做成四个必填框；履约来源另发明一套搜索习惯；售后必须先打开一张已知的单再顺着行号找；按词把有效结果禁掉。
        - title: 当时抄死
          usedIn: 开单 · 履约 · 往来 · 售后 · 结清
          why: 单是跟客户、跟供应商说过的话。档案改名改价，已经开出去、收过、付过、送过、退过的不能跟着变。改数量、单价、备注，单上的名称仍是当时抄的，不要去档案里刷成现名。只有重新认货，才整份换成当时档案上的字。只换单位，只换单位名。卖价很活：这个人一个价、那个人另一个价，低于或高于名册标准价都是常事。退货按当时卖给这个人、写在那一行上的价，不按名册现在的价。
          rules:
            - - 结清以后
              - 这笔只读。定档不是一类柜台活，是这条能力的终点。
            - - 禁止
              - 改数量时把名称刷成档案现在的名字。退货按名册现在的价算。
        - title: 边做边补档
          usedIn: 开单 · 履约 · 人档
          why: SKU 太多，不可能预先建齐。人当时也不知道还会不会回头，来不及就先开单。用的过程中补名称、价、渠道、人档。线索可以混；落档必须分开认，整句口语不能当产品名。
          rules:
            - - 找不到也先做业务
              - 补档是后一步，不挡开单、不挡出货、不挡退货。没有人档也可以退。
        - title: 改这一条还是改一类
          usedIn: 补档 · 改价 · 改点位
          why: 眼前这条和整类货不是一回事。确认改眼前这条：只这条规格例外。改一类：这个牌子加这类货一起改，已经单独改过的不跟着糊过去。已经开出去的单仍走「当时抄死」。
          rules:
            - - 禁止
              - 改一个牌子的点位，把水管和电线一起改掉。
            - - 禁止
              - 改一类时把已经单独谈过的例外一并盖掉。
    card: {}
  - id: why-canon
    layer: L1
    navId: why-canon
    kind: canon
    nav:
      title: 总纲领
      subtitle: 方案两难时对照这里
    page:
      kind: canon
      kicker: 总纲领
      title: 方案两难时对照这里，不要对照按钮长什么样
      lead: 从五类活、对象、过程、角色、看数、工具习惯和公共能力收束。技术手段可以换，业务要达成的效果不能偏。新功能先问属于哪一条线、那一环线下怎么处理。
      rules:
        - - 系统适配人
          - 贴近手写：残缺也能先记下，跟得上嘴。不让人先填齐表再干活。
        - - 一段字是线索
          - 混在一行里是正常经营。换看法不改这行字。字在名称里或名称在字里都算碰上。找不到档案不能停业务。
        - - 没货就找人问
          - 列出可能供的渠道，留得住电话。进价滞后不等于不供。出货时仓和渠道不是一份名单。
        - - 当时抄死
          - 名称、价、地址、往来按当时单上的走。改数量不刷名称。档案变更不改历史。结清只读。退货按当时卖给这个人的价，不按名册现价。
        - - 三种出法三种成本
          - 仓出按当时均价；外面刚好够这笔的算进订单成本；外面多调的不算订单成本、货进库存。
        - - 开单不必建人档
          - 问到名字或电话就写在单上。什么都没有也先开。建档是给以后还要找这个人、以及按人看数。散客一样能退。
        - - 售后对着卖掉的行
          - 柜台上的货顺序是乱的。对着已经卖掉的行去对，对上了才落到那张或那些原单。只能退本店当时卖过的数量。
        - - 几类活同一类问题，能力必须同一套
          - 抽公共能力是因为逻辑本该一致。
        - - 取舍顺序
          - 历史不能错 > 柜台不能卡 > 影响不扩散。新功能先归到一类活，或归到对象/过程/角色/看数/工具习惯，再设计。
    card: {}
  - id: why-inbound
    layer: L1
    navId: why-inbound
    kind: link
    nav:
      title: 进货管货
      subtitle: 点进仓 · 待入 · 看库存
    page:
      kind: link
      kicker: 进货管货
      title: 货进店：点进哪一仓，仓里还有多少，多调的先进库存
      lead: 配货是给客户那张单凑货。进货是店里自己收货、点仓、看库存。两摊活。外面多调回来的货进库存，不拿去充这笔客户单的成本。
      what:
        kicker: 这一类活在门店是什么
        title: 收货、点进仓、看还剩多少
        facts:
          - label: 货到了
            note: 要点进某一仓，库存跟着变。
          - label: 还没到
            note: 已经答应进、还没点进仓的，要能看见、能确认进仓。
          - label: 仓里还有多少
            note: 按仓、按货能问现在有多少，不是单上写了多少。
          - label: 多调的
            note: 进库存。不算客户那笔订单成本。成本口径在履约。
      dialogue:
        kicker: 线下怎么干
        title: 货到了点数，放哪仓，多调的进库存
        lead: 承接履约：外面多调了几箱。
        turns:
          - who: 店员
            text: 华南那车到了，点进南仓。
          - who: 仓
            text: 客户那单只要一半，多的几箱进库存。
          - who: 店员
            text: 还没到的记着待入，到了再点。仓里现在有多少，下一单要能问到。
        after: 痛点：若进货和配货写成一摊，多调的会被算进客户那笔成本；若货到了没有「点进哪一仓」，库存是假的；若还没到的不记，人会忘。
      effectsLead: 进货是店里收货这一摊，不是配货的附录。
      effects:
        - - 货到了要点进仓
          - 能收进某一仓，库存跟着变。
        - - 还没到的记着
          - 待入的货能看见、能确认进仓。
        - - 仓里还有多少
          - 按仓、按货能看见现在有多少。
        - - 多调的
          - 进库存。不算这笔客户单的成本。口径见履约。
      sharedUses:
        - - 当时抄死
          - 进货按当时点进仓的货和价走。
        - - 边做边补档
          - 货到了可以补进价、补渠道，不挡先收进仓。
    card: {}
  - id: why-objects
    layer: L1
    navId: why-objects
    kind: carry
    nav:
      title: 货和人怎么存在
      subtitle: 分层 · 人不必人人建档 · 两套价
    page:
      kind: carry
      kicker: 货和人怎么存在
      title: 东西在世界上怎么分层，开单那行糊字才能打到
      lead: 这一页不是某一摊活单独推出来的。档案五段写「这份档案怎么拆」；本页写为什么必须这样存在，写到能约束改价、改点位、建档。货要分层；人不是人人一份档案。
      factsKicker: 对象在现实里怎样
      factsTitle: 货、牌子、规格、价、渠道不是一张扁表
      factsLead: 开单混写；平时分开放。混写是作业，分层是对象。
      facts:
        - label: 一个名称很多牌子
          note: 换牌子，规格不能共用。
        - label: 俗称、标准号跟这一条货走
          note: 开单时又混在一句里。
        - label: 进价和售价不是同一套价
          note: 问渠道的价，和卖给客户的价，两套。
        - label: 点位有时只改这一条，有时改一类
          note: 一类不是整个牌子，是这个牌子加这类货。
        - label: 人不是人人一份档案
          note: 散客当时不知道还会不会回头。建档是给以后还要找这个人、以及按人看数。
        - label: 卖给这个人的价很活
          note: 低于或高于名册标准价都是常事。这个人一个价，那个人另一个价。落下的是当时那一行的价。
      tables:
        - kicker: 系统因此怎样
          title: 分层是为了那一行糊字能打到，也是为了改一类不改错
          colA: 对象在现实里
          colB: 系统要达到的效果
          rows:
            - - 同一个名称下面很多牌子，换牌子规格不能共用
              - 牌子是名单；规格挂在牌子下。
            - - 俗称、标准号跟这一条货走，开单时又混在一句里
              - 平时分开放，开单那句糊字才能打到各层。录入不拆、存储要拆。
            - - 整句口语直接当名称建档会叠垃圾
              - 线索可以混；落档必须分开认。
            - - 进价和售价不是同一套
              - 两套价，互不改写。
            - - 确认改眼前这条
              - 只这条规格例外，面价不动。
            - - 改一类
              - 这个牌子加这类货一起改。已经单独改过的不跟。不要把水管和电线一起改掉。
            - - 谁可能供
              - 做过价的，以及宣称做这类货/这个牌子的。不是另搜渠道名当商品。
            - - 同一货不同单位
              - 平时按单位记；用的时候能换成要的单位，不能把箱和米当成两种货。
        - kicker: 人怎么存在
          title: 建档是为了以后还找得到这个人，不是开单门票
          colA: 对象在现实里
          colB: 系统要达到的效果
          rows:
            - - 当时不知道这个人还会不会回头，时间紧来不及记档
              - 问到名字或电话就写在单上。什么都没有也先开。禁止没有人档就不让开单。
            - - 回头、赊账、多个地址、要按这个人看他买了多少
              - 这时才建人档。按人看数只覆盖建档的人。散客群没有按人汇总，可以按单、按货、按时间看。
            - - 水电常买多用剩，散客和建档的都会退
              - 没建档不挡退货。售后对着已经卖掉的行去对，不靠必须先有人档。
            - - 不要造一份假的临时客户去凑名单
              - 空着人也可以。单上当时抄下的字才是事后找单的线索。
            - - 一个人好几个电话、微信
              - 联系是子表，和供应商同一套。开单挑其中一条，跟姓名一起写成客户信息。
            - - 一客多套开票、多个收货地
              - 开票、地址都是子表 N。不能用主档一个框顶替。
            - - 事后按人找单
              - 单上抄的是当时那条客户信息（姓名+那条联系）。采购清单、售后找单，打姓名或打电话/尾号都能对上。
      rulesKicker: 和档案五段怎么分工
      rulesTitle: 本页写为什么存在；五段写这份档案怎么拆
      rules:
        - - 本页
          - 货/人/地/渠道在世界上怎么分层，效果硬到能约束改点位、建档。
        - - 档案五段
          - 出发点指回哪一类活；要支持到才把经营事实推成必须拆的层。不要在五段重写本页。
    card: {}
  - id: why-flow
    layer: L1
    navId: why-flow
    kind: carry
    nav:
      title: 单怎么过手
      subtitle: 过程 · 角色 · 看数
    page:
      kind: carry
      kicker: 单怎么过手
      title: 一张单怎么过阶段、谁在用、事后看什么
      lead: 现场可以交错，目录不是流水线。系统要把「过到哪了、谁能看见、事后怎么回头看」写死。这不是又切出八类活，是同一张单的不同看法。
      factsKicker: 过程 · 角色 · 看数
      factsTitle: 柜台上一张单，店里好几个人、好几个时候在看
      facts:
        - label: 过程
          note: 说到哪做到哪。阶段可以来回改，不要锁死单向。
        - label: 角色
          note: 店员在柜台干；客户自己进来，价要等店里报价说定。
        - label: 看数
          note: 一张单走完要能回头看；店要看一段时间卖得怎样。
      tables:
        - kicker: 过程
          title: 同一张单过手，不是八类活
          colA: 线下这个麻烦
          colB: 系统要达到的效果
          rows:
            - - 现场可交错：定金可能开单时就收，货可能先送再对账
              - 阶段可以来回改，不要锁死单向。
            - - 报价还没对客户说定
              - 客户不能看见价。要等店里报价说定了才可见。
            - - 结清以后
              - 这笔只读。定档是收口，不是柜台上一类活。
            - - 店里干活会按这件事摊开看
              - 报价、收款、配货、送货、成本、售后、汇总、定档，是同一张单的不同看法。不要按这些看法再切一类活。
        - kicker: 角色
          title: 谁在柜台里，谁自己进来
          colA: 谁
          colB: 系统要达到的效果
          rows:
            - - 店员
              - 干开单、配货、进货、往来、售后。按授权看能进哪一摊。
            - - 客户自己进来
              - 可以自己下单。价要等店里报价说定才看见。
            - - 谁能进系统
              - 要授权，不能全员一个口。能干哪一摊，角色分开。
        - kicker: 看数
          title: 事后看什么，不是又一类柜台活
          colA: 线下这个麻烦
          colB: 系统要达到的效果
          rows:
            - - 一张单走完要能回头看
              - 能看这张单卖了什么、收了多少、成本多少。
            - - 店要看一段时间卖得怎样、赚没赚
              - 能按一段时间看经营，不是只有单张单。
            - - 要按这个人看他买了多少
              - 按人看数只覆盖建档的人。散客开过的单仍在，但不进这个人的汇总。
            - - 结清要收口
              - 定档以后只读。汇总、报表、定档写在这里，不要假装是一类柜台活。
    card: {}
  - id: why-habit
    layer: L1
    navId: why-habit
    kind: carry
    nav:
      title: 人习惯怎么干
      subtitle: 表格即主体 · 插在当前行下
    page:
      kind: carry
      kicker: 人习惯怎么干
      title: 人是对着一张表往下写的，系统就按这个习惯做
      lead: 这一页不是某一摊活推出来的。是这个现场的人怎么用工具。开发约束（Token、三种交互范式）仍在哲学；本页写现场习惯，用来解释为什么表格是主体、为什么插行不能甩到表尾。
      factsKicker: 现场怎么用工具
      factsTitle: 像写纸笔单据，不像填网页表单
      facts:
        - label: 表格即主体
          note: 格子只展示，点开确认层再写。表上没有保存按钮。
        - label: 顺着写
          note: 插在当前这条下面，不要甩到最后。
        - label: 画布上干活
          note: 浮层贴着格子开，不弹窗套弹窗。
        - label: 横竖快切不阻断
          note: 一行里逐格敲完，回车/Tab 顺势跳下一格，不要每格都点确认再关。
        - label: 改前改后能分清
          note: 确认层原值弱灰卡片、新值品牌绿卡片，中间 →。不用引号把一对值包成一句。
      tables:
        - kicker: 系统因此怎样
          title: 习惯写成效果，才能约束实现
          colA: 人怎么干
          colB: 系统要达到的效果
          rows:
            - - 对着一张表往下写，改完就是改完
              - 表格是干活的地方。格子点开确认层，确认才写、取消不写。表上不要保存按钮。不要失焦保存：格子密、误触会写；同步工作台多人同开一张单，离格就打接口会撞乐观锁。
            - - 插一行是插在正在写的这条下面
              - 新行插在当前行下面，不要甩到表尾。
            - - 纸笔单据可以翻页接着写
              - 翻到哪一页、写哪一行，就落在那一页那一行，不要串位。
            - - 辅助输入贴着格子
              - 浮层锚定格子。不要弹窗里再套弹窗。
            - - 开单混写，平时分列维护
              - 管理筛档案、开单格探货，是两套框。匹配规则同一套，填法不要合成一个框。
            - - 一格里敲完顺势跳下一格
              - 确认层支持邻格快切：底栏方向钮或键盘 Tab/Shift+Tab（横）、上下（纵）跳到相邻可编辑格，跳转即提交当前格并打开下一格确认层。Enter 仍为确认并关闭。按表格可选启用，未启用处确认层行为不变。
            - - 改之前和改之后要一眼能分
              - 确认层对比用两枚卡片：原值弱灰（--text-tertiary / overlay），新值品牌绿（--text-brand / brand-popup），中间 →，不要用「」把一对值包成一行字。没改过不显示这对卡片。范围说明另起一行弱字。硬到能否决「「旧」→「新」纯文本」。
    card: {}
  - id: know-method
    layer: L0
    navId: know-method
    kind: carry
    index:
      hear: "对话要沉淀成指导思想、切一类活"
    nav:
      title: 对话 → 指导思想
      subtitle: 触发：对话要沉淀成指导思想 · 项目文档的生成源头
    page:
      kind: carry
      kicker: 方法论 · 对话 → 指导思想
      title: 对话进来，指导思想出去：一类活起头，六条线写满，效果硬到能约束实现
      lead: 这是项目自身文档的生成源头：用户的对话——新现场、零散需求、口语反馈——都从这里进，定性、切活、补线、写硬，变成指导思想文档再指导开发。不是每轮对话都生成文档，但每轮对话讲的东西都要有地方落。产出的是「指导思想」：用来指导本项目开发、解释已经做出来（或准备做）的行为。只写一类活，做出来的指导思想解释不了系统——本项目已经用代码证伪过。所以方法强制：作业按一类活切，还要把对象、过程、角色、看数、工具习惯写进指导思想，效果写到能约束实现，最后对着行为实地检测。下一项目只复制这一页，不要复制本项目的开单/配货。
      factsKicker: 方法解决什么
      factsTitle: 指导思想是开发说明书的源头，不是读起来像现场的文章
      factsLead: 以前文档跟着代码过期。现在用这一页生成指导思想。指导思想不够硬，就是这一页还没写够。
      facts:
        - label: 产出是指导思想
          note: 指导开发、解释实现。不是功能说明书，也不写表名组件名。效果必须硬到能否决一种实现。
        - label: 一类活只是第一条线
          note: 作业按现场独立的事切。对象、过程、角色、看数、工具习惯不写进指导思想，实现就没有源头。
        - label: 验收是实地检测
          note: 对着行为问得出效果原句。问不出，先补方法要求的那条线，再补指导思想。过了才能拿去指导开发。
      tables:
        - kicker: 指导思想必须写满的线
          title: 一类活起头，六条线都写进指导思想，缺一条实现就没有源头
          lead: 下一项目按这个清单交提纲。名字由新现场出。不要把本项目的开单/配货当成通用目录。
          colA: 线
          colB: 写什么 · 写到什么精度
          rows:
            - - 作业（一类活）
              - 现场有哪几摊独立的事。每摊四块。效果硬到能否决一种实现。
            - - 对象
              - 货/人/地/渠道在世界上怎么分层。改一类会波及谁、例外跟不跟。
            - - 过程
              - 一张单怎么过阶段、何时只读、谁何时能看见什么。现场可交错则阶段必须能来回改。
            - - 角色
              - 谁在现场干、谁能自己进来、谁能进系统、能干哪一摊。
            - - 看数
              - 事后回头看什么。汇总、报表、定档写在这里，不要假装是一类柜台活，也不要没地方写。
            - - 工具习惯
              - 人怎么用这套东西干活。表格怎么写、插行落在哪、有没有保存按钮。
        - kicker: 什么是一类活
          title: 一摊独立的事，不是一个页面，也不是上一份文档的名字
          lead: 开单、配货、进货只是这家门店切出来的。工厂可能是投料、质检、出货。名字由现场出。
          colA: 像一类活
          colB: 不像一类活
          rows:
            - - 现场有一摊人、一段时间在干这件事，不提屏幕也能讲完
              - 某一个页面、按钮、报表、工作台视图
            - - 干砸了有独立后果（这摊活没做成，别的摊补不上）
              - 按部门、按岗位软件、按数据表切开的模块
            - - 切完还能讲清和别的活怎么交错（可以同时发生，目录不是时间表）
              - 同一张单的不同看法（报价、配货、汇总）——那是过程，不是又一类活
        - kicker: 每一类活写四块
          title: 讲清楚活，效果写到能约束实现
          lead: 痛点写在动作旁边。不写表、组件、接口、功能绰号。
          colA: 块
          colB: 写什么
          rows:
            - - 这类活是什么
              - 短、客观、只写本摊。各摊共用的行业现实放总定位。
            - - 线下怎么干
              - 完整作业。用现场讲过的事实。痛点嵌在动作旁。
            - - 要达成什么效果
              - 对照：哪个麻烦 → 要什么业务结果。见下一表的精度。
            - - 本摊用到的公共能力
              - 只点名。几摊活碰到同一类现实问题才抽。
        - kicker: 效果精度
          title: 两种写法都符合这句话，这句话还不够硬
          lead: 本源层仍然不写表名、组件名。但必须写清条件、不变的字、认全到哪一层。粗句只能当精神，约束不了开发。
          colA: 还不够
          colB: 硬到能约束实现
          rows:
            - - 当时抄死
              - 写清：后来改档案，已经落下的哪一些不准跟着变；改数量/单价还改不改名称；什么情况下才整份重抄。
            - - 没认成货不能回仓
              - 写清：要认成「那条货」，缺哪一层就不算认成。缺了只退钱、不加仓。
            - - 不够就欠着
              - 写清：谁记下欠、什么时候冲掉。只说「欠着」推不出系统当场记下、货到冲抵。
            - - 进价滞后
              - 写清：仓里出的按什么算；外面刚好够这笔的算不算进订单成本；外面多调的算不算、货去哪。
            - - 改这一条还是改一类
              - 写清：一类的圈有多大；已经单独改过的跟不跟。
            - - 吃碎片、混写
              - 写清：切看法改不改字；字在名称里或名称在字里算不算碰上；格式不规整能不能禁掉。
            - - 两个控件长得一样
              - 写清：同一处两个下拉/按钮，用户必须能辨出各自管什么字段。靠图标语义区分，不靠位置记忆。硬到能否决「两个长一样的下拉」。
            - - 变化前后分不清
              - 写清：原值弱、新值强、中间什么符号；禁止用引号把一对值包成一行字。硬到能否决「「旧」→「新」纯文本」。
            - - 重要入口易漏
              - 写清：常用但易被忽略的入口（选用检索展开/收起）靠图标凸显，不是藏在位置里。硬到能否决「列表常开无主动收起钮」。
        - kicker: 因果
          title: 从现场推到指导思想，再推到表和页面，不要反过来
          colA: 这一步
          colB: 推出什么
          rows:
            - - 现实有哪几类活 + 对象/过程/角色/看数/工具
              - 指导思想的目录。现场可以交错，目录只是阅读顺序。
            - - 每一类：是什么、线下怎么干
              - 场景。细节从这里掉下来。
            - - 麻烦 → 硬效果
              - 能约束实现的业务结果。还不是表和按钮。
            - - 几类活同一类现实问题
              - 公共能力必须是同一套习惯。
            - - 六条线都有硬效果了
              - 这份指导思想可以拿去指导开发。
            - - 效果对上了，再设计
              - 表、页面、组件、接口。落地词从这里才出现。
        - kicker: 切法自检
          title: 切完一类活，拿现场还在干的独立工作对一下
          lead: 太粗：不一样的两摊被写成一类，后面的页会推不出来。太细：又变回按页面写。
          colA: 问
          colB: 怎么处理
          rows:
            - - 还有没有一摊人在干另一件事，不提屏幕也能讲完？
              - 有，就补一类活。本项目教训：进货被塞进履约，推不出收货、点仓、看库存。
            - - 核算、归档、汇总是不是某摊活的终点？
              - 是终点就写在看数或那摊活的收口，不要随手再切一类活，也不要没地方写。
            - - 同一张单的不同看法是不是被当成一类活？
              - 是过程，不是一类活。
        - kicker: 实地检测
          title: 方法有没有做通，只看指导思想能不能解释行为
          lead: 有代码对着代码问。没代码对着准备做的行为问。这是方法的最后一步，不是附录。
          colA: 问
          colB: 过 / 不过
          rows:
            - - 源头在指导思想哪一条效果？
              - 说得出原句 = 过。只能说「大概是开单」= 不过。
            - - 这句话能否决另一种实现吗？
              - 能 = 过。两种写法都符合 = 效果还不够硬，回去补精度。
            - - 这条行为在对象/过程/角色/看数/工具里，指导思想有没有页？
              - 没有页 = 方法没要求写满六条线，方法失败。
        - kicker: 这种方法会漏什么
          title: 切法会丢掉绞在一起的现场，要自己补
          colA: 洞
          colB: 写的时候怎么补
          rows:
            - - 目录把同一场拆碎
              - 当时就会碰到的动作，要在那一摊里点到名。
            - - 一场作业被当成全部现场
              - 每摊标明写满还是骨架，并列没写的现场。
            - - 效果句无法证伪
              - 每条效果补：删掉它，现场哪一步会断；哪类现场这条不成立。
            - - 禁止写实现会变成空话
              - 效果必须指回一个现场动作，并硬到能否决一种实现。没有对应就删。
            - - 口语 UI 微反馈漏掉
              - 用户讲的是「这图标要不要凸显」「两个下拉分不清」这类跳跃口语，不是现场作业。补：归到工具习惯/界面基座线，先推意图再写硬效果，不要等它自己变成一类活。
        - kicker: 输入侧：口语反馈到硬条目
          title: 用户讲的是跳跃口语，不是现场作业，要先推演再写硬
          lead: 正向链假设输入是「谁、干什么、卡在哪」。迭代中常来的是「这图标要不要凸显」「两个下拉分不清」这种 UI 微反馈。不推演就落不进六条线，也写不硬。
          colA: 步骤
          colB: 做什么
          rows:
            - - 听原话
              - 原话保留口语、疑问、跳跃，不要替用户补成业务句。
            - - 归哪条线/哪环
              - UI 微反馈多数落工具习惯线（why-habit）或界面基座；改档案/选品的落对应环。
            - - 识别麻烦或习惯
              - 「分不清」=可区分性麻烦；「要不要凸显」=易漏入口习惯；「快切不阻断」=连续录入习惯。
            - - 推演意图
              - 问：他想达到什么效果、现在哪里断。推到能约束实现的一句话。
            - - 写硬效果句
              - 硬到能否否另一种实现。例：「两个长一样的下拉」→「必须靠图标语义区分，否决两个一样」。
            - - 对照已有规则
              - 先查 why-canon / nSlot / order-framework 有没有已写过的；有就接，没有再补。
        - kicker: 数据关系图参数化
          title: 讲清数据关系，扔进槽位，UI/检索/快建/确认全部自动正确
          lead: 带数据表的功能，先把数据关系讲成一份关系图参数（父子 + 字典引用 + 子集 + 上下文依赖 + 确认策略），槽位自动产出五个面。新增功能只填这一份，不再各视图手写一套列/一套快建/一套确认。
          colA: 面
          colB: 槽位自动产出什么 · 写到什么精度
          rows:
            - - 表格 UI
              - 主表+浮层表列结构从实体关系推导：列序跟数据模型走、列宽/对齐/单元格类型/能否点/布局都由字段元数据决定。硬到能否决「各视图手写第二套列」。
            - - 检索
              - 选用检索顶栏由关系树派生（宽松+精准）。硬到能否决「另写检索面板」。
            - - 字典快建/管理
              - 按名称确保幂等 → 直接建即选 + reused 提示；管理面板增删改 + 引用计数。硬到能否决「只能去档案页新建」。
            - - 确认策略
              - 槽位内置三档：单字段幂等=直接建即选；多字段+缺省值+去重=二次确认弹窗；改全局/删除=二次确认+列出影响范围。硬到能否决「各处自写确认」。
            - - 场景截断
              - 同一棵关系树，档案/工作台/库存取不同子集（哪些列、能否编辑、空行规则）。硬到能否决「同一关系抄三遍列」。
        - kicker: 两类字段由关系图区分
          title: 槽位按关系图自动选 A/B，不各处自写分支
          lead: 字段分两类，由数据关系图本身区分，不是各视图各写一套逻辑。
          colA: 类
          colB: 关系图特征 · 槽位怎么走
          rows:
            - - A 类·纯全局字典
              - 关系图=单层（name 全局唯一，无父依赖）→ 走 DictSlot：检索+快建+管理面板。分类/品牌/价格类型/联系方式/客户类型/地址类型/单位全局字典。
            - - B 类·挂上下文关联
              - 关系图=父实体→子表（必须带父 id 才能建）→ 专用选择器，管理在父实体编辑内。例：规格的标准单位、产品×品牌关联。
            - - 单位=A+B 混合
              - 非标行（无父 id）走 A（全局字典）；标准行（有父 id）走 B（父实体子表）。槽位按「关系图+当前有无父 id」自动选，不在选择器里揉两套。
      rulesKicker: 怎么切
      rulesTitle: 先问现场有哪几摊独立的事，不要套现成目录
      rulesLead: 切法拿不准，问现场的人。确认切法和六条线提纲之前，禁止画页面，禁止套用本项目的开单 / 配货 / 售后。
      rules:
        - - 先切后写
          - 一类活的名字来自这个现场，不来自上一份文档。
        - - 六条线一起交提纲
          - 不要先写完一类活再「另写」。对象/过程/角色/看数/工具是指导思想的正文，不是附录。
        - - 目录不是流水线
          - 阅读可以有顺序。现场可以交错。
        - - 公共能力后置
          - 各摊写完再抽。抽的判据是同一类现实问题。
        - - 总纲领最后
          - 开篇只放这个现场共用的现实。不要一上来口号。
      ruleBlocks:
        - kicker: 下一项目怎么用
          title: 把这一页给 AI，再口述你的现场
          lead: 通用的是框架。内容由新现场填。工厂、门店、别的场景都走同一套。
          rules:
            - - 只喂方法
              - 复制「对话 → 指导思想」这一页。不要复制系统业务设计指导思想。
            - - 再讲现场
              - 谁、在干什么、卡在哪、现在手工怎么处理。讲作业和对象怎么存在，不讲想要几个页面。
            - - AI 先交提纲
              - 拟切的一类活 + 对象/过程/角色/看数/工具各写几句。等你确认。未经确认不得套开单/配货/售后，也不得开始画页面。
            - - 确认后写指导思想全文
              - 每一类活四块；六条线都有硬效果；再抽公共能力；总纲领放最后。
            - - 实地检测
              - 列出准备做的行为，一条条问源头。问不出原句，先补指导思想。过了才能设计表和页面。
        - kicker: 带走
          title: 带走写法，不要带走本项目的活
          rules:
            - - 要带
              - 这一页。页顶复制 Markdown。
            - - 可带可不带
              - 下一页「对照本项目」——只是例子，看方法做通之后追源长什么样。
            - - 不要带
              - 系统业务设计指导思想。那是这家店填满的正文。别的项目没有这些活，带过去会让 AI 照套。
