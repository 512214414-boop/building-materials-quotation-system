  - id: backorder-ledger
    layer: L1
    navId: order-backorder
    index:
      hear: "欠库台账、库存缺口、挂欠库、补货清单"
    nav:
      title: 欠库台账
      subtitle: 触发：出库缺口兜底 · 挂账等补 · 到货自动冲抵
    page:
      kicker: 订单中心 · 欠库
      title: 欠库是「先欠着、到货自动还」的兜底账：不在出库处卡住主线
      lead: 配货出库时库存不够，系统不拦着不让走，而是把缺口挂成欠库——主线照常推进，货到了由入库侧自动冲抵。这一页就是这本欠账：谁欠的（来源单据行）、欠多少、欠哪个仓哪个 SKU，导出即采购补货清单。设计要点是「缺口有处去」：没有欠库台账，库存不足要么卡住开单、要么默默少发货主不知道。
      factsKicker: 这一页定什么
      factsTitle: 只记缺口，不记货；冲抵按仓库+SKU 先进先出
      factsLead: 欠库不是库存的负数，是一条待办——它等着被某次入库还上。
      facts:
        - label: 状态三种
          note: 'pending（待补）/ fulfilled（已补）/ cancelled（已取消）。取消是人为放弃，不是系统清理。'
        - label: 缺口维度与快照
          note: '记来源订单与单据行、仓库、SKU（规格+品牌+单位），并落名称快照——品牌或规格被删了，欠库记录仍读得出欠的是什么。'
        - label: 冲抵规则
          note: '入库（采购入库 / 待入库确认）时按「仓库 + SKU 先进先出」自动冲抵，先挂的先还，冲完置 fulfilled 并记录冲抵人与时间。'
      tables:
        - kicker: 缺口从哪来、到哪去
          navLabel: 来去
          title: 欠库的入口只有一个，出口有两个
          lead: 入口收窄是为了不产生来路不明的欠账。
          colA: 方向
          colB: 怎么发生
          rows:
            - - 进（挂账）
              - 内部出库缺口，弹窗双处置选「挂欠库」· 须填数量大于 0，可带备注
            - - 出（冲抵）
              - 入库时自动 FIFO 冲抵，无需人工配对
            - - 出（取消）
              - 人为放弃这笔缺口，置 cancelled
        - kicker: 导出
          navLabel: 补货
          title: 台账导出即采购补货清单
          lead: 导出的意义是可以直接拿着去进货，不是拿来看。
          colA: 维度
          colB: 说明
          rows:
            - - 范围
              - 仅 pending（已补/已取消的不进补货清单）
            - - 字段
              - 产品 / 规格 / 品牌 / 单位 / 欠库数量 / 所在仓库 / 来源单据行 / 备注 / 生成时间
    card: {}
  - id: supplier-payable
    layer: L1
    navId: order-payable
    index:
      hear: "供应商应付、欠供应商多少钱、结算、对账单、账龄"
    nav:
      title: 供应商应付
      subtitle: 触发：该付供应商多少钱 · 按来源分三类 · 结算留痕
    page:
      kicker: 收付款往来 · 应付
      title: 应付是「进货欠的钱」：三类来源各自留凭证，结算只做一次且留名
      lead: 进货有三个入口（等额直发、超额入库、独立采购），每一笔都可能形成应付。应付行不带自己的业务含义，只回答三件事：欠谁的、欠多少、从哪笔业务来的——凭 biz_no 回查源头单据。结算是不可逆动作（只做一次，记录结算人与时间），所以不提供批量结算，防止手滑一次结掉一批。
      factsKicker: 这一页定什么
      factsTitle: 三类来源、两个状态、一次结算
      factsLead: 来源字段不是为了统计好看，是为了对不上账时能回查到源头。
      facts:
        - label: 三类来源
          note: 'allocation_external（等额直发）/ inbound_task（超额入库）/ purchase（独立采购）。都带 biz_no 与可选的来源订单与单据行。'
        - label: 状态与结算
          note: 'pending → settled。仅 pending 可结算；已结算再点会被拒。结算写结算人与结算时间到 remark，不删行、不留糊涂账。'
        - label: 金额口径
          note: '应付金额 = 数量 × 约定进价，落库即定，不随后续价格变动重算。'
        - label: 供应商名是快照
          note: '存 supplierName 快照（来自 supplier.name），供应商改名不影响历史应付对账。'
      tables:
        - kicker: 账龄
          navLabel: 账龄
          title: 按生成日分四桶，只看未结算
          lead: 账龄回答的是「哪笔拖太久了」，不是总额。
          colA: 桶
          colB: 含义 · 用途
          rows:
            - - '0-30'
              - 一个月内新增 · 正常账期
            - - '31-60 / 61-90'
              - 中期 · 需要关注
            - - '90+'
              - 超三个月 · 该催该结
        - kicker: 导出与边界
          navLabel: 导出
          title: 对账单按供应商分组，只导未结算
          lead: 导出是给对账用的，不是给记账用的。
          colA: 维度
          colB: 说明
          rows:
            - - 对账单范围
              - 仅 pending，按供应商分组、按生成时间升序
            - - 聚合上限
              - 账龄聚合取前 2000 行（禁全表 N+1 查询）
            - - 不做什么
              - 不做批量结算、不做部分结算、不做抹零——结算是不可逆动作，一次一行人为确认
    card: {}
  - id: ops-report
    layer: L1
    navId: ops-report
    index:
      hear: "经营报表、看数、毛利、周转、账龄、绩效"
    nav:
      title: 经营报表
      subtitle: 触发：看经营数据 · 七类报表 · 口径写死不临时算
    page:
      kicker: 经营分析 · 报表
      title: 报表不是临时算出来的：七类看数各有写死的口径，谁查都一样
      lead: 报表最容易出的问题不是算错，是「这次这么算、下次那么算」——收款算不算未对账的、退款算不算换货的，口径一变数字就对不上。所以七类报表每一类的取数条件都写死在服务里（哪些状态计入、取多少行、怎么舍入），页面只负责展示。范围一律收窄（几百到两千行上限），不为看一个数扫全表。
      factsKicker: 这一页定什么
      factsTitle: 七类看数，口径各写死，范围各收窄
      factsLead: 报表的核心约束是「可复现」——同一个查询条件，今天查和明天查口径一致。
      facts:
        - label: 区间汇总
          note: '按创建时间区间 + 状态过滤。销售额取单据行金额、收款只认已对账（reconciled）、成本取成本行、退款只认退款类型为 refund。'
        - label: 库存周转
          note: '取有库存的行（上限 300），配最近一次出库流水（上限 800）。无出库记录按 999 天计；滞销判定为闲置不少于 60 天。'
        - label: 应收账龄
          note: '仅未结算，按生成日分四桶：0-30 / 31-60 / 61-90 / 90+，聚合上限 2000 行。'
        - label: 范围一律收窄
          note: '所有报表都带上取数上限（300 / 800 / 2000），避免为看一个数扫全表。'
      tables:
        - kicker: 七类报表
          navLabel: 七类
          title: 一张表看清七类看数各自回答什么
          lead: 报表之间是并列关系，不是一份大表的七个筛选项。
          colA: 报表
          colB: 回答什么 · 关键口径
          rows:
            - - 区间汇总
              - 这段时间生意怎么样 · 收款只认已对账、退款只认退款类型
            - - 分类毛利
              - 哪个品类赚钱 · 按分类聚合销售额与成本
            - - 业务员绩效
              - 谁做得多 · 按业务员聚合
            - - 采购汇总
              - 进了多少货、花了多少 · 按供应商/区间聚合
            - - 应收账龄
              - 客户欠的钱拖多久了 · 四桶分龄，仅未结算
            - - 库存周转
              - 哪些货压着不动 · 闲置天数，不少于 60 天判滞销
            - - 退款统计
              - 退了多少、为什么退 · 按退款类型区分
        - kicker: 边界
          navLabel: 边界
          title: 报表不做的事
          lead: 报表是看数的，不是干活的。
          colA: 不做
          colB: 原因 · 该去哪
          rows:
            - - 不做写操作
              - 报表只读 · 要改数据去对应业务页
            - - 不做实时秒级刷新
              - 看数是决策用，不是监控用 · 需要即时数据查对应台账
            - - 不导出明细对账
              - 对账有专门的对账单导出 · 见供应商应付 / 收款对账
