  subtitle: 这家店的行业根基
page:
  kind: scope
  kicker: 本章定位
  title: 先看门店怎么干活，再设计系统
  lead: 本章是这家店的指导思想：指导开发、解释已经做出来的行为。作业按一类活切；对象、过程、角色、看数、工具习惯也写在本章。写法在侧栏「方法论库 · 对话 → 指导思想」，那一页可带到任何项目。不要把本章的开单/配货目录带到没有这些活的现场去。
  factsKicker: 各环共用的行业根基
  factsTitle: 为什么很多门店还在用手写开单
  factsLead: 行业里不是没有软件。很多店不用，是因为现成系统跟不上嘴。纸笔快、活、残缺也能先记下。本系统达不到手写那么快，但必须贴近这个节奏：系统适配人，不让人适配表。
  facts:
    - label: 货极多、SKU 极多
      note: 品类广、牌子多、规格变体多，新品一直来。不可能提前把全部货建齐；大量是调货，店里并不常备。
    - label: 散客、时间极短
      note: 到店询价选型。答慢、步骤繁，显得不专业，人就走了。当时不知道还会不会回头，常常来不及记人档。
    - label: 店里经常残缺
      note: 档案不全、进价滞后、这款没卖过、店里没货、店员自己也不一定懂。这是常态。
    - label: 双方信息经常糊
      note: 客户说不清参数；店里没现货、店员也不熟。先记下听到的，再打电话问可能供的人。
    - label: 手写仍然更快
      note: 知道多少写多少，不凑齐字段也能开单。禁止比纸笔多一次打断。
    - label: 买过会退
      note: 水电这类常买多用剩。散客和建档的人都会拿剩货来退。退的是本店当时卖出的那一笔，不是名册上的标准价。
  rulesKicker: 怎么用本章
  rulesTitle: 业务驱动系统，不要用实现反推业务
  rules:
    - - 阅读顺序
      - 定位 → 五类活 → 货和人怎么存在 → 单怎么过手、谁在用、事后看什么 → 人习惯怎么干 → 公共能力 → 总纲领。写法见「方法论库 · 对话 → 指导思想」。
    - - 本项目的一类活
      - 销售开单、配货履约、进货管货、收付款往来、售后。这是这家门店切出来的，不是通用目录。
    - - 作业之外必须写
      - 货和人怎么存在、单怎么过手、谁在用、事后看什么、人习惯怎么干。缺一条，实现就没有源头。
    - - 每环怎么写
      - 四块写法和效果精度见「方法论库 · 对话 → 指导思想」。本章只填这家店的现场和效果，写到能约束实现。
    - - 公共能力从业务来
      - 几类活碰到同一类现实问题才抽成一套。不是为了少写代码。
    - - 本章解释到哪
      - 解释系统为什么这样实现。表名、组件名仍不写。效果句必须硬到：两种写法只有一种符合。
    - - 两个文档体系
      - 人看本章对齐开发。用户项目开发文档是旧基线，给 AI 读，同一轮跟上，不能落后。先改可视化，再改用户文档。可视化还没写到的才去那里。两边打架以本章为准。
