id: meta-runtime
layer: L1
navId: meta-runtime
index:
  hear: "元模型驱动全栈、登记表生成前后端、资源引擎、页面装配、操作守卫声明化、宽表与检索演进、范式多路召回"
nav:
  title: 元模型运行时
  subtitle: 触发：一份 yml 驱动全栈 · 守卫声明化 · 派生表只许读时计算
page:
  kicker: 项目规范 · 元模型
  title: 一份登记表驱动全栈：生成器产出两端，守卫声明化，派生表只许读时计算
  lead: 实体×字段×行为的唯一登记处是 entity-meta.yml，生成器产出前后端两份生成物；接口行为、页面列序、操作守卫全部声明化。检索走范式多路召回，派生宽表已物理删除——写时同步的陈旧与孤儿行是固有缺陷，回不去了。
  factsKicker: 这套机制解决什么
  factsTitle: 代码里出现「如果表是 X 就这样」＝该进登记表了
  factsLead: 分支判据是唯一的：能描述为字段/行数/状态/角色的判定，一律声明化；解读器分派，不散落在视图与服务里。
  facts:
    - label: 双端生成
      note: yml 一处 → 生成器产出 frontend/src/shared/config/entityMeta.generated.ts 与 backend/src/services/generated/entityMeta.generated.ts。任何一侧手写第二份登记＝违规。
    - label: 生成区隔离
      note: "generated.ts 生成物禁止手改；实体特有差异写旁边 override 文件（生成器不覆盖）。改配置只改 yml 再跑 node tools/gen-entity-meta.mjs。"
    - label: 行为维度扩展范式
      note: 新增行为维度 = 登记表加一列 + 解读器加一个行为分派，全站生效。禁止散落改各视图各服务——前后端各一套解读＝违规。
    - label: 对拍后切换
      note: 新登记表与旧手写版并存、跑同一批用例比对输出，一致才切。禁止直接替换。
  tables:
    - kicker: 操作守卫 DSL
      navLabel: 守卫
      title: gate 拦格子，guard 拦动作；八类判定先命中先拦
      lead: 同族语义＝前置不满足 → 拦截+给原因，禁止静默不可执行。判定结构与提示语全在 yml，页面只供值。
      colA: 判定
      colB: 语义 · 实例
      rows:
        - - requires / requiresAny
          - 组内必填 / 至少填一。保存动作最常见的第一道。
        - - minSelected
          - 有效行数下限（如至少一行明细）。
        - - numbers / rowNumerics
          - 表单数值比较（gt/ge/lt/le）/ 行内数值（refField 引用行内字段，reason 支持 {占位}）。
        - - formats / states
          - 正则格式 / 状态机 allow-forbid。
        - - rowUnique
          - 集合内组合唯一查重（如同品牌下规格不重复），except 登记例外。
        - - 接入范式
          - 按钮/提交开头一行 resolveGuard('action_key', ctx)，ctx={form,rows,state,collections}；返回 null 放行，否则弹提示返回。
        - - 声明化边界（否决项）
          - 依赖多请求时序、派生计算聚合、条件文案、交互约束 → 例外，登记 data-source/guard-exceptions.md。禁止静默新增散落守卫。
    - kicker: 检索演进 · v29 范式检索 / v30 删宽表
      navLabel: 检索
      title: 索引落在范式表各列，多路召回读时组装；宽表物理删除
      lead: 写时同步的固有缺陷：数据必陈旧、留孤儿行、改一次品牌名要遍历全部 spec 重建——不可行，反范式宽表禁止作为主数据副本存在。
      colA: 机制
      colB: 规则 · 证据
      rows:
        - - FULLTEXT 索引位置
          - 6 个 ngram 索引：product.name/remark、spec.specModel/remark、brand.name、category.name——落在范式表各列，不在任何派生表上。
        - - 多路召回
          - 六路并行（产品名/俗称/规格型号/执行标准/品牌/分类）→ 合并 specId 候选集 → 读时组装与宽表行同构的结果，复用既有打分。
        - - 降级路径
          - FULLTEXT 为主，0 召回回退参数化 LIKE；短词（ngram min_token_size=3 覆盖不到）直接 LIKE。禁止用「加宽表」解决短词召回。
        - - 删除前置（流程性否决项）
          - 派生表物理删除前必须：①范式全读路径就位 ②全部写路径停同步 ③对拍验证（本次重合度 96.2%）④数据缺陷先修。四条缺一不删。
        - - 影响面
          - 删宽表仅影响检索与列表展示；单据快照、金额、统计不依赖派生表——快照层禁止依赖任何检索派生表。
    - kicker: 资源引擎与页面装配 · v31
      navLabel: 资源引擎
      title: 一组路由服务所有已登记资源；页面只供编辑器
      lead: 登记是零代码新增的唯一入口，未登记的资源一律 404。
      colA: 机制
      colB: 规则 · 否决项
      rows:
        - - 资源引擎
          - /api/staff/r/:resource 服务清单/新建/快建/详情/改/删/引用计数；行为由 yml resources 段声明。禁止绕过登记表开接口。
        - - 引擎边界
          - 只做单表通用读写；多表事务、单据状态机、跨表对账走实体专属 service，禁止塞进引擎。
        - - 可写字段 Fail Fast
          - 新建出现白名单外字段直接拒绝（防误传静默落库）；修改只取白名单内字段。
        - - 页面装配
          - pages.slots 数组顺序=列顺序；页面只提供各槽位编辑器，assembleSlots 按声明排序；声明了未实现的槽位由 missingEditors 自检暴露。
        - - 零代码新增 SOP
          - Meta Studio 填 resources+pages → 写编辑器 → assembleSlots 接入 → 保存跑生成器 → 前端 vite build + 后端 tsc + verify-resource-engine(11/11) → e2e → 回写台账。
  rules:
    - - 一处声明五面产出
      - 改一个字段只动 entity-meta.yml 一处，前端列表、后端校验、文档三处自动跟；check-docs 与前后端构建零报错是验收线。
    - - 留痕优于审批
      - 审计动作未登记仍记录并告警，不丢事件；登记补齐是事后动作。
    - - 快照层独立于检索层
      - 单据快照、金额、统计禁止依赖任何检索派生表——派生表可以删，快照不能跟着陪葬。
