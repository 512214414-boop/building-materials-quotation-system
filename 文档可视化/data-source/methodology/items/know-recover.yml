  title: 版本记录与恢复
  subtitle: 触发：文档改动前后 · 有账可查可回滚
page:
  kind: carry
  kicker: 方法论 · 版本记录与恢复
  title: 改动都有迹可循：出了问题按记录回滚，恢复到哪里由人确认
  lead: 这个项目从第一天起就有版本管理：每一次改动都有一条记录，写清改了什么、为什么改。它的价值不在记录本身，而在出了问题时——你能翻出「最近改过什么」、能确认「我要回到哪个点」、能跟 AI 说清楚「帮我查记录 / 给我恢复方案」。这一页把四件事讲明白：记录存在哪、改动怎么记、问题来了怎么描述、恢复怎么走。你不必会 git 命令，但要会这三句话，AI 才能接得上；恢复是不可逆操作，AI 必须先给方案、你确认后才执行。
  factsKicker: 这一页解决什么
  factsTitle: 怕的不是出错，是出了错不知道改过什么、能不能退回
  factsLead: 版本管理不是仓库的事，是「人能不能看懂改动历史、能不能安全回到某个点」的事。
  facts:
    - label: 只改不记，改完就忘
      note: 改完代码不写记录，过几天连自己都说不清这一版动了什么，更没法让 AI 帮你查。记录是给别人（包括未来的自己）看的索引。
    - label: 出了问题不知道往哪回
      note: 有版本管理，但不知道 git log / reflog 能查、不知道「恢复」其实是回到某个提交。AI 说「已回滚」，你听不懂回滚到哪了，就没法验收。
    - label: 不知道还有恢复功能
      note: 除了正式记录，还有操作流水（连回退、删除都留痕）、暂存柜（做一半先收走）、隔离分支（实验不碰主线）。不知道这些功能存在，等于没有保险。
    - label: 回滚是全退还是单退
      note: 一种回滚是把后面的改动一起退掉，另一种是只退掉某一次改动、保留后续。分不清就会误伤：想退一次，结果把之后的好改动也退了。
  tables:
    - kicker: 记录存在哪
      title: 四本账：正式台账 / 操作流水 / 暂存柜 / 隔离通道，各记各的
      lead: 「调最近的记录」之前，先知道记录分几本。日常先翻第一本，退过头了翻第二本。
      colA: 账本
      colB: 记什么 · 什么时候用它
      rows:
        - - 正式台账 git log
          - 每一次改动的正式记录：改了什么（提交信息）、什么时候、在哪一版。日常「查最近改了什么」先翻它。
        - - 操作流水 git reflog
          - 本地所有操作的流水账：连 reset 回退、删分支、跳走都会留痕。不小心退过了头、找不到原来的位置，用它翻回来。
        - - 暂存柜 git stash
          - 做一半不想丢、又不想提交的改动，先收进柜子。做完了可以取回；不需要了可以清掉。
        - - 隔离通道 分支 branch
          - 互不干扰的改动线。想在主线之外试个方案，开条分支试，成了再决定要不要合进来，不成直接丢。
    - kicker: 改动怎么记
      title: 提交信息是给人看的索引：一条改动一条提交，说清改了什么
      lead: 记录写得越清楚，回滚时越好找。混在一起提交，等于回滚时只能整片退。
      colA: 约束
      colB: 怎么写 · 为什么
      rows:
        - - 按逻辑隔离提交
          - 一类事一个提交：feat 功能 / fix 修复 / chore 清理。混在一个提交里，回滚就没法只退其中一件。
        - - 信息写清「改了什么」
          - '`feat: 单位全局字典化改造` 一眼看懂。写「修改若干」等于没写，翻记录时猜不出是哪次改动。'
        - - 开工前工作区干净
          - 动手前 git status 应为 0 条未提交。带着旧改动开新活，两件事会搅进同一个提交，出错分不清是谁的。
        - - 推不推送由人定
          - 提交在本地随时可回；推上云端就是公开历史。推送前先看与云端的差异，别覆盖别人的提交。
    - kicker: 问题来了怎么描述
      title: 标准三句话，AI 就能帮你查记录、定位、给恢复方案
      lead: 自己不用背 git 命令，但要会说这几句话。话术对得上，AI 才知道你要哪本账、动哪一步。
      colA: 我要做什么
      colB: 就这么说
      rows:
        - - 查最近改了什么
          - 「把最近的提交记录调出来给我看看」——AI 跑 git log 列给你，你按提交信息对得上是哪次改动。
        - - 看某次改动明细
          - 「把最近这次提交（或某天）的改动明细调出来，改了哪些文件、每处改了什么」——AI 跑 git show / git diff 给你看。
        - - 要恢复到某个点
          - 「我要恢复到 XX 之前的样子，先别动手，把方案和影响列出来给我确认」——AI 先给方案，你确认后它才执行。
        - - 退过头了要找回来
          - 「我回退过头了，帮我从操作流水里找回原来的位置」——reflog 里能翻出回退前的点，重新指回去。
    - kicker: 恢复怎么走
      title: 恢复四步：翻记录 → 看差异 → 人工确认 → 执行验证
      lead: 恢复是不可逆操作。顺序不能跳：先看清要退到哪、会退回哪些改动，你点头，才动手。
      colA: 步
      colB: 做什么
      rows:
        - - 1 翻记录
          - git log 看最近的改动，git reflog 看操作流水。先找到「目标点」在哪一版。
        - - 2 看差异
          - git show <目标点> / git diff 看那次改动了哪些文件、每处怎么改的。确认这确实是要退的那次，而不是别的。
        - - 3 人工确认
          - AI 把「要恢复到哪、会退回哪些改动、有没有已推上云端」讲清楚，你确认后再执行。确认永远不亏。
        - - 4 执行并验证
          - 执行恢复后 git status 干净、页面正常。万一恢复错点也不用慌——操作流水里留了痕，还能再退一步。
  rulesKicker: 不管谁来操作
  rulesTitle: 五条守则，让每一次改动都可查、可回、可人工确认
  rules:
    - - 改前先确认工作区干净
      - 开工前 git status 应为空。带着旧改动开新活，出错时说不清是哪次改的，回滚就无从谈起。
    - - 一条改动一个提交，信息写清
      - feat / fix / chore 分开提交，信息说明改了什么。这是你回滚时的索引，写得越清越好找。
    - - 恢复前先给方案，人工确认后执行
      - 凡涉及回退、删提交、删分支，AI 必须先列方案和影响范围，你确认后才动手。不可逆操作不允许直接做。
    - - reflog 是最后保险
      - 任何操作都留痕。退过头、删错，都能从操作流水翻回来。出了事先查记录，别慌。
    - - 推送时机由人定
      - 提交留在本地随时可回；推上云端前先看差异，未获指示不推送。
