  title: 工程纪律
  subtitle: 触发：src 只许 .ts/.tsx · 同名 .js 遮蔽 .ts · 构建校验全绿
page:
  kicker: 方法论 · 工程
  title: 同名 .js 永远遮蔽 .ts：类型检查看 .ts，运行时跑 .js——所以 src 下不许有 .js
  lead: Vite+TS 解析契约：import 'xx.js' 且同目录存在真实 xx.js → 必然加载它；不存在才回退解析 xx.ts。这是解析器既定行为，不可配置规避，只能靠「不让 .js 存在」保证。「改了代码页面没变化」的根子就在这。
  factsKicker: 这组纪律管什么
  factsTitle: 唯一权威 → 变更纪律 → 构建校验，三道闸缺一即断
  factsLead: 双份并存不是风格问题，是正确性问题：两边各说各话。
  facts:
    - label: 客观前提
      note: 同名 .js 永远遮蔽 .ts（解析契约，不可规避）。类型与运行时各跑一份＝「改了没生效」的根因。
    - label: 铁律一 · 源码唯一权威
      note: src 下只允许 .ts/.tsx，禁止任何 .js（含同名副本/历史残留）；全站模块引用统一写 .js 后缀（目标为 .ts 时靠回退解析），禁止 .ts 后缀、禁止混写。
    - label: 铁律二 · 变更纪律
      note: 见到同名 .js 必须先删除再改 .ts——留着只改 .ts＝白改。文件类型迁移必须「重命名式」（旧文件消失新文件接管），严禁复制式并存。
    - label: 铁律三 · 构建校验
      note: 构建校验内置「src 下发现 .js 即失败」扫描；凡前端工程整改/提交，以构建校验全绿为验收底线。
  rules:
    - - 工程配置文件同名只留一种
      - 同名 .js/.ts 只留一种、以 .ts 为准。
    - - 四条反模式即断链判定
      - 复制式迁移（断唯一权威）、只改 .ts 不删 .js（断变更纪律）、裸构建不校验（断校验闸门）、变更记录先写代码后改文档（断同步）。命中任何一条＝返工。
    - - 后端同守唯一权威
      - 本组纪律为跨功能通用规则，后端 TypeScript 工程同样遵守。
