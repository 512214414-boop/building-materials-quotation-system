nav:
  title: 接到需求先归类
  subtitle: 触发：接到功能需求 · 先打包归类共性差异再动手
page:
  kind: carry
  kicker: 方法论 · 接到需求先归类
  title: 甩给任何 AI：接到任意表格功能，自动向上抽象、归类、分支、提炼共性差异
  lead: 这不是教用户怎么写文档，是教 AI 怎么工作。用户不管说多少轮、多少表、多少功能，AI 都跑同一个循环：先列出来 → 向上打包成复合体并归类 → 单表归类 → 跨功能提炼共性和差异 → 摆给用户看 → 共性走同一套槽位、差异走分支 → 落地前先查项目里有没有同类。这样用户不用自己抽象，AI 帮他理清；新功能自动复用已有分支，不会各改各的。这是「刚改好产品选品、发现供应商选品又不对」的根治法。
  factsKicker: 这套工作法解决什么
  factsTitle: AI 主动抽象，用户只管说，差异和共性 AI 摆出来给用户看
  factsLead: 用户零散说表、说功能；AI 自己打包、归类、命名，反过来摆给用户确认。抽象这件事不该让用户做。
  facts:
    - label: AI 主动抽象
      note: 用户零散说表、说功能，AI 自己向上打包成复合体、归类、命名。不等用户写好再发。
    - label: 提炼差异与共性
      note: 跨功能找同一类现实问题→抽公共槽位；找差异→分到分支。摆给用户看，用户一眼知道差异在哪。
    - label: 改前先查同类
      note: 改任何一类功能前先查项目有没有同类，有就改公共槽位，不要改单点。这是杜绝「刚改好A选品发现B选品又不对」的根。
  tables:
    - kicker: AI 工作循环
      title: 接到任意表格功能就跑这六步，不急着写代码
      lead: 每轮对话都跑。不管用户说了多少表、多少功能，AI 先抽象归类，摆给用户确认，再动手。
      colA: 步
      colB: 做什么
      rows:
        - - 1 收集
          - 把这轮说的所有表、功能、视图列出来，不急着写代码
        - - 2 向上打包
          - 相关表打包成业务复合体，命名 + 归类（按现场抽象，不限于固定名词）
        - - 3 单表归类
          - 复合体内每张表标类型（字典 / 主实体 / 关联 / …，按现场抽象）
        - - 4 提炼共性与差异
          - 跨复合体 / 跨功能找同一类现实问题→抽公共槽位；找差异→分到分支
        - - 5 反向给用户看
          - 把抽象结果摆给用户，让他一眼看到差异点和共性，确认后再动手
        - - 6 落地
          - 共性走同一套槽位 / 组件，差异走分支；新功能先查是不是已有某一类
    - kicker: 归类按现场，不套固定名词
      title: AI 看现场形态自己命名归一类，不要硬塞进已有词
      lead: 复合体类型和单表类型由现场长啥样定，不是固定两张表。现场出现新形态，AI 自己命名一类。
      colA: 现场长啥样
      colB: AI 怎么抽象
      rows:
        - - 一组表围绕一个档案维护
          - 打包成档案类复合体，命名由现场出，不限于「档案」二字
        - - 一组表围绕一张单的流转
          - 打包成单据类复合体，单据行只快照引用不改档案
        - - 表只存谁连谁
          - 归关联类，只改绑定不解绑本体
        - - 表是全店名单
          - 归字典类，边用边建、被引用不能删
        - - 现场出现上面没有的形态
          - AI 自己命名归一类，不要硬塞进已有名词
    - kicker: 升维提问（拿到问题先做）
      title: 先问「这属于哪一类问题」，再决定方案——不许就近找实现
      lead: 为什么用户（不专业）总能先发现更优解，AI 不能？因为问题一到，AI 就被压到具体层——找最近的实现、复用现成的，从来没人先升维。把升维做成强制第一步，更优解才会自己浮出来；这一页里所有「就近/将就/复用」的事故，根子都是没做这一步。
      colA: 步
      colB: 问什么 · 产出什么
      rows:
        - - 1 归类到类型
          - 这个问题属于哪一类（交互范式/导航形态/编辑单元格/多记录矩阵/长文导航）？说出类名，没类名就不动手。
        - - 2 问通用最优
          - 这一类问题的通用最优范式是什么？不只看本项目——问这一类在该类型的标准做法。
        - - 3 定位现状版本
          - 本项目里这一类已有的实现，是该范式的雏形/低配/误用，还是正确版本？列出差距。
        - - 4 方案 = 范式 − 差距
          - 从「通用范式」出发补差距，不从「最近的实现」出发将就。差异走配置，不另起一套。
        - - 5 交付前自检
          - 我问过「这属于哪一类问题、这类问题的通用最优是什么」吗？没问过=方案大概率是就近的实现，退回重问。
    - kicker: 杜绝重复实现的纪律
      title: 改前先查同类，不要各改各的
      lead: 「刚改好产品选品、发现供应商选品又不对」就是没先查同类、各改各的。改任何功能前先查项目有没有同类公共能力。
      colA: 痛点
      colB: AI 该怎么做
      rows:
        - - 刚改好产品选品，供应商选品又不对
          - 改前先查：选品是不是同一类公共能力？是就改公共槽位，一次全对
        - - 两个页面逻辑几乎一样
          - 先向上抽象成公共，再统一改，不要继续补这一处
        - - 新功能跟已有功能行为像
          - 先归到已有复合体类型走已有分支，不要新开一套
        - - 用户说了一轮新表
          - 跑同一个循环，先归类再动手，不要直接写代码
    - kicker: 通用性判据 · 参数化测试（形状 ≠ 身份）
      title: 差异落在「形状参数」上，禁止落在「实体名字」上
      lead: 「某实体专用槽 / 为某实体开后门」是抽象维度错的信号——把身份（谁）当成了形状（显示到第几级、有无可展开子级、子级从哪取、规模多大）。product 不是例外：它是「树形档案深度=2（产品→SKU 明细）」这一形状的一份配置。
      colA: 判据
      colB: 怎么做
      rows:
        - - 想把差异写成「实体专用 X」
          - 先跑参数化测试：把 X 换成 supplier / customer 还成立吗？成立 = 形状参数对了；要再开第二个洞 = 抽象维度错了，回上层把「层级 / 可展开子级 / 子级数据源」做成通用声明
        - - 框架不认实体名
          - 通用能力只认形状声明（displayLevel / childLevel / 数据源），任何实体只是该形状的一种配置；代码或设计里出现 if <实体名> / 「xx 专用」 = 后门，改写声明不写分支
        - - 「唯一例外」是警报词
          - 每出现一次「某实体是唯一例外 / 为它开洞」，先答：为什么它是唯一？若只是还没轮到别人，说明定义的是身份不是形状，回去改形状
    - kicker: 规模预算进抽象
      title: 涉及取数 / 聚合 / 展开，先问「能拉回前端的行数上限」
      lead: 数据量级是架构硬约束，不是 UX 偏好。客观前提：SKU 几十万~上千万、业务行几千万——前端不可能拉回全量再聚合。任何「前端全量拉取后聚合」的方案在量级下直接否决，正确解只有后端索引聚合 + 展开按需取子表。
      colA: 场景
      colB: 量级预算下的正确做法
      rows:
        - - 产品级列表（一行一产品 + 展开 SKU）
          - 后端按索引 GROUP BY 聚合（productId 维度、分页返回父级行）；展开子表按需单独索引查询（有界）。前端聚合 = 玩具思路
        - - 统计 / 汇总 / 检索候选
          - 走后端聚合 / 索引，候选集压到几百内再回前端；任何「拉回全量在浏览器里算」的方案不入候选
        - - 给用户摆方案时
          - 每个取数方案旁标「量级预算内可行 / 超预算」；超预算方案先被量级否决，不得再以「零风险 / 低成本」包装成推荐
  rulesKicker: 不管实现什么
  rulesTitle: AI 接到任意功能，始终要做到
  rules:
    - - 先升维再动手
      - 没说出「这属于哪一类问题」就动手=没升维。归类到类型、查该类通用最优、定位现状版本，三步走完才决定方案。更优解靠升维，不靠用户提醒。
    - - 形状 ≠ 身份
      - 通用性只落在形状参数上（层级 / 规模 / 数据源），禁止落在实体名字上。写「某实体专用 / 例外 / 开后门」前先跑参数化测试：换个实体还成立吗？成立 = 参数对；要再开洞 = 维度错。
    - - 规模预算进抽象
      - 涉及取数 / 聚合 / 展开的设计先问量级预算（前端行数上限几百内）。超预算方案（如前端全量聚合）被量级否决，禁止标「推荐」。
    - - 推荐先资格过滤
      - 给用户选项前先用「用户长期原则 + 量级预算」过滤：被否决的方案不入候选、不得标「推荐」；能由原则直接裁决的自己裁决并说明理由，不推给用户点选。
    - - AI 主动抽象不等用户写好
      - 用户零散说，AI 自己打包复合体、归类、命名，反过来摆给用户看。抽象这件事不该让用户做。
    - - 归类按现场不套固定名词
      - 复合体类型和单表类型由现场形态定，AI 自己命名。不限于档案 / 单据两种。
    - - 改前先查同类
      - 改任何功能前先查项目有没有同类公共能力，有就改公共槽位。这是杜绝各改各的根。
    - - 提炼差异与共性摆给用户
      - 抽象完把差异点和共性摆出来，让用户一眼看清，帮他理清需求。
    - - 新功能先归已有分支
      - 新功能像已有的某一类，走已有分支复用，不要新开一套。
    - - 每轮都跑同一个循环
      - 不管第几轮对话，AI 都先抽象归类再动手，保证项目演进里同类功能始终走同一套。
