id: cell-gate-path
layer: L0
navId: cell-gate-path
kind: carry
index:
  hear: "设计/评审格子点击交互、接到『点一下要几层』『这个按钮要不要』类问题"
nav:
  title: 格子点击 → 确认层
  subtitle: 触发：设计格子交互 · 路径由值来源层级定 · 确认层检索一套收/展
page:
  kind: carry
  kicker: 方法论 · 交互形态
  title: 格子点一下走几层，由值的来源层级决定，不由页面顺手定
  lead: 同一个系统里，有的格子点值直接进确认层，有的要先展开子记录列表再进确认层，有的要走多级选品树——这不是各页面各写各的，是值的来源层级在决定路径。确认层内部的检索收/展、字典管理边界也是同一套推导。新格子先对着表定路径，禁止另造形态。
  factsKicker: 这一页解决什么
  factsTitle: 怕的不是形态多，是同一个决策各处各拍——路径靠猜、按钮靠感觉、管理入口重复
  factsLead: 三张可查表：路径表（点几下进确认层）、检索表（收/展怎么统一）、管理表（谁可管理）。新格子逐行对表，答不上就是没归类。
  facts:
    - label: 路径由值来源定
      note: 单值点值直进确认层；挂子记录先列表再进确认层；复合体走选品树。路径是推导，不是设计偏好——同一个值来源，全站必须同一条路径。
    - label: 检索收/展全站一套
      note: 确认层输入框旁统一配收/展按钮：默认展开（快速检索），可手动收起（看确认层其他信息不遮挡）。展开/收起按钮形态全站同一款，不新造。
    - label: 有独立字典表才可管理
      note: 格子的值指向独立字典表 → 检索下拉内可改/删（并档优先于删除）；值是直接字段或复合体 → 参数位空=不管理。管理入口全站唯一，禁止第二套管理面板。
  tables:
    - kicker: 路径表
      title: 点几下进确认层，看值从哪来
      colA: 值来源
      colB: 路径
      rows:
        - - 单值（直接字段/单值引用）
          - 点值 → 直接进确认层
        - - 挂子记录（一对多）
          - 点值 → 先展开子记录列表 → 在列表里点某条 → 再进确认层
        - - 复合体（多表树）
          - 点值 → 选品树逐层进，叶子上的值再进确认层
        - - 字典名+引用层（名称全局唯一，引用挂关系/换算）
          - 名称按单值走确认层；引用与换算按挂子记录走——同一抽象的又一层，不是新范式
  rulesKicker: 不管什么格子
  rulesTitle: 最终都要达到
  rules:
    - - 路径对表不拍脑袋
      - 新格子先在路径表里找到值来源行，按行取路径。同一值来源出现第二种路径=违规。
    - - 确认层检索默认展开、按钮可收
      - 进入即展开检索下拉（快速检索），收/展按钮全站同形态同位置；禁止只自动展开不给收起（遮确认层其他信息），禁止默认收起（多一步才能检索）。
    - - 管理能力跟字典走、参数位控制
      - 值指向独立字典表 → 检索下拉带「完整字典」档 + 行内改/删（改走改名/并档预览，删走单条确认）；参数位空 → 不显示任何管理入口。管理能力由参数驱动，格子侧零分支。
    - - 禁止第二套管理面板
      - 同一确认层里不许并存两个字典管理入口；旧面板与新能力重叠时删旧的。确认层之外的管理面板（多选面板等）要单独说明存在理由，说不出就收。
    - - 行内操作常驻不悬停
      - 列表行内的改/删按钮常驻渲染，不靠 hover 出现——移动端没有 hover，hover 态格局不稳。
