  title: 怎么沉淀方法论
  subtitle: 重复才沉淀 · 三件套登记齐才算 · 标题即触发信号
page:
  kind: carry
  kicker: 方法论 · 沉淀
  title: 什么时候沉淀什么：从重复里长出方法论，登记进真相源才算存在
  lead: 方法论不是一开始写全的，是项目里长出来的。触发沉淀的是重复，外加一个例外：高代价教训出现一次就立即沉淀。沉淀有固定流程，登记进真相源（加条目 → 跑生成器）才算生效——站点、侧栏、执行卡自动同步。只存在聊天记录里的方法论会蒸发，AI 下一轮照样想不起来，同一句话你得再讲一遍。
  factsKicker: 这一页解决什么
  factsTitle: 怕的不是没方法论，是有过却没留下来、留下了 AI 却调不到
  factsLead: 沉淀失败只有两种死法：没记下来（蒸发），记下了没登记（AI 看不见）。这一页把两条路都堵上。
  facts:
    - label: 重复才是信号
      note: 一次是案例，两次是模式。第二次出现同一种问题，才到该沉淀的时候。没有重复信号不开新篇。
    - label: 沉淀的是可复用规则
      note: 从案例里提出触发条件+步骤+否决项，剥掉本项目专名。别的项目也能用的才叫方法论。
    - label: 登记才算沉淀
      note: 写成篇章、加进侧栏、写进分流索引、同步 AI 执行卡，四样齐了才算。在对话里说过的，AI 下轮就忘。
  tables:
    - kicker: 什么时候沉淀
      title: 五个信号，出现就登记，不出现不硬造
      colA: 信号
      colB: 例
      rows:
        - - 同一教训第二次
          - 刚改好 A 选品，B 选品又出问题 → 沉淀「改前先查同类」
        - - 同一问题跨功能重复解决
          - 三个功能各写一套确认弹窗 → 沉淀确认策略三档
        - - 同一偏好讲第二遍以上
          - 用户两次纠正「先出图再写码」 → 并进对应方法论的步骤里
        - - 一条规则在多处被违反
          - 快照行被直接改了两回 → 把「快照不回改」写成硬规则
        - - AI 自己踩坑后找到稳的做法
          - 同类任务第一次错第二次对 → 对比两次，把差别抽成步骤
        - - 高代价教训（哪怕第一次）
          - 一次大坑够记一辈子的，不等第二次：立即沉淀为否决项，写进执行卡
        - - 规范存在但没被命中
          - 规则在代码/文档里有、执行卡没登记 → AI 照样违规（实例：确认层范式漏挂载，修规格表格时保留了常驻输入框）。挂载缺口按高代价教训立即补登记
        - - 有共用组件却没登记成清单
          - 要求对齐某范本，AI 却用了低一层的组件（实例：要求对齐供应商联系矩阵，实际参照邻近区块选了网格基座）。缺的不是规则是可查表——「查同类」只能就近猜。按高代价教训立即登记资产清单
        - - 问题被翻译窄了
          - 用户体感「长文档划很久找不到」→ 被翻译成「加个导航」→ 解空间只剩复用现成 tab，功能有了体验错了。教训：先复述体感再定问题，问题定义窄了，解就窄了
        - - 复用变成将就
          - 现有模式有适用前提（顶部 tab 为 3–6 节短篇设计），套到 10+ 节长文就成了将就。教训：沿用前先过适配度三问（为谁设计／差在哪／超阈值就换）
    - kicker: 怎么沉淀
      title: 留证据 → 提炼 → 去项目化 → 检验 → 登记 → 回写
      lead: 六步走完才算沉淀。走一半（只在对话里说）不算。
      colA: 步
      colB: 做什么
      rows:
        - - 1 留证据
          - 记下重复发生的原话/行为。案例是方法论的地基，抽掉案例规则立不住。
        - - 2 提炼
          - 从案例抽出三样：触发条件（什么时候用）+ 流水线/规则（怎么做）+ 否决项（防什么）。
        - - 3 去项目化
          - 剥掉本项目专名，换成现场通用语。带着「开单/配货」的方法论传到别的项目会被照套。
        - - 4 检验可证伪
          - 每条规则问：能否决一种实现？两种写法都符合=还不够硬，回去补精度。
        - - 5 登记进真相源
          - data-source/methodology.yml 加条目 → 跑 node tools/gen-docs.mjs，站点、侧栏、执行卡自动同步。没进真相源=没登记，AI 调不到。
        - - 6 回写旧篇
          - 和已有篇章交叠的，去旧篇接上引用。不要两处各说一套，也不要重复建篇。
    - kicker: 命名范式
      title: 标题即触发信号：看标题就知道处理什么、什么时候用
      lead: 方法论是给人看的，也是给 AI 命中的。标题本身就是触发信号，不要靠 subtitle 和分流表补。
      colA: 规则
      colB: 例
      rows:
        - - 标题=输入→产物
          - 「对话 → 指导思想」=对话进来、指导思想出去。「表功能」=识别到表功能就用。
        - - 输入物写进标题
          - 标题里要有处理什么（对话/需求/表功能/文档/版本），不要只有动作。「按一类活来写」就是反例：看不出什么时候用。
        - - subtitle 与分流表同源
          - 侧栏 subtitle 用「触发：…」格式，和「对话分流」技能索引的触发条件同源，一处改两处同步。
        - - 改名三处同步
          - 篇章 kicker、侧栏 title、分流页技能索引必须同批改，漏一处 AI 就对不上号。
    - kicker: 沉淀的颗粒度
      title: 沉淀方法与纪律，不沉淀一次性的事实
      colA: 归哪
      colB: 什么
      rows:
        - - 沉淀
          - 跨项目可复用的方法（写文档、开发表功能、AI 工作循环）；本项目稳定的纪律（快照不回改、改前查同类）。
        - - 不沉淀
          - 一次性事实（这家店叫什么、今天发生什么）；只出现过一次还没稳定的做法；对话过程本身。
        - - 先挂案例区
          - 出现一次但预感会重复的，先记在当前篇章的案例里，第二次出现再升格成方法论。
  rulesKicker: 不管沉淀什么
  rulesTitle: 最终都要达到
  rules:
    - - 重复才沉淀，重坑例外
      - 一次是案例，两次是模式；但高代价教训出现一次就立即沉淀。没有信号不开新方法论。
    - - 登记才算存在
      - 篇章+侧栏+执行卡由真相源一处生成；不登记进真相源，AI 用不到，等于没沉淀。
    - - 触发条件是门牌
      - 每条方法论必须有明确触发条件，写用户的话长什么样。写不出触发条件=还不是方法论。
    - - 去项目化
      - 方法论剥离本项目专名，换现场通用语。带专名的方法论传到别的项目会被照套。
    - - 可证伪
      - 每条规则硬到能否决一种实现。删掉它现场会断，才算规则；删掉不断的是废话。
    - - 抽象要落到可查表
      - 规则只写文字=AI 命中不了。抽象完必须落成可查的对照表（形态→组件/路径/参数）。写完问一句：AI 靠什么查到它？答不上=抽象只做了一半。
    - - 先保住体感再定问题
      - 用户的抱怨原句（划很久/找不到/分不清）是最高优先级信号。翻译成技术任务前先复述体感，禁止把体验问题窄化成「加个组件」。
    - - 复用前适配度三问
      - 沿用现有模式前先答：它当初为谁设计？我的场景差在哪？差异超阈值就换方案——复用不是将就。
    - - 看得见的东西先摆选项
      - 交互/导航/布局/视觉类改动，先给 2–3 个候选+适用条件+推荐，让用户选。只有纯技术实现才直接给最优解。
    - - 表结构锚定展开法
      - 写涉及数据模型的内容必用：画骨架（表名+字段+类型+约束）→ 填肉（每字段示例值）→ 标关联（外键带 ID 和名称并箭头指向）。禁止纯文字描述表关系。
    - - 架构文档越权自动失效
      - 架构级文档写到功能内部细节＝越权自动失效；功能内部以功能文档/登记表为唯一权威，冲突时功能级为准。
    - - 引用代替复制
      - 跨文档内容用「详见某篇某节」，一个规则一处定义——复制粘贴式重复＝第二套口径的起点。
    - - 显式标注待确认
      - 没核实的内容显式标「待确认」，禁止写成确定语气——隐式知识＝将来有人把它当依据。
  ruleBlocks:
    - kicker: 和路由篇的关系
      title: 路由是索引，本篇是索引的维护规程
      lead: 路由表是门牌簿，本篇管怎么把新技能刻上门牌。
      rules:
        - - 登记即回写
          - 每沉淀一条，分流索引和执行卡就多一行触发条件。四处必须同步改，只改一处=登记没完成。
        - - 旧方法论也走本篇
          - 已有篇章要改（加规则、改触发条件），同样改真相源一处再重新生成，不能只改站点产物。
        - - 淘汰也走本篇
          - 方法论被证伪或被合并时，从篇章、侧栏、路由表三处同时下架，不留死链接。
