# 侧栏「非真相源条目」登记区
#
# 这里登记的条目，内容不在 methodology/items/ 下，而是散落在 js/data/*.js 里，
# 因此它们的标题与副标题无法从真相源推导，只能在这里声明一次。
#
# 判据：能在 items/ 下找到 <id>.yml 的条目，一律不许出现在这里——
#      那是「第二套手写声明」，违反不变量「任何内容只声明一次」，生成器会报错。
#
# 字段：id（必填 · 与渲染层按 id 找内容）· title / subtitle（侧栏显示）
#      group（归属哪个组 · 必须是 _index.yml groups 里已定义的组 id）
#      style（compact 单行 / expanded 多行 · 跟随所属组的排版）

standalone:
