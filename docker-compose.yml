# 建材报价系统 — 生产基建（基础设施即代码）
#
# 说明：
# - 当前开发仍走 dev.sh（前端预览 + 后端 tsx + cpolar 公网穿透），本文件提供
#   可复现、可交接的数据库与运维底座，不强制改变现有开发回路。
# - 应用层（backend / frontend）暂不纳入 compose 以零风险；如需整栈容器化，
#   在 backend/frontend 各自补 Dockerfile 后，按下方「app 服务模板」启用即可。
# - 变量从仓库根目录 .env 读取（docker-compose 自动加载），缺省值见各字段。

services:
  # ── 主数据库（生产级：utf8mb4 / 健康探针 / 持久卷）──────────────────────
  mysql:
    image: mysql:8.0
    container_name: bm_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=500
      - --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bm_quotation}
      MYSQL_USER: ${MYSQL_APP_USER:-bm_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-bm_app_pass}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bm_net

  # ── 数据库 Web 运维台（仅内网/运维使用，勿公网暴露）─────────────────
  adminer:
    image: adminer:4
    container_name: bm_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bm_net

  # ── 应用服务模板（默认注释；补好 Dockerfile 后取消注释启用整栈容器化）──
  # backend:
  #   build: ./backend
  #   container_name: bm_backend
  #   restart: unless-stopped
  #   env_file: ./backend/.env
  #   environment:
  #     DATABASE_URL: mysql://bm_app:bm_app_pass@mysql:3306/bm_quotation
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks: [bm_net]
  # frontend:
  #   build: ./frontend
  #   container_name: bm_frontend
  #   restart: unless-stopped
  #   ports: ["8080:80"]
  #   depends_on: [backend]
  #   networks: [bm_net]

volumes:
  mysql_data:

networks:
  bm_net:
    driver: bridge
