# ════ 推导规则 derivation-rules.yml ════
# 本文件 = 推导规则的【唯一真相源】，一条一条、字段固定（条目会持续增长，故必须结构化，不是散文）。
# 八个字段一条都不能少（规则要能逐条验收）：
#   编号 / 类别 / 名称 / 解决什么业务问题 / 落点 / 配置方法 / 应用规则 / 大白话
# 类别四档（预览面板按它做横向分类导航）：
#   自动补齐  = 引擎单表零声明自动给（边界①）
#   标记推导  = 单一标记直接应用（一个键 → 一个结果，不跨层）
#   关系层推导 = 关系层配置零书写、由它自身推导
#   组合推导  = 跨层级/多源组合才推得出（最易被误判成"缺配置"）
# 契约 §8.5 不再重复列条目（写了就是第二份真相、必然漂移）。

# ── 预览显示注解（仅影响「配置预览面板.html」渲染；推导规则含义不变）──
# 格式：# @col <规则键>: <中文表头>,<列宽(像素)>
# 以后改列名 / 加规则字段 = 只改这里的注释，预览框架零改动（类别 驱动横向导航，不作列）。
# @col 编号: 编号,70
# @col 名称: 名称,160
# @col 解决什么业务问题: 解决什么业务问题,200
# @col 落点: 落点（谁执行/何时生效）,150
# @col 配置方法: 配置方法（配在哪/怎么写）,200
# @col 应用规则: 应用规则（引擎怎么用）,300
# @col 大白话: 大白话,300

规则:

  # ── A 类 · 标记推导（单一标记直接应用，不跨层）──
  - 编号: A1
    类别: 标记推导
    名称: 独立去重 → 单列唯一
    解决什么业务问题: "同一业务对象不能重名（品牌名、分类名），录重了必须拦下"
    落点: "建表输出单列 UNIQUE KEY；保存时做唯一冲突校验"
    配置方法: "表级配置 `独立去重: [字段…]`，每项 = 该字段在本表内自己那一列不重复（单列唯一）"
    应用规则: "引擎直接读表级数组：列表内每个字段 = 单列唯一 UNIQUE KEY。作用域是本表，不是全系统"
    大白话: "把『不能重复』的字段列进表级配置，比如品牌名称——『伟星』全系统只能有一个，录第二个会被拦下"

  - 编号: A2
    类别: 标记推导
    名称: 联合去重 → 组合唯一
    解决什么业务问题: "同一组合不能被录两遍（同一规格+单位+价格类型只能有一条售价）"
    落点: "建表输出组合 UNIQUE KEY；保存时做组合唯一冲突校验"
    配置方法: "表级配置 `联合去重: [[字段, 字段]…]`，每组 = 组内字段组合不重复（分开看各自允许重复）"
    应用规则: "引擎直接读表级数组：每组的多个字段 = **组合唯一** → 组合 UNIQUE KEY；**不同组各自独立唯一**（一张表可有多条互不联合的唯一键）。**每组不能只配一个字段**——只配一个即等同独立去重"
    大白话: "把『凑一起不能重复』的几个字段写成一组，比如规格+单位——防止同一条价格被录两遍"

  - 编号: A3
    类别: 标记推导
    名称: 全文检索单字段 → 单列全文索引
    解决什么业务问题: "长文本（备注、描述）要能输入关键词搜到内容"
    落点: "建表输出单列 FULLTEXT"
    配置方法: "表级配置 `全文检索: [字段…]`，只列 1 个"
    应用规则: "引擎直接读表级数组：1 个 = 单列 FULLTEXT"
    大白话: "给长文字字段列进『要能按关键词搜』——产品备注里输『防潮』能搜到相关产品"

  - 编号: A4
    类别: 标记推导
    名称: 全文检索多字段 → 组合全文索引
    解决什么业务问题: "几个正文列要一起被关键词搜到"
    落点: "建表输出组合 FULLTEXT"
    配置方法: "表级配置 `全文检索: [字段…]`，列出多个"
    应用规则: "引擎直接读表级数组：多个 = 组合 FULLTEXT"
    大白话: "同上，几个字段一起搜。目前还没用到，表达位已就绪"

  - 编号: A5
    类别: 标记推导
    名称: 索引单字段 → 单列普通索引
    解决什么业务问题: "常按某列精确过滤/排序/关联，查得慢"
    落点: "建表输出单列普通 B-tree KEY"
    配置方法: "表级配置 `索引: [字段…]`，只列 1 个（人工业务决策，显式声明）"
    应用规则: "引擎直接读表级数组：1 个 = 单列普通索引"
    大白话: "给经常拿来查数据的字段提速，属性能事，你基本不用关心"

  - 编号: A6
    类别: 标记推导
    名称: 索引多字段 → 组合普通索引
    解决什么业务问题: "常按几个字段一起过滤/关联，查得慢"
    落点: "建表输出组合普通索引（按表级配置里的列表顺序）"
    配置方法: "表级配置 `索引: [字段…]`，列出多个"
    应用规则: "引擎直接读表级数组：多个 = 组合普通索引"
    大白话: "同上，几个字段一起提速。目前还没用到"

  # ── B 类 · 自动补齐（引擎单表零声明，边界①）──
  - 编号: B1
    类别: 自动补齐
    名称: 缺主键 → 补自增主键
    解决什么业务问题: "每张表都要有唯一编号，人不必逐表声明"
    落点: "建表输出 `id BIGINT UNSIGNED AUTO_INCREMENT`"
    配置方法: "配置零书写（表内无主键字段时引擎自动补）"
    应用规则: "表内没有主键字段 → 补长整数自增主键；显式写了 `主键(整数)` 的历史表不覆盖"
    大白话: "你没写编号，系统自动给一个『从 1 往上涨』的编号，你完全不用管"

  - 编号: B2
    类别: 自动补齐
    名称: 全表统一列
    解决什么业务问题: "多租户、老系统编码、创建/修改时间每张表都要有"
    落点: "建表补 tenantId / legacyCode / createdAt / updatedAt"
    配置方法: "配置零书写（全表统一，引擎补）"
    应用规则: "所有表一律补这四列，配置里不出现"
    大白话: "每张表自动带上『哪家租户、老系统编码、什么时候建的改的』，方便查历史，你不用管"

  - 编号: B3
    类别: 自动补齐
    名称: 默认值规则
    解决什么业务问题: "没填的值不能留空报错"
    落点: "建表输出 DEFAULT；写入时兜底"
    配置方法: "配置零书写（类型决定，引擎给）"
    应用规则: "文本→空串（表级配置 唯一键列无默认）/ 整数→0 / 布尔→否 / 枚举(状态)→启用 / 小数→无默认"
    大白话: "你没填的值系统补一个安全默认值（文字空、数字 0、状态启用），省得留空报错"

  - 编号: B4
    类别: 自动补齐
    名称: 外键列型跟随目标主键
    解决什么业务问题: "关联字段两边类型不一致导致对不上"
    落点: "建表输出时外键列取目标表主键的列型"
    配置方法: "配置零书写（外键只写 `外键→表.编号`）"
    应用规则: "外键列型自动跟随目标主键，不重复声明长度/精度"
    大白话: "表之间的『关联编号』自动跟被关联那方一致，不会出现一边整数一边小数"

  - 编号: B5
    类别: 自动补齐
    名称: 库自动索引不声明
    解决什么业务问题: "库已经自动建的索引，不该让人再写一遍"
    落点: "解释器补，不进配置"
    配置方法: "配置零书写（标了反而冗余）"
    应用规则: "主键(聚簇) / 外键列 / 唯一约束自带 / 被唯一键左前缀覆盖的组合 —— 一律不标"
    大白话: "主键、关联字段、唯一字段这些提速是数据库自动做的，不用你声明"

  # ── C 类 · 关系层推导（配置零书写）──
  - 编号: C1
    类别: 关系层推导
    名称: 通路速览
    解决什么业务问题: "产品→品牌→规格→价格 这条链要能在页面上显示"
    落点: "预览/页面展示，非配置"
    配置方法: "配置零书写（禁止另加 `通路` 键）"
    应用规则: "由各层级的 `标题` + `序号` 串联自动推导"
    大白话: "这条链是系统按你排的层级顺序自动拼出来的，你不用再写一遍『通路』——写两遍反而会乱"

  - 编号: C2
    类别: 关系层推导
    名称: 层级权重
    解决什么业务问题: "哪层高哪层低要有个说法"
    落点: "引擎 naturalTier 映射"
    配置方法: "配置零书写（由 `序号` 天然得出）"
    应用规则: "L1 最高 → Ln 最低，权重由序号推导；不是配置值"
    大白话: "谁排前面谁层级高，这个『高低』看你排的顺序自动定，不用单独标主次"

  # ── D 类 · 组合推导（跨层级/多源，最易被误判成缺配置）──
  - 编号: D1
    类别: 组合推导
    名称: 检索引擎参与集与优先级
    解决什么业务问题: "搜索框输词，该拿哪些字段匹配、谁排前面"
    落点: "检索引擎（应用层，不进建表输出）"
    配置方法: "物理层字段级 `检索: {级别: 正整数}` + 关系层 `检索: {模式, 主字段}`"
    应用规则: "参与集=本表所有配了级别的字段；数字小=命中优先；同级并列；关系层主字段应指向本表 1 级"
    大白话: "搜产品时优先按产品名匹配、其次备注，系统自动知道该拿哪些字段去匹配，结果是『搜得准』"

  - 编号: D2
    类别: 组合推导
    名称: 层级展开 / 下钻 / 分组
    解决什么业务问题: "页面要能一层层往下点，每层点开看到该层的东西"
    落点: "页面导航与下钻路径"
    配置方法: "关系层 `层级`（序号/标题/表/主字段）"
    应用规则: "展开几级=层级数；每级子集=该层 `表`；下钻路径=按序号串；面包屑同源"
    大白话: "产品→品牌→规格→价格 能一层层点开，『能点几层、每层看到啥』由你排的层级自动生成"

  - 编号: D3
    类别: 组合推导
    名称: 表格默认列集 / 列序 / 固定列
    解决什么业务问题: "一张表打开默认显示哪些列、按什么顺序"
    落点: "表格装配（pageAssembler）"
    配置方法: "物理层字段声明顺序 + 主字段优先 + 平台约定"
    应用规则: "默认列集=字段声明序；主字段提前；操作/序号/状态为固定列"
    大白话: "打开就对：列按你登记字段的顺序自动排，操作/序号/状态这些固定列自动加上"

  - 编号: D4
    类别: 组合推导
    名称: CRUD 接口与保护
    解决什么业务问题: "每张表的增删改查不该手写一遍"
    落点: "后端资源接口（resourceController）"
    配置方法: "物理层（表/字段/主键/表级配置 唯一键/缺省值）+ 关系层（外键通路）"
    应用规则: "列表/详情/增删改自动生成；唯一冲突校验由表级配置 独立去重/联合去重 推导；外键留空兜底由 `缺省值` 推导；关联读取走关系层通路"
    大白话: "增删改查自动生成，还自带『重复了拦一下、关联留空兜个底』的保护，结果是不会录错、不会报错"

  - 编号: D6
    类别: 组合推导
    名称: 子表只引用直接父（跨级直达 = 反范式）
    解决什么业务问题: "层级里每一层只认它的上一层。跨过父层直接存更上层的字段，等于同一份『谁属于谁』存了两遍：改了父那一行子表这份不会跟着变（更新异常），删掉父行后子表变成找不到爹的数据（孤儿），而且没人拦得住录进不存在的组合"
    落点: "物理层外键声明 + 与关系层层级通路（L1→Ln）对账；做层级展开/下钻/面包屑时按外键逐级推导"
    配置方法: "外键一律写 `外键→【直接父表】.编号`；父以上的属性由父带出，不在子表重复存。关系层先定层级顺序，物理层外键按它逐级对齐。例：品牌规格 → `外键→产品×品牌.编号`（产品/品牌由父带出）；售价/进价 → `外键→单位换算.编号`（规格/单位由父带出）"
    应用规则: "**判别（机器可判定）**：看外键目标表在不在本关系体的层级通路（L1→Ln）里——① **在通路里** → 必须是本表的**直接上一级**，指向更上层 = 跨级直达，体检标红（或在差异层登记为有意偏离并写明理由）；② **不在通路里** → 它是字典/外部主数据（品牌、单位、价格类型、供应商、仓库…），属**横向维度**，不算跨级，作为维度字段保留并参与唯一判定。例：产品×品牌.外键品牌（品牌是字典，非通路层 ✓）；售价.外键价格类型（字典 ✓）；而品牌规格曾直连产品+品牌（两者都在通路上却跳过了 L2 ✗）"
    大白话: "孩子只认父母，爷爷奶奶是谁问父母就知道。品牌规格该挂在『产品×品牌』下，别直接抓着产品和品牌——否则哪天把『产品×品牌』的品牌改了，规格里记的那份品牌就过期了；删掉那条『产品×品牌』，下面的规格就成了没爹的孩子"

  - 编号: D5
    类别: 组合推导
    名称: 缺省值兜底（外键留空 → 兜底成员）
    解决什么业务问题: "录入速度不被必填卡住：分类/品牌/客户这类『关系上重要、业务上可暂缓』的必填外键允许先空着，先保存先流转，真实值以后再补"
    落点: "**写路径三态**：① 字段未提交（编辑没改动）→ 保持原值、不触发；② 提交为空 + 目标表配了缺省值 → 补兜底成员（新增、编辑清空都补）；③ 提交为空 + 目标表没配缺省值 → **直接拦截并提示「请先选择 X」**、不允许保存。读取/列表/统计一律不兜底"
    配置方法: "值=兜底成员的【名称】（未分类/普通品牌/个人业主/待指定渠道/散客），配在【被引用字典表的唯一名称字段】上，如 `分类.分类名称: 缺省值 未分类`；只用于真外键引用的字典/主数据，单据类禁用（单据只冻结快照）。**联合去重全配**：若目标表某 `联合去重` 组含多个字段（组合唯一），组内要么都配、要么都不配——配其一漏其一 = 兜底行插不进去，体检标红。兜底成员**全系统只有一条**，不按租户各建一份"
    应用规则: "【先写再用】外键留空 → 按缺省值名称【直接写入】被引用表 → 撞上唯一约束（同名已存在）→ 直接取用已有那条的 id 关联；写入成功 → 用新记录 id 关联。三个硬前提：① 目标表名称列必须**单列唯一**（它在表级配置 `独立去重` 里，或所在 `联合去重` 组只有它一个字段），否则同名会插出多条、撞不到唯一；② 必须**捕获 DuplicateKey** 取已有，禁止先 SELECT 再 INSERT；③ 兜底行与主记录**同一事务**，主记录失败则回滚。另：**外键字段（含逻辑外键）一律视为必填**——留空时按落点三态处理（有缺省值补、没有就拦截提示）『查哪一列』无歧义：外键已指明目标表，目标表的【唯一名称字段】（表级配置 `独立去重` 中的文本字段，或所在 `联合去重` 组仅它一个，全表唯一一个）既是缺省值的声明处、也是匹配处"
    大白话: "新增产品没选分类照样能保存，系统把它落到『未分类』；以后你在资料里把这条改名或补成真值，下一笔照样接得上。先写再用是为了避免『先查』扑空（兜底记录常被改名），路径更短"
