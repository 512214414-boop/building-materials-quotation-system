# ════ 关系层 relation-layer.yml ════
# 把物理层原材料按业务场景串成通路。每段连接都引用物理层已有外键，不重定义字段。
# 只声明 模式 + 主字段；主字段应指向该层主实体【1级索引】(物理层 检索: {级别: 1})。
# 层级权重由【层级序号天然得出】(L1 最高→L5 最低)，非配置、也不引用物理层检索级别。
# 关系层层级权重 与 物理层字段检索级别 是两件独立的事，互不耦合。
# 通路速览(产品→产品×品牌→…)由层级标题串联自动推导，不在此重复写——写了就是可漂移的副本。

关系体:

  产品管理:
    横切字典: [品牌, 单位, 价格类型, 分类, 供应商, 产品图片]
    层级:
      - 序号: 1
        标题: 产品
        表: [产品]
        检索: { 模式: 产品, 主字段: 产品.产品名称 }
      - 序号: 2
        标题: 产品×品牌
        表: [产品×品牌]
        检索: { 模式: 品牌, 主字段: 品牌.品牌名称 }
      - 序号: 3
        标题: 品牌规格
        表: [品牌规格]
        检索: { 模式: 规格, 主字段: 品牌规格.规格名称 }
      - 序号: 4
        标题: 单位换算
        表: [单位换算]
        检索: { 模式: 单位, 主字段: 单位.单位名 }
      - 序号: 5
        标题: 售价·进价
        表: [售价, 进价]
        检索: { 模式: 价格, 主字段: 售价.单价 }

  # ════ 以下三个关系体 2026-09-06 登记目标：验证两层能否表达供应商/客户/库存各域 ════

  供应商管理:
    横切字典: [联系方式类型, 地址类型]
    层级:
      - 序号: 1
        标题: 供应商
        表: [供应商]
        检索: { 模式: 供应商, 主字段: 供应商.供应商名称 }
      - 序号: 2
        标题: 联系与地址
        表: [供应商联系人, 供应商地址]
        检索: { 模式: 联系, 主字段: 供应商联系人.联系人姓名 }
      - 序号: 3
        标题: 经营与点位
        表: [供应商经营品类, 供应商经营品牌, 供应商点位规则]
        检索: { 模式: 经营, 主字段: 供应商经营品类.外键分类 }

  客户管理:
    横切字典: [客户类型]
    层级:
      - 序号: 1
        标题: 客户
        表: [客户]
        检索: { 模式: 客户, 主字段: 客户.客户名称 }
      - 序号: 2
        标题: 联系与地址
        表: [客户联系人, 客户地址]
        检索: { 模式: 联系, 主字段: 客户联系人.联系人姓名 }
      - 序号: 3
        标题: 开票资料
        表: [客户开票信息]
        检索: { 模式: 开票, 主字段: 客户开票信息.开票抬头 }

  库存管理:
    横切字典: []
    层级:
      - 序号: 1
        标题: 仓库档案
        表: [仓库, 库区, 库房联系人]
        检索: { 模式: 仓库, 主字段: 仓库.仓库名称 }
      - 序号: 2
        标题: 库存台账
        表: [库存]
        检索: { 模式: 库存, 主字段: 库存.规格名称快照 }
      - 序号: 3
        标题: 出入库流水
        表: [库存流水]
        检索: { 模式: 流水, 主字段: 库存流水.流水号 }
      - 序号: 4
        标题: 待入库
        表: [待入库单, 待入库明细]
        检索: { 模式: 待入库, 主字段: 待入库单.待入库单号 }
      - 序号: 5
        标题: 采购入库
        表: [采购入库单, 采购入库明细]
        检索: { 模式: 采购入库, 主字段: 采购入库单.采购单号 }
      - 序号: 6
        标题: 欠库
        表: [欠库]
        检索: { 模式: 欠库, 主字段: 欠库.规格名称快照 }
