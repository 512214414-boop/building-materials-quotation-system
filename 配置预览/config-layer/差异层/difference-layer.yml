# ════ 差异层 difference-layer.yml ════
# 仅存有意偏离标准推导的配置。标准推导能覆盖的（颜色/缺省/推算/去重/检索权重）
# 一律不写在这里。补全/缺省已移出 → 物理层字段级 缺省值。

# ── 预览显示注解（仅影响「配置预览面板.html」渲染；差异层含义不变）──
# 格式：# @col <键>: <中文表头>,<列宽(像素)>
# 以后改列名 / 加偏离维度 = 只改这里的注释，预览框架零改动。
# @col 对象: 对象,220
# @col 说明: 说明,440

差异:
  - 对象: 产品图片.显示
    提级到: 产品          # 图片真相在 品牌规格（每规格各有图），显示提到 产品 行
    聚合: 按规格取默认     # 产品行聚合各规格默认图
    说明: 图片真相在品牌规格（每规格各有图），显示提到产品行聚合取各规格默认图。
  - 对象: 产品.价格槽
    槽: 价格槽            # 售价/进价是记录集（recordSet）渲染入口，由框架 slot 接管
    说明: 多记录集（recordSet）渲染入口，由框架 slot 接管，不在普通字段里。
