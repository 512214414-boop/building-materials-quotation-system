  售价:
    # 2026-09-07 范式修正：父层 = 单位换算（L4，规格×单位 + 换算率），只引用直接父。
    #   业务含义：先定"这个规格能按什么单位卖、怎么折算"，价才有地方挂——没定义换算率的单位录不进价，
    #   杜绝"有价格却不知怎么折算库存"（如录了"20mm 按吨"却没定义 1 吨=几米）。
    #   价格类型 = 横向维度（零售/批发/工程），**不按客户/批量再分档**（用户 2026-09-07 定）。
    标识: sale_price
    表级配置:
