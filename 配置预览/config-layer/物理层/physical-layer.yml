  # 注：当前 Prisma 把它拆成 spec_unit + brand_unit_conversion 两张（历史错误），
  #     以本配置为正确模型，后续 DB 收敛合并。
  单位换算:
    标识: spec_unit
    表级配置:
      独立去重: []
      联合去重: [[外键规格, 外键单位]]
      全文检索: []
      索引: []
    字段:
      外键规格: { 标识: specId, 类型: 外键→品牌规格.编号, 检索: { 级别: }, 缺省值:  }
      外键单位: { 标识: unitId, 类型: 外键→单位.编号, 检索: { 级别: }, 缺省值:  }
      是否基准: { 标识: isBase, 类型: 布尔, 检索: { 级别: }, 缺省值:  }
      是否展示: { 标识: isDisplay, 类型: 布尔, 检索: { 级别: }, 缺省值:  }
