      内容哈希: { 标识: hash, 类型: 文本(64), 检索: { 级别: }, 缺省值:  }
      # 内容哈希 = 传图按哈希反查去重(同图不同规格共用底图) → 普通索引（与真实库 @@index([hash]) 一致）。
      排序: { 标识: sortOrder, 类型: 整数, 检索: { 级别: }, 缺省值:  }
      是否主图: { 标识: isMain, 类型: 整数, 检索: { 级别: }, 缺省值:  }

