# ════ 物理层 physical-layer.yml ════
# 客观全部原材料：所有表 + 字段。表级「表级配置」一处收纳结构声明：独立去重/联合去重(唯一键)、
#               全文检索(全文索引)、索引(普通 B-tree 索引)；字段级只留字段自身语义：
#               检索.级别(参与匹配+优先，应用层规则)、缺省值(字典兜底成员)。
#   表级配置 = 固定结构：四键每表必列、无值写空 []（显式空=审过不需要，区别于漏配；消费端零探测、按位取值）。
# v7 顶层定调：本文件 = 数据库表结构与索引的【唯一业务描述源】。建表 SQL 与索引脚本不再手工编写，
# 由解释器读全量本文件自动幂等输出（IF NOT EXISTS）。库自动行为不进配置，由解释器统一补齐。
# 配置只描述【业务事实】，不描述【机器动作】（契约 §3.1 词法三公理）：
#   · 缺省值(字段级) = 字典表【唯一名称字段】的兜底成员，如 分类.分类名称 缺省值: 未分类。
#     查哪一列没有歧义：外键已指明目标表，目标表的【唯一名称字段】（表级配置 独立去重 中的文本字段，
#     或所在联合去重组仅它一个字段）就是它的名称字段
#     （全表唯一一个），缺省值配在它上面——声明处即匹配处。
#     任何外键引用该字典留空 → 引擎按缺省值名称【直接写入】该字典表 → 撞上唯一约束(同名已存在)
#     → 直接取用已有那条记录的 id；写入成功 → 用新记录 id 关联（先写再用，引擎动作，
#     配置只声明"兜底成员叫什么名字"）。为什么不先查：兜底记录后续常被改名、补全，
#     先查大概率扑空，先写路径更短。
#     "未分类/普通品牌/个人业主" 属于各字典表自己的事实，写在被引用表自己的名称字段上，引用方零书写。
#     引擎动作(反查/建行/关联)由引擎统一执行，配置不写动作。
#   · 字段级【缺省】已整体退役(P7, 2026-09-06)：曾逐字段写 启用/0/否/""/1，
#     全是复读数据库 @default 的第二份真相；类型默认(0/否/"")与平台启停默认(启用)
#     一律以库为准、由引擎给，配置零书写。真正"必填但可暂不填"的只有外键引用，
#     其兜底已由被引用字典名称字段的 缺省值 表达。
#   · 唯一键 = 表级配置数组（2026-09-07 由字段级标记数组化：一处收纳、一处读取，不再扫字段归拢组合）：
#     【独立去重: [字段…]】每项 = 该字段在本表内【自己那一列】不重复（单列唯一）；
#     【联合去重: [[字段, 字段]…]】每组 = 组内字段【组合】不重复，分开看各自都允许重复（组合唯一）。
#     例：产品×品牌 = 联合去重: [[外键产品, 外键品牌]]；
#         客户     = 独立去重: [客户编码, 客户名称]（两条独立唯一键）。
#     禁止 组合(...) / 全局唯一 / 确保引用 / 字段级 `独立去重: 是` / `联合去重: N`（均已退役，
#     写了就是第二份真相、体检标红）。
#   · 检索级别 = 字段级【索引级数】(正整数：1级索引/2级索引…)。配了=该字段参与本表检索匹配；
#     数字小=命中优先(1级为主检索、2级为补充/别名)；同表同级别=同级并列(多字段同为1级=并列主索引)。
#     它是字段固有事实、只描述【本表内】，独立、不引用关系层级；与层级权重/排序分毫不相干。
#     曾用「检索: {本表权重: 主/次/辅}」文言三档——不可扩展、又像排序权重，P8 已退役为级别制。
#   · 全文检索 = 表级配置数组【全文检索: [字段…]】(列内容需要"全文级"检索能力，如 产品备注/描述 这类正文列)。
#     引擎直接读取：1 个 → 单列全文索引；多个 → 组合全文索引(与 去重 同构)。
#     配了它，建表声明即含 FULLTEXT 索引。这是列的数据检索性质(业务事实)——不需要的列写空 []；
#     它不是检索级别能推导的(级别只说"参与匹配"，不说数据库用哪种索引)，故必须显式声明（固定结构：无值写空 []）。
#     数据库如何实现(分词/匹配语法)是引擎职责，配置只声明"这列内容要全文级搜得到"。
#   · 索引 = 表级配置数组【索引: [字段…]】(这些列需要数据库【普通 B-tree 索引】: 业务常按它精确过滤/排序/关联 → 查得快)。
#     引擎直接读取（列表顺序 = 组合顺序）：1 个 → 单列普通索引；多个 → 组合普通索引；
#     与 去重/全文检索 同构(三种索引三种键: 去重→唯一、全文检索→全文、索引→普通)。
#     这是【人工业务决策】：哪些列值得建普通索引由人定、显式列；库自动有的写空 []——
#     主键(聚簇索引) / 外键列(库自动补索引) / 唯一约束(自带索引) / 被唯一键左前缀覆盖的组合 由解释器补齐或推导省去。
#     分工：检索级别 管"搜得到"(应用层规则，喂检索引擎，不进建表输出)；索引 管"查得快"(结构声明，进建表输出)。
#     人工普通索引已对齐真实库 @@index：逻辑外键列（库不会自动补索引）按真实访问路径显式声明；
#     status 单列历史索引 / 唯一键左前缀冗余等按干净模型不声明，收敛清单见 分层契约.md §6 O3（动 DB 时统一处理）。
# 键全中文；「标识」是给机器/数据库的英文名，你不用改、不用记。
# 关系、组织不在这里表达（那是关系层的事）。
# 类型值域（P15 精度定稿：物理层=表结构唯一描述源，类型必须可建表，模糊词=推不出的精度）：
#   主键        = 长整数自增(BIGINT UNSIGNED AUTO_INCREMENT)——平台默认，零书写；
#   主键(整数)  = 整数自增(INT UNSIGNED)——仅个别历史表显式标注（分类）。
#   外键→表.字段 = 引用，列型自动跟随目标主键（跟随推导，不重复声明）；
#                 后缀 (逻辑) = 只做逻辑引用、不建库级外键约束（如 进价→供应商，v11 解耦）。
#   文本(N)     = VARCHAR(N)；文本(不限) = 正文长文本(TEXT)；整数 = INT；布尔 = BOOLEAN；
#   长整数      = BIGINT UNSIGNED（跨域引用占位：目标域尚未登记，登记后升为 外键→表.编号(逻辑)）；
#   时间        = DATETIME（业务时间点：确认时间/补齐时间/最近入库时间）；
#   枚举        = 状态型整数（启停 1/0，默认启用由引擎给）；
#   小数(10，2)  = 精度显式（金额 10,2 / 换算率 10,4 / 坐标 10,7 / 数量 14,3 / 成本金额 14,2）。
# 引擎全局补齐列（单表零书写，边界①）：编号缺省的表补长整数自增主键；tenantId/legacyCode/
#   createdAt/updatedAt 全表统一；文本默认空串、整数默认 0、布尔默认否、枚举默认启用。
# 表/字段/唯一约束与 backend/prisma/schema.prisma 对齐；本文件 = 正确模型（默认值以库为准不复写）。
# 普通索引(表级配置 索引)声明与真实库 @@index 一致；库内其余历史索引（status×3 / 唯一键左前缀冗余 /
# FK 列重申 / product_image 缺 @@unique）按干净模型不声明，收敛清单见 分层契约.md §6 O3（动 DB 时统一处理）。

# ── 预览显示注解（仅影响「配置预览面板.html」渲染；DDL/契约工具忽略注释，配置含义不变）──
# 格式：# @col <字段键>: <中文表头>,<列宽(像素)>
# 以后改列名 / 加字段列 = 只改这里的注释，预览框架零改动。
# @col 标识: 字段,260
# @col 类型: 类型,180
# @col 检索: 检索.级别,150
# @col 缺省值: 缺省值,120
# （独立去重/联合去重/全文检索/索引 已数组化到各表「表级配置」，不再占用字段列——字段表瘦 4 列）

