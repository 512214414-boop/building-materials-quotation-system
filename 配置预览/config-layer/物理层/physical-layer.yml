      # 2026-09-07 修正：本表【不做唯一约束】——一个规格本来就有多张图（排序决定展示顺序）。
      #   ① 主图URL 退出唯一：URL 随存储/CDN 变化，不是稳定标识；
      #   ② 外键规格 退出唯一：只留它一个字段 = 独立去重 = "一个规格只能一张图"，与业务相反；
      #   ③ 图片重复与否的判定 = 【内容哈希】（下方 `内容哈希` + 表级配置 索引）：上传时按哈希反查，
      #      同图不同规格共用底图；这是应用层反查，不是唯一约束。
      中图URL: { 标识: mediumUrl, 类型: 文本(500), 检索: { 级别: }, 缺省值:  }
